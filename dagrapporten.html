<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0B1F3A;--navy-l:#1E3A5F;--teal:#4FD1A5;--teal-d:#3ab891;--bg:#111827;--card:#1f2937;--surface2:#263040;--border:rgba(255,255,255,.08);--text:#f1f5f9;--muted:#94a3b8;--red:#f04f5e;--amber:#f6a623;--green:#34d399;--blue:#60a5fa;--r:10px;--rs:6px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
.topbar{background:var(--navy);padding:0 1rem;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.topbar-logo{font-size:13px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.06em}
.topbar-logo span{color:var(--teal)}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-user{font-size:12px;color:rgba(255,255,255,.5)}
.btn-lo{font-family:'DM Sans',sans-serif;font-size:12px;background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.5);padding:4px 10px;border-radius:var(--rs);cursor:pointer}
.btn-lo:hover{color:#fff;border-color:rgba(255,255,255,.5)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--navy);border-top:1px solid rgba(255,255,255,.07);display:flex;z-index:40;height:60px}
.bn-item{flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;font-weight:600;color:rgba(255,255,255,.3);cursor:pointer;border:none;background:none;text-transform:uppercase;letter-spacing:.02em;transition:color .12s;padding:0;position:relative}
.bn-item.active{color:var(--teal)}
.bn-item .ic{font-size:18px;line-height:1}
.bn-badge{position:absolute;top:6px;right:calc(50% - 18px);background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:99px}
.content{padding:1rem;max-width:800px;margin:0 auto}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.page-title{font-size:18px;font-weight:700}
.page-sub{font-size:13px;color:var(--muted);margin-top:2px}
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1.25rem}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.stat.click{cursor:pointer;transition:border-color .15s}
.stat.click:hover,.stat.act{border-color:var(--teal);background:rgba(79,209,165,.1)}
.sv{font-size:22px;font-weight:700;line-height:1}
.sl{font-size:11px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.ss{font-size:12px;color:var(--muted);margin-top:4px}
.cr{color:var(--red)}.ca{color:var(--amber)}.cg{color:var(--green)}.cb{color:var(--blue)}.cn{color:var(--navy)}
button{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border-radius:var(--rs);border:1px solid var(--border);background:var(--card);color:var(--text);padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s}
button:hover{background:rgba(255,255,255,.06)}
button:disabled{opacity:.4;cursor:not-allowed}
button.teal{background:var(--teal);color:var(--navy);border-color:var(--teal);font-weight:600}
button.teal:hover{background:var(--teal-d)}
button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
button.primary:hover{background:var(--navy-l)}

.card-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}

.overlay.open{display:flex}
.modal{background:var(--card);border-radius:var(--r) var(--r) 0 0;padding:20px;width:100%;max-width:800px;max-height:90vh;overflow-y:auto}

label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],textarea,select{font-family:'DM Sans',sans-serif;font-size:15px;width:100%;border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;color:var(--text);background:var(--card);outline:none;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--teal)}
textarea{resize:vertical;min-height:80px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.pb{height:6px;background:var(--border);border-radius:99px;margin-top:6px;overflow:hidden}
.pf{height:100%;border-radius:99px;background:var(--teal);transition:width .4s}
.pf.am{background:var(--amber)}.pf.re{background:var(--red)}
.alert{border-radius:var(--r);padding:12px 16px;margin-bottom:1rem;font-size:13px}
.alert.warn{background:rgba(246,166,35,.1);border:1px solid rgba(246,166,35,.3);color:#fbbf24}
.alert.info{background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.3);color:#93c5fd}
.alert.success{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);color:#6ee7b7}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--muted);font-size:14px}
.divider{border:none;border-top:1px solid var(--border);margin:12px 0}
.tw{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:6px;width:90%;max-width:400px}
.toast{background:var(--navy);color:#fff;font-size:13px;padding:10px 16px;border-radius:var(--rs);animation:tin .2s ease;text-align:center}
.toast.err{background:var(--red)}.toast.ok{background:var(--green)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ld{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.ld.dk{border-color:rgba(0,0,0,.1);border-top-color:var(--navy)}
@keyframes sp{to{transform:rotate(360deg)}}
.section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:1rem 0 .5rem}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.75rem}
.tag{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:background .12s}
.tag.active{background:var(--navy);color:#fff;border-color:var(--navy)}
</style>

<script>
const SB='https://bstpobqvodljhpjzgnkp.supabase.co';
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdHBvYnF2b2RsamhwanpnbmtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MzEyODAsImV4cCI6MjA5NjEwNzI4MH0.zMy3hmD02DSCkVfAOh2URDqXm_WBFCYe8CgNkvWT_yI';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdHBvYnF2b2RsamhwanpnbmtwIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDUzMTI4MCwiZXhwIjoyMDk2MTA3MjgwfQ.2Nrgk7-TxZ-gIAFYhjcfNTFdm6g-6HaGIu3QGCEckPs';

function getSession(){try{return JSON.parse(localStorage.getItem('tbc_session'));}catch(e){return null;}}
function getMe(){try{return JSON.parse(localStorage.getItem('tbc_me'));}catch(e){return null;}}
function setMe(p){localStorage.setItem('tbc_me',JSON.stringify(p));}
function logout(){localStorage.removeItem('tbc_session');localStorage.removeItem('tbc_me');location.href='login.html';}
function hdr(svc=false){const s=getSession();const t=svc?SK:(s?s.access_token:'');return{'apikey':AK,'Authorization':'Bearer '+t,'Content-Type':'application/json','Prefer':'return=representation'};}
async function api(m,p,b,svc=false){const r=await fetch(SB+p,{method:m,headers:hdr(svc),body:b?JSON.stringify(b):undefined});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null;}
async function aApi(m,p,b,svc=false){const s=getSession();const tk=svc?SK:(s?s.access_token:'');const r=await fetch(SB+p,{method:m,headers:{'apikey':AK,'Authorization':'Bearer '+tk,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null;}
function v(id){return(document.getElementById(id)?.value||'').trim();}
function eur(n){return'€'+Number(n||0).toLocaleString('nl-NL',{minimumFractionDigits:0,maximumFractionDigits:0});}
function fdt(d){return new Date(d).toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'});}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0;}
function nowM(){return new Date().toISOString().slice(0,7);}
function nowD(){return new Date().toISOString().slice(0,10);}
function toast(msg,tp=''){const el=document.createElement('div');el.className='toast'+(tp?' '+tp:'');el.textContent=msg;let tw=document.getElementById('tw');if(!tw){tw=document.createElement('div');tw.id='tw';tw.className='tw';document.body.appendChild(tw);}tw.appendChild(el);setTimeout(()=>el.remove(),3500);}
function esc(s){return String(s).split("'").join("&apos;");}
async function refreshSession(){
  const s=getSession();
  if(!s||!s.refresh_token) return null;
  try{
    const res=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',
      headers:{'apikey':AK,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:s.refresh_token})
    });
    if(!res.ok) return null;
    const data=await res.json();
    if(data.access_token){
      localStorage.setItem('tbc_session',JSON.stringify(data));
      return data;
    }
  }catch(e){}
  return null;
}

async function checkAuth(){
  let s=getSession();
  if(!s||!s.access_token){localStorage.clear();location.replace('login.html');return null;}
  
  // Check if token is expired or about to expire (within 10 min)
  try{
    const payload=JSON.parse(atob(s.access_token.split('.')[1]));
    const expiresIn=(payload.exp*1000)-Date.now();
    if(expiresIn<600000){ // less than 10 minutes
      const newSession=await refreshSession();
      if(newSession) s=newSession;
      else if(expiresIn<0){localStorage.clear();location.replace('login.html');return null;}
    }
  }catch(e){}

  const me=getMe();
  if(me&&me.id)return me;
  try{
    const p=await api('GET','/rest/v1/profielen?id=eq.'+s.user.id);
    if(!p||!p.length)throw new Error('no profile');
    setMe(p[0]);return p[0];
  }catch(e){
    // Try refresh before giving up
    const newSession=await refreshSession();
    if(newSession){
      try{
        const p2=await api('GET','/rest/v1/profielen?id=eq.'+s.user.id);
        if(p2&&p2.length){setMe(p2[0]);return p2[0];}
      }catch(e2){}
    }
    localStorage.clear();location.replace('login.html');return null;
  }
}
function isAdmin(me){return me&&me.rol==='admin';}
function isRegioAdmin(me){return me&&(me.rol==='admin'||me.rol==='regio_admin');}
function isSuperAdmin(me){return me&&me.rol==='admin';}


let me=null, commits=[], dagrapporten=[], profielen=[], regios=[];
let editDagId=null, bevPend=null;

async function init(){
  me=await checkAuth(); if(!me)return;
  document.getElementById('topbar-user').textContent=me.naam||me.email;
  await loadData();
  const hash=location.hash;
  if(hash==='#commit') renderCommits();
  else renderDagrapporten();
}

async function loadData(){
  const isA=isAdmin(me); const m=nowM(); const today=nowD();
  regios=await api('GET','/rest/v1/regios?order=naam.asc')||[];
  const cu=isA
    ?'/rest/v1/commitments?datum=gte.'+m+'-01&order=datum.desc&select=*,profielen(naam,email,regio_id)'
    :'/rest/v1/commitments?user_id=eq.'+me.id+'&datum=gte.'+m+'-01&order=datum.desc';
  commits=await api('GET',cu)||[];
  const du=isA
    ?'/rest/v1/dagrapporten?datum=gte.'+m+'-01&order=datum.desc&select=*,profielen(naam,email)'
    :'/rest/v1/dagrapporten?user_id=eq.'+me.id+'&datum=gte.'+m+'-01&order=datum.desc';
  dagrapporten=await api('GET',du)||[];
  if(isA) profielen=await api('GET','/rest/v1/profielen')||[];
}

let activeTab='dag';
function switchTab(t){ activeTab=t; if(t==='dag') renderDagrapporten(); else renderCommits(); }

function renderDagrapporten(){
  activeTab='dag';
  const isA=isAdmin(me); const today=nowD(); const yesterday=getYesterday();
  const myDag=dagrapporten.find(d=>d.user_id===me.id&&d.datum===today);
  const yesterdayCommit=commits.find(c=>c.user_id===me.id&&c.datum===today&&!c.bevestigd)
    || commits.find(c=>c.user_id===me.id&&c.datum===yesterday&&!c.bevestigd);

  // Calculate maandstand from all dagrapporten this month
  const myDags=dagrapporten.filter(d=>d.user_id===me.id&&d.datum.startsWith(nowM()));
  const maandstand=myDags.reduce((s,d)=>s+(d.productie_vandaag||0),0);

  let h=`<div class="page-header"><div><div class="page-title">Dagrapporten</div></div></div>`;
  h+=`<div class="tag-row">
    <span class="tag ${activeTab==='dag'?'active':''}" onclick="switchTab('dag')">📋 Dagrapporten</span>
    <span class="tag ${activeTab==='commit'?'active':''}" onclick="switchTab('commit')">🎯 Commitments</span>
  </div>`;

  // Gisteren's commit zichtbaar maar niet bewerkbaar
  if(yesterdayCommit){
    h+=`<div class="alert info" style="margin-bottom:1rem">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">Commit van gister — niet bewerkbaar</div>
      <div style="font-size:16px;font-weight:700">${eur(yesterdayCommit.omzet_forecast)}</div>
      <div style="font-size:12px;margin-top:2px">${fdt(yesterdayCommit.datum)}</div>
      <button class="sm amber" style="margin-top:8px" onclick="openBev(${yesterdayCommit.id})">✓ Bevestig of je dit gehaald hebt</button>
    </div>`;
  }

  // Maandstand berekend
  h+=`<div class="alert success" style="margin-bottom:1rem">
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px">Maandstand (automatisch berekend)</div>
    <div style="font-size:20px;font-weight:700">${eur(maandstand)}</div>
    <div style="font-size:12px;color:#166534;margin-top:2px">Som van alle productie-intakes deze maand</div>
  </div>`;

  if(!myDag){
    h+=`<button class="teal full" onclick="openDagModal(null)" style="margin-bottom:1rem">+ Dagrapport van vandaag invullen</button>`;
  } else {
    h+=`<div class="alert success" style="margin-bottom:.75rem">✓ Dagrapport vandaag ingevuld. <span style="font-size:12px">Productie: ${eur(myDag.productie_vandaag)} · Morgen: ${eur(myDag.commit_morgen)}</span></div>`;
    h+=`<button class="sm full" onclick="openDagModal(${myDag.id})" style="margin-bottom:1rem">✏️ Bewerken</button>`;
  }

  if(isA){
    h+=`<div class="section-label">Status vandaag per medewerker</div>`;
    // Show all users including admin (as "jij")
  const allUsers=[{...me, naam:(me.naam||me.email)+' (jij)'},...profielen.filter(u=>u.id!==me.id&&u.rol!=='admin')];
  allUsers.forEach(u=>{
      const d=dagrapporten.find(x=>x.user_id===u.id&&x.datum===today);
      const reg=regios.find(r=>r.id===u.regio_id);
      const uDags=dagrapporten.filter(x=>x.user_id===u.id&&x.datum.startsWith(nowM()));
      const uMaand=uDags.reduce((s,x)=>s+(x.productie_vandaag||0),0);
      h+=`<div class="card" style="margin-bottom:.75rem">
        <div class="card-row">
          <div>
            <div class="row-main">${u.naam||u.email} ${reg?`<span class="badge b-user" style="margin-left:4px">${reg.naam}</span>`:''}</div>
            <div class="row-sub">Maand: ${eur(uMaand)} · Vandaag: ${d?eur(d.productie_vandaag):'—'} · Morgen: ${d?eur(d.commit_morgen):'—'}</div>
          </div>
          <div class="row-right"><span class="badge ${d?'b-opgelost':'b-open'}">${d?'✓':'✗'}</span></div>
        </div>
        ${d&&d.notitie?`<div style="padding:10px 16px;font-size:13px;color:var(--muted);background:var(--surface2);border-top:1px solid var(--border)">💬 ${d.notitie}</div>`:''}
      </div>`;
    });

    h+=`<div class="section-label">Historisch</div><div class="card">`;
    const uniq=[...new Set(dagrapporten.map(d=>d.datum))].sort().reverse().slice(0,14);
    uniq.forEach(d=>{
      const dags=dagrapporten.filter(x=>x.datum===d);
      const totP=dags.reduce((s,x)=>s+(x.productie_vandaag||0),0);
      h+=`<div class="card-row"><div><div class="row-main">${fdt(d)}</div><div class="row-sub">${dags.length} rapport${dags.length!==1?'en':''}</div></div><div class="row-right"><span style="font-size:14px;font-weight:700">${eur(totP)}</span></div></div>`;
    });
    h+=`</div>`;
  } else {
    h+=`<div class="section-label">Mijn dagrapporten</div><div class="card">`;
    const mine=dagrapporten.filter(d=>d.user_id===me.id).slice(0,14);
    if(!mine.length) h+=`<div class="empty">Nog geen dagrapporten.</div>`;
    else mine.forEach(d=>{
      h+=`<div class="card-row"><div><div class="row-main">${fdt(d.datum)}</div><div class="row-sub">Productie: ${eur(d.productie_vandaag)} · Morgen commit: ${eur(d.commit_morgen)}</div></div><div class="row-right"><button class="sm" onclick="openDagModal(${d.id})">✏️</button></div></div>`;
    });
    h+=`</div>`;
  }
  document.getElementById('content').innerHTML=h;
}

function getYesterday(){const d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10);}

function renderCommits(){
  activeTab='commit';
  const isA=isAdmin(me); const today=nowD();
  const unc=commits.filter(c=>c.user_id===me.id&&!c.bevestigd&&c.datum<today);
  let h=`<div class="page-header"><div><div class="page-title">Commitments</div></div><button class="teal sm" onclick="openCommitModal()">+ Nieuw</button></div>`;
  h+=`<div class="tag-row">
    <span class="tag" onclick="switchTab('dag')">📋 Dagrapporten</span>
    <span class="tag active" onclick="switchTab('commit')">🎯 Commitments</span>
  </div>`;
  if(unc.length) h+=`<div class="alert warn">⚠️ ${unc.length} commitment${unc.length>1?'s':''} te bevestigen.</div>`;
  if(isA){
    const perU={};
    commits.forEach(c=>{const uid=c.user_id;const n=c.profielen?(c.profielen.naam||c.profielen.email):'?';if(!perU[uid])perU[uid]={n,items:[]};perU[uid].items.push(c);});
    h+=`<div class="card">`;
    Object.keys(perU).forEach(uid=>{
      const u=perU[uid];
      h+=`<div style="padding:8px 16px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase">${u.n}</div>`;
      u.items.forEach(c=>h+=commitRowFull(c));
    });
    h+=`</div>`;
  } else {
    const mine=commits.filter(c=>c.user_id===me.id);
    h+=`<div class="card">${mine.length?mine.map(commitRowFull).join(''):'<div class="empty">Nog geen commitments.</div>'}</div>`;
  }
  document.getElementById('content').innerHTML=h;
}

function commitRowFull(c){
  const st=c.bevestigd?(c.gehaald?'gehaald':'gemist'):'open2';
  const sl=c.bevestigd?(c.gehaald?'Gehaald ✓':'Gemist ✗'):'Openstaand';
  const canBev=!c.bevestigd&&c.datum<=nowD()&&c.user_id===me.id;
  const canDel=isAdmin(me);
  const canEdit=isAdmin(me);
  return `<div class="card-row">
    <div style="flex:1">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap">
        <span style="font-size:15px;font-weight:700">${eur(c.omzet_forecast)}</span>
        ${c.bevestigd&&c.omzet_actuals!=null?`<span style="font-size:14px;font-weight:700;color:${c.gehaald?'var(--green)':'var(--red)'}">→ ${eur(c.omzet_actuals)}</span>`:''}
        <span class="badge b-${st}">${sl}</span>
      </div>
      <div style="font-size:12px;color:var(--muted)">${fdt(c.datum)}</div>
    </div>
    <div class="row-right">
      ${canBev?`<button class="sm amber" onclick="openBev(${c.id})">✓</button>`:''}
      ${canEdit?`<button class="sm" onclick="openEditCommit(${c.id})">✏️</button>`:''}
      ${canDel?`<button class="sm danger" onclick="delC(${c.id})">🗑</button>`:''}
    </div>
  </div>`;
}

function openDagModal(id){
  const d=id?dagrapporten.find(x=>x.id===id):null;
  editDagId=id||null;
  // Don't show maandstand field - it's calculated automatically
  document.getElementById('dm-pv').value=d?d.productie_vandaag:'';
  document.getElementById('dm-cm').value=d?d.commit_morgen:'';
  document.getElementById('dm-n').value=d?d.notitie||'':'';
  document.getElementById('ov-dag').classList.add('open');
}

async function saveDag(){
  const pv=parseFloat(document.getElementById('dm-pv').value)||0;
  const cm=parseFloat(document.getElementById('dm-cm').value)||0;
  const n=document.getElementById('dm-n').value.trim();
  const btn=document.getElementById('btn-dag-s');btn.disabled=true;btn.innerHTML='<span class="ld"></span>';
  try{
    const body={productie_vandaag:pv,commit_morgen:cm,notitie:n||null,user_id:me.id,datum:nowD()};
    if(editDagId) await api('PATCH','/rest/v1/dagrapporten?id=eq.'+editDagId,body);
    else await api('POST','/rest/v1/dagrapporten',body);
    document.getElementById('ov-dag').classList.remove('open');
    await loadData();renderDagrapporten();toast('Dagrapport opgeslagen.','ok');
  }catch(e){toast('Fout: '+e.message,'err');}finally{btn.disabled=false;btn.innerHTML='Opslaan';}
}

function openCommitModal(){
  const isA=isAdmin(me);
  const tom=new Date();tom.setDate(tom.getDate()+1);
  document.getElementById('cm-d').value=tom.toISOString().slice(0,10);
  document.getElementById('cm-o').value='';
  // Admin can pick user and past dates
  const wrap=document.getElementById('cm-user-wrap');
  if(isA){
    wrap.style.display='block';
    const allU=[{id:me.id,naam:(me.naam||me.email)+' (jij)'},...profielen.filter(u=>u.id!==me.id)];
    document.getElementById('cm-user').innerHTML=allU.map(u=>`<option value="${u.id}">${u.naam||u.email}</option>`).join('');
  } else {
    wrap.style.display='none';
  }
  document.getElementById('ov-commit').classList.add('open');
}

async function saveCommit(){
  const d=document.getElementById('cm-d').value;
  const o=parseFloat(document.getElementById('cm-o').value);
  if(!d||isNaN(o)){toast('Vul datum en omzet in.');return;}
  const isA=isAdmin(me);
  const selUid=isA&&document.getElementById('cm-user')?document.getElementById('cm-user').value:me.id;
  const selUser=isA?profielen.find(u=>u.id===selUid)||me:me;
  const btn=document.getElementById('btn-cm-s');btn.disabled=true;btn.innerHTML='<span class="ld"></span>';
  try{
    await api('POST','/rest/v1/commitments',{user_id:selUid,regio_id:selUser.regio_id||null,datum:d,omzet_forecast:o});
    document.getElementById('ov-commit').classList.remove('open');
    await loadData();renderCommits();
    toast('Commitment opgeslagen'+(isA&&selUid!==me.id?' voor '+( selUser.naam||selUser.email):'')+'.','ok');
  }catch(e){toast('Fout: '+e.message,'err');}finally{btn.disabled=false;btn.innerHTML='Opslaan';}
}

function openBev(id){
  bevPend=id;
  document.getElementById('bv-o').value='';
  document.getElementById('ov-bev').classList.add('open');
}

async function saveBev(){
  const o=parseFloat(document.getElementById('bv-o').value);
  if(isNaN(o)){toast('Vul werkelijke omzet in.');return;}
  const c=commits.find(x=>x.id===bevPend);
  const btn=document.getElementById('btn-bv-s');btn.disabled=true;btn.innerHTML='<span class="ld"></span>';
  try{
    await api('PATCH','/rest/v1/commitments?id=eq.'+bevPend,{bevestigd:true,omzet_actuals:o,gehaald:o>=(c.omzet_forecast||0)});
    document.getElementById('ov-bev').classList.remove('open');
    await loadData();renderDagrapporten();
    toast(o>=(c.omzet_forecast||0)?'Target gehaald! 🎉':'Bevestigd.','ok');
  }catch(e){toast('Fout: '+e.message,'err');}finally{btn.disabled=false;btn.innerHTML='Bevestigen';}
}

let editCommitId=null;
function openEditCommit(id){
  const c=commits.find(x=>x.id===id);if(!c)return;
  editCommitId=id;
  document.getElementById('ec-d').value=c.datum;
  document.getElementById('ec-o').value=c.omzet_forecast;
  document.getElementById('ov-ec').classList.add('open');
}
async function saveEditCommit(){
  const d=document.getElementById('ec-d').value;
  const o=parseFloat(document.getElementById('ec-o').value);
  if(!d||isNaN(o)){toast('Vul datum en omzet in.');return;}
  const btn=document.getElementById('btn-ec-s');btn.disabled=true;btn.innerHTML='<span class="ld"></span>';
  try{
    await api('PATCH','/rest/v1/commitments?id=eq.'+editCommitId,{datum:d,omzet_forecast:o});
    document.getElementById('ov-ec').classList.remove('open');
    await loadData();renderCommits();toast('Bijgewerkt.','ok');
  }catch(e){toast('Fout: '+e.message,'err');}finally{btn.disabled=false;btn.innerHTML='Opslaan';}
}

async function delC(id){
  if(!confirm('Verwijderen?'))return;
  try{await api('DELETE','/rest/v1/commitments?id=eq.'+id);commits=commits.filter(c=>c.id!==id);await loadData();renderCommits();toast('Verwijderd.');}
  catch(e){toast('Fout: '+e.message,'err');}
}

init();

</script>
</body>
</html>
