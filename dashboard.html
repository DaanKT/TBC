<html lang="nl">
<head>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c14;--surface:#0e1420;--surface2:#141926;--surface3:#1a2133;--surface4:#212840;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);--border3:rgba(255,255,255,.22);
  --text:#e8ecf4;--text2:#8a97b0;--text3:#4a5568;
  --teal:#00d4a0;--teal2:#00b389;--teal3:rgba(0,212,160,.09);
  --gold:#f5a623;--gold2:rgba(245,166,35,.09);
  --red:#ff4757;--red2:rgba(255,71,87,.09);
  --green:#2ed573;--green2:rgba(46,213,115,.09);
  --blue:#4d9fff;--blue2:rgba(77,159,255,.09);
  --purple:#a855f7;--purple2:rgba(168,85,247,.09);
  --r:14px;--rs:10px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:72px}
.topbar{background:rgba(8,12,20,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:0 1rem;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;border-bottom:1px solid var(--border)}
.topbar-logo{font-size:13px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.06em}
.topbar-logo span{color:var(--teal)}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-user{font-size:12px;color:var(--text3)}
.btn-lo{font-family:'DM Sans',sans-serif;font-size:12px;background:none;border:1px solid var(--border2);color:var(--text3);padding:4px 10px;border-radius:var(--rs);cursor:pointer;transition:color .15s}
.btn-lo:hover{color:var(--text)}
.btn-sm-teal{font-family:'DM Sans',sans-serif;font-size:12px;background:var(--teal3);border:1px solid rgba(0,212,160,.2);color:var(--teal);padding:4px 10px;border-radius:var(--rs);cursor:pointer;font-weight:600}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(8,12,20,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:40;height:60px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 4px}
.bottom-nav::-webkit-scrollbar{display:none}
.bn-item{min-width:60px;flex:1;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;font-weight:600;color:var(--text3);cursor:pointer;border:none;background:none;text-transform:uppercase;letter-spacing:.02em;transition:color .15s}
.bn-item.active{color:var(--teal)}
.bn-item .ic{font-size:19px;line-height:1}
.bn-dot{width:4px;height:4px;border-radius:50%;background:var(--teal);opacity:0;margin-top:1px}
.bn-item.active .bn-dot{opacity:1}
.content{padding:1rem;max-width:760px;margin:0 auto}
button{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border-radius:var(--rs);border:1px solid var(--border2);background:var(--surface2);color:var(--text);padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .12s}
button:hover{border-color:var(--border3);background:var(--surface3)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--teal);color:#000;border-color:var(--teal);font-weight:700}
button.primary:hover{background:var(--teal2)}
button.amber{background:var(--gold2);color:var(--gold);border-color:rgba(245,166,35,.25)}
button.danger{color:var(--red);border-color:rgba(255,71,87,.25);background:var(--red2)}
button.sm{font-size:11px;padding:5px 10px}
button.full{width:100%;justify-content:center}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:.875rem}
.card-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.card-row:last-child{border-bottom:none}
.card-row.click{cursor:pointer;transition:background .1s}
.card-row.click:hover{background:var(--surface2)}
.card-row.act{background:var(--teal3);border-left:2px solid var(--teal);padding-left:12px}
.row-main{font-size:14px;font-weight:600;color:var(--text)}
.row-sub{font-size:12px;color:var(--text2);margin-top:2px}
.row-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.sv{font-size:22px;font-weight:800;line-height:1;letter-spacing:-.02em}
.sl{font-size:10px;color:var(--text3);margin-top:5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.ss{font-size:12px;color:var(--text2);margin-top:3px}
.ct{color:var(--teal)}.cr{color:var(--red)}.ca{color:var(--gold)}.cg{color:var(--green)}.cb{color:var(--blue)}.cp{color:var(--purple)}
.pb{height:4px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-top:6px}
.pf{height:100%;border-radius:99px;background:var(--teal);transition:width .5s}
.pf.am{background:var(--gold)}.pf.re{background:var(--red)}
.section-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:1.25rem 0 .6rem;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid;white-space:nowrap}
.b-verstuurd{background:var(--blue2);color:var(--blue);border-color:rgba(77,159,255,.2)}
.b-follow_up{background:var(--gold2);color:var(--gold);border-color:rgba(245,166,35,.2)}
.b-gewonnen{background:var(--green2);color:var(--green);border-color:rgba(46,213,115,.2)}
.b-verloren{background:var(--red2);color:var(--red);border-color:rgba(255,71,87,.2)}
.b-hoog{background:var(--red2);color:var(--red);border-color:rgba(255,71,87,.2)}
.b-open{background:var(--gold2);color:var(--gold);border-color:rgba(245,166,35,.2)}
.b-admin{background:var(--teal3);color:var(--teal);border-color:rgba(0,212,160,.2)}
.b-gehaald{background:var(--green2);color:var(--green);border-color:rgba(46,213,115,.2)}
.b-gemist{background:var(--red2);color:var(--red);border-color:rgba(255,71,87,.2)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:20px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;border:1px solid var(--border2);border-bottom:none}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:99px;margin:0 auto 16px}
.mt{font-size:16px;font-weight:700;margin-bottom:4px;color:var(--text)}
.ms{font-size:13px;color:var(--text2);margin-bottom:16px}
.field{margin-bottom:12px}
label{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],input[type=url],textarea,select{font-family:'DM Sans',sans-serif;font-size:14px;width:100%;border:1px solid var(--border2);border-radius:var(--rs);padding:10px 12px;color:var(--text);background:var(--surface2);outline:none;-webkit-appearance:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--teal);background:var(--surface3)}
textarea{resize:vertical;min-height:80px;line-height:1.5}
select option{background:var(--surface2);color:var(--text)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.alert{border-radius:var(--r);padding:11px 14px;margin-bottom:1rem;font-size:13px;display:flex;align-items:flex-start;gap:8px}
.alert.warn{background:var(--gold2);border:1px solid rgba(245,166,35,.2);color:var(--gold)}
.alert.danger{background:var(--red2);border:1px solid rgba(255,71,87,.2);color:var(--red)}
.alert.success{background:var(--green2);border:1px solid rgba(46,213,115,.2);color:var(--green)}
.alert.info{background:var(--blue2);border:1px solid rgba(77,159,255,.2);color:var(--blue)}
.empty{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:14px}
.tw{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:6px;width:90%;max-width:400px;pointer-events:none}
.toast{background:var(--surface2);color:var(--text);font-size:13px;padding:11px 16px;border-radius:var(--rs);animation:tin .2s ease;text-align:center;border:1px solid var(--border2);pointer-events:all;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.toast.err{background:var(--red2);color:var(--red);border-color:rgba(255,71,87,.3)}
.toast.ok{background:var(--green2);color:var(--green);border-color:rgba(46,213,115,.3)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.ld{display:inline-block;width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.dp{max-height:0;overflow:hidden;transition:max-height .35s ease}
.dp.open{max-height:3000px}
.di{padding:14px}
.chev{transition:transform .2s;display:inline-block;color:var(--text3)}
.chev.open{transform:rotate(180deg)}
.search-bar{font-family:'DM Sans',sans-serif;font-size:14px;width:100%;border:1px solid var(--border2);border-radius:var(--rs);padding:10px 14px;color:var(--text);background:var(--surface2);outline:none;margin-bottom:1rem;transition:border-color .15s}
.search-bar:focus{border-color:var(--teal)}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.tag{font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid var(--border2);background:var(--surface2);cursor:pointer;color:var(--text2);transition:all .12s;font-weight:500}
.tag.active{background:var(--teal3);color:var(--teal);border-color:rgba(0,212,160,.25)}
@media(min-width:768px){
  .content{padding:1.5rem 2rem}
  .stats-row{grid-template-columns:repeat(4,1fr)}
  body{padding-bottom:0}
  .bottom-nav{display:none}
}

</style>
</head>

<script>

const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdHBvYnF2b2RsamhwanpnbmtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MzEyODAsImV4cCI6MjA5NjEwNzI4MH0.zMy3hmD02DSCkVfAOh2URDqXm_WBFCYe8CgNkvWT_yI';

function getSession(){try{return JSON.parse(localStorage.getItem('tbc_session'));}catch(e){return null;}}
function getMe(){try{return JSON.parse(localStorage.getItem('tbc_me'));}catch(e){return null;}}
function setMe(p){localStorage.setItem('tbc_me',JSON.stringify(p));}
function logout(){localStorage.removeItem('tbc_session');localStorage.removeItem('tbc_me');location.href='login.html';}
function hdr(svc=false){const s=getSession();const t=svc?SK:(s?s.access_token:'');return{'apikey':AK,'Authorization':'Bearer '+t,'Content-Type':'application/json','Prefer':'return=representation'};}
async function api(m,p,b,svc=false){const r=await fetch(SB+p,{method:m,headers:hdr(svc),body:b?JSON.stringify(b):undefined});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null;}
function v(id){return(document.getElementById(id)?.value||'').trim();}
function eur(n){return'€'+Number(n||0).toLocaleString('nl-NL',{minimumFractionDigits:0,maximumFractionDigits:0});}
function fdt(d){return new Date(d).toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'});}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0;}
function nowM(){return new Date().toISOString().slice(0,7);}
function nowD(){return new Date().toISOString().slice(0,10);}
function esc(s){return String(s).split("'").join("&apos;");}
function toast(msg,tp=''){const el=document.createElement('div');el.className='toast'+(tp?' '+tp:'');el.textContent=msg;let tw=document.getElementById('tw');tw.appendChild(el);setTimeout(()=>el.remove(),3500);}
function isAdmin(me){return me&&me.rol==='admin';}
function isSuperAdmin(me){return me&&me.rol==='admin';}
function isRegioAdmin(me){return me&&(me.rol==='admin'||me.rol==='regio_admin');}
async function refreshSession(){const s=getSession();if(!s||!s.refresh_token)return null;try{const r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':AK,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});if(!r.ok)return null;const d=await r.json();if(d.access_token){localStorage.setItem('tbc_session',JSON.stringify(d));return d;}}catch(e){}return null;}
async function checkAuth(){let s=getSession();if(!s||!s.access_token){localStorage.clear();location.replace('login.html');return null;}try{const pl=JSON.parse(atob(s.access_token.split('.')[1]));const exp=(pl.exp*1000)-Date.now();if(exp<600000){const ns=await refreshSession();if(ns)s=ns;else if(exp<0){localStorage.clear();location.replace('login.html');return null;}}}catch(e){}const me=getMe();if(me&&me.id)return me;try{const p=await api('GET','/rest/v1/profielen?id=eq.'+s.user.id);if(!p||!p.length)throw new Error();setMe(p[0]);return p[0];}catch(e){const ns=await refreshSession();if(ns){try{const p2=await api('GET','/rest/v1/profielen?id=eq.'+ns.user.id);if(p2&&p2.length){setMe(p2[0]);return p2[0];}}catch(e2){}}localStorage.clear();location.replace('login.html');return null;}}
function getWerkdagen(y,m){const d=new Date(y,m,0).getDate();let w=0;for(let i=1;i<=d;i++){const dg=new Date(y,m-1,i).getDay();if(dg!==0&&dg!==6)w++;}return w;}
function getWerkdagenTot(y,m,dag){let w=0;for(let i=1;i<=dag;i++){const dg=new Date(y,m-1,i).getDay();if(dg!==0&&dg!==6)w++;}return w;}
function getRestWerkdagen(y,m,dag){const tot=new Date(y,m,0).getDate();let w=0;for(let i=dag+1;i<=tot;i++){const dg=new Date(y,m-1,i).getDay();if(dg!==0&&dg!==6)w++;}return w;}
function getYesterday(){const d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10);}

let me=null,regios=[],targets=[],commits=[],dagrapporten=[],profielen=[],correcties=[],adminRegios=[];
let bevCommitId=null,adminCommitUID=null,targetEditUID=null,corrUID=null,corrNaam=null,openMedewerker=null;
let notifTarget='all',notifTargetId=null;
let selectedHumeur=null;

async function init(){
  me=await checkAuth();if(!me)return;
  document.getElementById('topbar-user').textContent=(me.naam||me.email)+(isSuperAdmin(me)?' (Admin)':isRegioAdmin(me)?' (Regio-admin)':'');
  await loadData();
  if(isRegioAdmin(me)) renderAdmin();
  else renderMedewerker();
  registerServiceWorker();
  // Toon tour bij eerste bezoek na 1.5s
  setTimeout(()=>{if(!localStorage.getItem('tbc_tour_v2'))startTour();},1500);
}

async function loadData(){
  const isA=isRegioAdmin(me);const m=nowM();
  regios=await api('GET','/rest/v1/regios?order=naam.asc')||[];
  targets=await api('GET','/rest/v1/targets?order=periode.desc')||[];
  if(isA){
    profielen=await api('GET','/rest/v1/profielen')||[];
    adminRegios=isSuperAdmin(me)?regios.map(r=>({regio_id:r.id})):await api('GET','/rest/v1/admin_regios?user_id=eq.'+me.id)||[];
    commits=await api('GET','/rest/v1/commitments?datum=gte.'+m+'-01&order=datum.desc&select=*,profielen(naam,email,regio_id)')||[];
    dagrapporten=await api('GET','/rest/v1/dagrapporten?datum=gte.'+m+'-01&order=datum.desc&select=*,profielen(naam,email,regio_id)')||[];
    correcties=await api('GET','/rest/v1/correcties?datum=gte.'+m+'-01&order=aangemaakt_op.desc')||[];
  } else {
    if(me.regio_id) profielen=await api('GET','/rest/v1/profielen?regio_id=eq.'+me.regio_id+'&rol=eq.gebruiker')||[];
    commits=await api('GET','/rest/v1/commitments?datum=gte.'+m+'-01&order=datum.desc&user_id=eq.'+me.id)||[];
    dagrapporten=await api('GET','/rest/v1/dagrapporten?datum=gte.'+m+'-01&order=datum.desc&user_id=eq.'+me.id)||[];
    correcties=await api('GET','/rest/v1/correcties?datum=gte.'+m+'-01&user_id=eq.'+me.id)||[];
  }
}

function calcActuals(userId){
  const m=nowM();
  const dagA=dagrapporten.filter(d=>d.user_id===userId&&d.datum.startsWith(m)).reduce((s,d)=>s+(d.productie_vandaag||0),0);
  const corrA=correcties.filter(c=>c.user_id===userId).reduce((s,c)=>s+(c.bedrag||0),0);
  return dagA+corrA;
}
function calcStreak(userId){
  const bev=commits.filter(c=>c.user_id===userId&&c.bevestigd).sort((a,b)=>b.datum.localeCompare(a.datum));
  let s=0;for(const c of bev){if(c.gehaald)s++;else break;}return s;
}

// ── TYPING ANIMATION ─────────────────────────────────────
const quotes=['Always play to win.','Elke dag beter dan gisteren.','Focus. Execute. Win.','Jij bepaalt de uitkomst.','Geen excuses. Alleen resultaten.','De beste deal is de volgende.'];
let qi=0,ci=0,deleting=false;
function startTyping(){
  const el=document.getElementById('typing-quote');
  if(!el)return;
  const q=quotes[qi];
  if(!deleting){el.innerHTML=q.slice(0,ci+1)+'<span class="cursor"></span>';ci++;if(ci===q.length){deleting=true;setTimeout(startTyping,2200);return;}}
  else{el.innerHTML=q.slice(0,ci-1)+'<span class="cursor"></span>';ci--;if(ci===0){deleting=false;qi=(qi+1)%quotes.length;setTimeout(startTyping,400);return;}}
  setTimeout(startTyping,deleting?38:78);
}

// ── AI COACHING TIP ───────────────────────────────────────
function getTip(actuals,target,maandPct){
  const actualsPct=target?pct(actuals,target):0;
  const achterPct=maandPct-actualsPct;
  if(achterPct<=-5) return {title:'🟢 Je loopt voor op schema!',body:'Goed bezig. Houd dit tempo vast en probeer vandaag een extra deal te pushen. Momentum is alles.',color:'var(--green)'};
  if(achterPct<=5) return {title:'🟡 Je zit op schema',body:'Precies op koers. Focus op kwaliteit over kwantiteit vandaag.',color:'var(--teal)'};
  if(achterPct<=15) return {title:'🟠 Licht achter op schema',body:`Je bent ${achterPct}% achter. Dat is 1-2 extra deals. Welke warme prospect staat al 2+ dagen open? Bel die als eerste.`,color:'var(--gold)'};
  return {title:'🔴 Flink achter — actie vereist',body:'Focus alleen op warme leads met korte beslistijd. Geen koude acquisitie vandaag. Kwaliteit over kwantiteit.',color:'var(--red)'};
}

// ── MEDEWERKER VIEW ───────────────────────────────────────
function renderMedewerker(){
  const m=nowM();const today=nowD();const yesterday=getYesterday();
  const[y,mo]=m.split('-').map(Number);
  const dagVM=new Date().getDate();
  const uur=new Date().getHours();
  const wTot=getWerkdagen(y,mo);
  const wTotNu=getWerkdagenTot(y,mo,dagVM);
  const wRest=getRestWerkdagen(y,mo,dagVM);
  const myTarget=targets.find(t=>t.type==='persoon'&&t.user_id===me.id&&t.periode===m);
  const actuals=calcActuals(me.id);
  const target=myTarget?.omzet_target||0;
  const perDag=target?Math.round(target/wTot):0;
  const verwacht=perDag*wTotNu;
  const achter=verwacht-actuals;
  const maandPct=Math.round((wTotNu/wTot)*100);
  const actualsPct=target?pct(actuals,target):0;
  const onTrack=actualsPct>=maandPct;
  const streak=calcStreak(me.id);
  const myReg=regios.find(r=>r.id===me.regio_id);
  const todayDag=dagrapporten.find(d=>d.user_id===me.id&&d.datum===today);
  const ystDag=dagrapporten.find(d=>d.user_id===me.id&&d.datum===yesterday);
  const ystCommit=commits.find(c=>c.user_id===me.id&&c.datum===today&&!c.bevestigd)||commits.find(c=>c.user_id===me.id&&c.datum===yesterday&&!c.bevestigd);
  const nuNodig=wRest>0&&target?Math.round((target-actuals)/wRest):0;
  const achterPct=target?Math.round((achter/target)*100):0;
  const notitieVerplicht=achterPct>=15;
  const voornaam=me.naam?.split(' ')[0]||'';
  const begroeting=uur<12?'Goedemorgen':uur<18?'Goedemiddag':'Goedenavond';
  const begroetingEmoji=uur<12?'☀️':uur<18?'👋':'🌙';

  document.getElementById('tbr').innerHTML='';
  let h='';

  // TYPING CARD
  h+=`<div class="typing-card" id="tour-greeting">
    <div class="typing-greeting">${begroeting} ${voornaam}! ${begroetingEmoji}</div>
    <div class="typing-quote" id="typing-quote"><span class="cursor"></span></div>
    <div class="typing-sub">Dag ${wTotNu} van ${wTot} werkdagen · ${maandPct}% van de maand</div>
  </div>`;

  // COMMIT GISTEREN BEVESTIGEN
  if(ystCommit){
    h+=`<div style="background:linear-gradient(135deg,var(--surface2),var(--surface3));border-radius:var(--r);padding:14px;margin-bottom:1rem;border:1px solid rgba(0,212,160,.2)">
      <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px">Commit was <span style="color:var(--teal)">${eur(ystCommit.omzet_forecast)}</span> — gehaald?</div>
      <div style="display:flex;gap:8px">
        <button onclick="quickBev(${ystCommit.id})" class="primary full" style="flex:1">✓ Ja, gehaald!</button>
        <button onclick="openBevModal(${ystCommit.id})" class="full" style="flex:1">Gedeeltelijk</button>
      </div>
    </div>`;
  } else {
    // Gisteren commit check tonen
    const ystBevestigd=commits.find(c=>c.user_id===me.id&&(c.datum===yesterday||c.datum===today)&&c.bevestigd);
    if(ystBevestigd){
      h+=`<div style="background:${ystBevestigd.gehaald?'var(--green2)':'var(--red2)'};border:1px solid ${ystBevestigd.gehaald?'rgba(46,213,115,.2)':'rgba(255,71,87,.2)'};border-radius:var(--r);padding:12px 14px;margin-bottom:1rem">
        <div style="font-size:12px;font-weight:700;color:${ystBevestigd.gehaald?'var(--green)':'var(--red)'}">
          ${ystBevestigd.gehaald?'✅ Gisteren commit gehaald!':'❌ Gisteren commit gemist'}
        </div>
        <div style="font-size:12px;color:var(--text2);margin-top:3px">
          Commit: ${eur(ystBevestigd.omzet_forecast)} · Werkelijk: ${eur(ystBevestigd.omzet_actuals)}
          ${!ystBevestigd.gehaald&&ystDag?.notitie?`<div style="margin-top:4px;font-style:italic;font-size:11px;color:var(--text3)">Plan was: ${ystDag.notitie}</div>`:''}
        </div>
      </div>`;
    }
  }

  // STREAK
  if(streak>0){
    h+=`<div class="streak-card" id="tour-streak">
      <div style="font-size:26px">🔥</div>
      <div style="flex:1"><div style="font-size:16px;font-weight:800;color:var(--gold)">${streak} dag${streak!==1?'en':''} op rij</div><div style="font-size:12px;color:var(--text3);margin-top:2px">Commit gehaald — ga zo door!</div></div>
    </div>`;
  }

  // ON TRACK BANNER
  if(target>0){
    h+=`<div style="background:${onTrack?'var(--green2)':'var(--red2)'};border:1px solid ${onTrack?'rgba(46,213,115,.2)':'rgba(255,71,87,.2)'};border-radius:var(--r);padding:12px 14px;margin-bottom:1rem" id="tour-track">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="font-size:13px;font-weight:700;color:${onTrack?'var(--green)':'var(--red)'}">${onTrack?'🟢 Op schema':'🔴 Achter op schema'}</div>
        <div style="font-size:12px;font-weight:700;color:${onTrack?'var(--green)':'var(--red)'}">${actualsPct}% vs ${maandPct}% norm</div>
      </div>
      <div style="height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;position:relative">
        <div style="position:absolute;top:0;left:0;width:${maandPct}%;height:100%;background:rgba(255,255,255,.1);border-radius:99px"></div>
        <div style="width:${actualsPct}%;height:100%;background:${onTrack?'var(--green)':'var(--red)'};border-radius:99px;position:relative;z-index:1;transition:width .5s"></div>
      </div>
    </div>`;
  }

  // STATS
  h+=`<div class="stats-row" id="tour-stats">
    <div class="stat"><div class="sv ct">${eur(actuals)}</div><div class="sl">Actuals</div><div class="ss">${target?'Target: '+eur(target):'Geen target'}</div></div>
    <div class="stat"><div class="sv ${achter>0?'cr':'cg'}">${achter>0?'-':'+'}${eur(Math.abs(achter))}</div><div class="sl">${achter>0?'Achterstand':'Voorsprong'}</div><div class="ss">Verwacht: ${eur(verwacht)}</div></div>
    <div class="stat"><div class="sv ca">${eur(perDag)}</div><div class="sl">Per werkdag</div><div class="ss">Basis target</div></div>
    <div class="stat"><div class="sv ${nuNodig>perDag?'cr':'cg'}">${eur(nuNodig)}</div><div class="sl">Nu/dag nodig</div><div class="ss">${wRest} werkdagen rest</div></div>
  </div>`;

  // AI TIP
  if(target>0){
    const tip=getTip(actuals,target,maandPct);
    h+=`<div class="tip-card" id="tour-tip">
      <div class="tip-label" style="color:${tip.color}">${tip.title}</div>
      <div class="tip-body">${tip.body}</div>
    </div>`;
  }

  // PUSH OPT-IN
  if('Notification' in window && Notification.permission==='default'){
    h+=`<div style="background:var(--gold2);border:1px solid rgba(245,166,35,.2);border-radius:var(--r);padding:12px 14px;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;gap:12px">
      <div><div style="font-size:13px;font-weight:700;color:var(--gold)">🔔 Schakel meldingen in</div><div style="font-size:12px;color:var(--text2);margin-top:2px">Ontvang dagelijkse coaching tips</div></div>
      <button onclick="requestPushPermission()" class="sm amber">Inschakelen</button>
    </div>`;
  } else if('Notification' in window && Notification.permission==='granted'){
    h+=`<div style="background:var(--green2);border:1px solid rgba(46,213,115,.15);border-radius:var(--r);padding:10px 14px;margin-bottom:1rem;font-size:12px;color:var(--green)">✅ Meldingen ingeschakeld</div>`;
  }

  // REGIO WIDGET
  if(myReg){
    const regTarget=targets.find(t=>t.type==='regio'&&t.regio_id===myReg.id&&t.periode===m);
    const regUsers=profielen.filter(u=>u.regio_id===myReg.id&&u.rol==='gebruiker');
    const allUsers=regUsers.length?regUsers:[{id:me.id}];
    const regActuals=allUsers.reduce((s,u)=>s+calcActuals(u.id),0);
    const regT=regTarget?.omzet_target||0;
    const regPct=regT?pct(regActuals,regT):0;
    h+=`<div class="section-label">Regio ${myReg.naam}</div>
    <div class="card" style="margin-bottom:1rem">
      <div style="padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)">
        <div><div style="font-size:18px;font-weight:800;color:var(--teal)">${eur(regActuals)}</div><div style="font-size:12px;color:var(--text2)">${regT?'Target: '+eur(regT):'Geen regio-target'}</div></div>
        ${regT?`<span style="font-size:18px;font-weight:800;color:${regPct>=maandPct?'var(--green)':'var(--red)'}">${regPct}%</span>`:''}
      </div>
      ${allUsers.map(u=>{const ua=calcActuals(u.id);const ut=targets.find(t=>t.type==='persoon'&&t.user_id===u.id&&t.periode===m);const up=ut?pct(ua,ut.omzet_target):null;const isMe=u.id===me.id;return `<div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)"><div style="font-size:13px;font-weight:${isMe?'700':'400'}">${isMe?'Jij':(u.naam||u.email)}</div><div style="text-align:right"><div style="font-size:13px;font-weight:700;color:var(--teal)">${eur(ua)}</div>${up!==null?`<div style="font-size:11px;color:${up>=maandPct?'var(--green)':'var(--red)'}">${up}%</div>`:''}</div></div>`;}).join('')}
    </div>`;
  }

  // DAGELIJKSE CHECK-IN
  const vandaagCommit=ystDag?.commit_morgen||null;
  h+=`<div class="section-label" id="tour-checkin">Dagelijkse check-in${todayDag?' ✓':''}</div>
  <div style="background:var(--surface2);border-radius:var(--r);padding:16px;margin-bottom:1rem;border:1px solid var(--border2)">
    ${vandaagCommit?`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:10px 12px;background:var(--teal3);border-radius:var(--rs);border:1px solid rgba(0,212,160,.15)">
      <div><div style="font-size:10px;color:var(--teal);text-transform:uppercase;font-weight:700;letter-spacing:.05em">Commit vandaag</div><div style="font-size:16px;font-weight:800;color:var(--teal)">${eur(vandaagCommit)}</div></div>
      <div style="font-size:20px">🎯</div>
    </div>`:''}
    ${ystDag?`<div style="background:rgba(255,255,255,.04);border-radius:var(--rs);padding:10px 12px;margin-bottom:12px;border:1px solid var(--border)">
      <div style="font-size:10px;color:var(--text3);text-transform:uppercase;font-weight:600;letter-spacing:.05em;margin-bottom:3px">Gisteren</div>
      <div style="font-size:13px;color:var(--text2)">Productie: <strong style="color:var(--text)">${eur(ystDag.productie_vandaag)}</strong> · Commit vandaag: <strong style="color:var(--teal)">${eur(ystDag.commit_morgen)}</strong></div>
      ${ystDag.notitie?`<div style="font-size:12px;color:var(--text3);margin-top:4px;font-style:italic">Plan: ${ystDag.notitie}</div>`:''}
    </div>`:''}

    <div class="ci-field">
      <span class="ci-label">Hoe voel je je vandaag?</span>
      <div class="humeur-row" id="humeur-row">
        ${['😫','😕','😐','🙂','🔥'].map((e,i)=>`<button class="humeur-btn${todayDag&&todayDag.humeur===(i+1)?' selected':''}" onclick="selectHumeur(${i+1})">${e}</button>`).join('')}
      </div>
    </div>
    <div class="ci-field">
      <span class="ci-label">Productie intake vandaag (€)</span>
      <input class="ci-input" type="number" id="ci-pv" value="${todayDag?todayDag.productie_vandaag:''}" placeholder="0" min="0" step="100"/>
    </div>
    <div class="ci-field">
      <span class="ci-label">Commit voor morgen (€)</span>
      <input class="ci-input" type="number" id="ci-cm" value="${todayDag?todayDag.commit_morgen:''}" placeholder="0" min="0" step="100"/>
    </div>
    <div class="ci-field">
      <span class="ci-label">Top 3 acties voor morgen</span>
      <textarea class="ci-input" id="ci-top3" placeholder="1. ...&#10;2. ...&#10;3. ...">${todayDag?.top3_acties||''}</textarea>
    </div>
    <div class="ci-field">
      <span class="ci-label" style="${notitieVerplicht?'color:var(--red)':''}">
        ${notitieVerplicht?'⚠️ Hoe ga jij je shit fixen? (verplicht)':'Blokkades / notitie'}
      </span>
      <textarea class="ci-input" id="ci-n" placeholder="${notitieVerplicht?'Verplicht als je meer dan 15% achterloopt...':'Optioneel...'}" style="border-color:${notitieVerplicht?'rgba(255,71,87,.4)':'var(--border2)'}">${todayDag?.notitie||''}</textarea>
    </div>
    <button onclick="saveCheckin(${notitieVerplicht})" class="primary full" style="margin-top:4px">${todayDag?'Check-in bijwerken':'Check-in opslaan'}</button>
  </div>`;

  document.getElementById('content').innerHTML=h;
  setTimeout(startTyping,300);
}

function selectHumeur(val){
  selectedHumeur=val;
  document.querySelectorAll('.humeur-btn').forEach((b,i)=>b.classList.toggle('selected',i+1===val));
}

async function saveCheckin(notitieVerplicht){
  const pv=parseFloat(document.getElementById('ci-pv').value)||0;
  const cm=parseFloat(document.getElementById('ci-cm').value)||0;
  const n=document.getElementById('ci-n').value.trim();
  const top3=document.getElementById('ci-top3').value.trim();
  if(notitieVerplicht&&!n){toast('Vul in hoe je je shit gaat fixen. Dat is verplicht als je achterloopt.','err');return;}
  const today=nowD();
  const existing=dagrapporten.find(d=>d.user_id===me.id&&d.datum===today);
  try{
    const body={productie_vandaag:pv,commit_morgen:cm,notitie:n||null,top3_acties:top3||null,humeur:selectedHumeur||null,user_id:me.id,datum:today};
    if(existing) await api('PATCH','/rest/v1/dagrapporten?id=eq.'+existing.id,body);
    else await api('POST','/rest/v1/dagrapporten',body);
    // Feed bericht sturen
    try{
      await api('POST','/rest/v1/feed_berichten',{user_id:me.id,bericht:`📋 ${me.naam} heeft ingecheckt · Productie: ${pv?'€'+Number(pv).toLocaleString('nl-NL'):'€0'} · Commit morgen: ${cm?'€'+Number(cm).toLocaleString('nl-NL'):'€0'}`,type:'systeem'});
    }catch(e){}
    await loadData();renderMedewerker();toast('Check-in opgeslagen! ✅','ok');
  }catch(e){toast('Fout: '+e.message,'err');}
}

// ── ADMIN VIEW ────────────────────────────────────────────
function renderAdmin(){
  const m=nowM();const today=nowD();
  const[y,mo]=m.split('-').map(Number);
  const dagVM=new Date().getDate();
  const wTot=getWerkdagen(y,mo);
  const wTotNu=getWerkdagenTot(y,mo,dagVM);
  const maandPct=Math.round((wTotNu/wTot)*100);
  const mijnRegioIds=isSuperAdmin(me)?regios.map(r=>r.id):adminRegios.map(r=>r.regio_id);
  const medewerkers=profielen.filter(u=>u.rol==='gebruiker'&&u.regio_id&&mijnRegioIds.includes(u.regio_id));
  const totalActuals=medewerkers.reduce((s,u)=>s+calcActuals(u.id),0);
  const nietIngecheckt=medewerkers.filter(u=>!dagrapporten.find(d=>d.user_id===u.id&&d.datum===today));

  document.getElementById('tbr').innerHTML=`
    <button class="btn-sm" onclick="location.href='meer.html'">⚙️ Beheer</button>
    <button class="btn-sm" onclick="openNotifModal('all',null,'Heel team')">🔔 Melding</button>`;

  let h='';

  // TYPING CARD ADMIN
  const uur=new Date().getHours();
  const begroeting=uur<12?'Goedemorgen':uur<18?'Goedemiddag':'Goedenavond';
  h+=`<div class="typing-card">
    <div class="typing-greeting">${begroeting}, ${me.naam?.split(' ')[0]||me.naam}! 👑</div>
    <div style="font-size:15px;font-weight:700;color:var(--text);margin-top:4px">Team staat op <span style="color:${maandPct<=4?'var(--red)':'var(--teal)'}">${Math.round(pct(totalActuals,medewerkers.reduce((s,u)=>{const t=targets.find(x=>x.type==='persoon'&&x.user_id===u.id&&x.periode===m);return s+(t?.omzet_target||0);},0)))||0}%</span> — dag ${wTotNu}/${wTot}</div>
  </div>`;

  // ALERT niet ingecheckt
  if(nietIngecheckt.length>0){
    h+=`<div class="alert danger">⚠️ <strong>${nietIngecheckt.map(u=>u.naam||u.email).join(', ')}</strong> ${nietIngecheckt.length===1?'heeft':'hebben'} nog niet ingecheckt vandaag</div>`;
  }

  h+=`<div class="stats-row">
    <div class="stat"><div class="sv ct">${eur(totalActuals)}</div><div class="sl">Totaal actuals</div><div class="ss">${m}</div></div>
    <div class="stat"><div class="sv ca">${maandPct}%</div><div class="sl">Maandvoortgang</div><div class="ss">Dag ${wTotNu}/${wTot}</div></div>

// ── PUSH ──────────────────────────────────────────────────
function urlBase64ToUint8Array(b){const p='='.repeat((4-b.length%4)%4);const base64=(b+p).replace(/-/g,'+').replace(/_/g,'/');const raw=window.atob(base64);const out=new Uint8Array(raw.length);for(let i=0;i<raw.length;++i)out[i]=raw.charCodeAt(i);return out;}
async function registerServiceWorker(){if(!('serviceWorker' in navigator)||!('PushManager' in window))return false;try{const reg=await navigator.serviceWorker.register('/sw.js');return reg;}catch(e){return false;}}
async function requestPushPermission(){
  if(location.protocol!=='https:'){toast('Push werkt alleen via HTTPS.','err');return;}
  const reg=await registerServiceWorker();if(!reg)return;
  const permission=await Notification.requestPermission();
  if(permission!=='granted'){toast('Notificaties geweigerd.');return;}
  try{
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});
    const subData=sub.toJSON();const s=getSession();
    if(!s||!s.access_token){toast('Sessie verlopen.','err');return;}
    const resp=await fetch(SB+'/rest/v1/push_subscriptions',{method:'POST',headers:{'Content-Type':'application/json','apikey':AK,'Authorization':'Bearer '+s.access_token,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({user_id:me.id,endpoint:subData.endpoint,p256dh:subData.keys?.p256dh,auth:subData.keys?.auth})});
    if(!resp.ok)throw new Error(await resp.text());
    toast('Meldingen ingeschakeld! ✅','ok');
    await loadData();isRegioAdmin(me)?renderAdmin():renderMedewerker();
  }catch(e){toast('Fout: '+e.message,'err');}
}

  {title:'✅ Rondleiding klaar!',body:'Je kent de basics. Gebruik de ? knop rechtsonder om de rondleiding opnieuw te starten. Succes vandaag! 🏆',sel:null,pos:'center'},
];
let tourIdx=0;

function startTour(){tourIdx=0;showTourStep();}

function showTourStep(){
  closeTour();
  const stap=tourStappen[tourIdx];
  if(!stap){closeTour();localStorage.setItem('tbc_tour_v2','1');return;}

  // Overlay
  const ov=document.createElement('div');ov.id='tour-ov';ov.className='tour-overlay';
  ov.style.cssText='position:fixed;inset:0;z-index:200;pointer-events:none';
  document.body.appendChild(ov);

  let rect=null;
  if(stap.sel){
    const el=document.querySelector(stap.sel);
    if(el){
      el.scrollIntoView({behavior:'smooth',block:'center'});
      setTimeout(()=>{
        rect=el.getBoundingClientRect();
        positionTourTip(stap,rect);
        // Spotlight
        const sp=document.createElement('div');sp.id='tour-sp';
        sp.style.cssText=`position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.82);z-index:201;pointer-events:none;top:${rect.top-6}px;left:${rect.left-6}px;width:${rect.width+12}px;height:${rect.height+12}px;transition:all .3s`;
        document.body.appendChild(sp);
      },200);
      return;
    }
  }
  positionTourTip(stap,null);
}

function positionTourTip(stap,rect){
  const tip=document.createElement('div');tip.id='tour-tip';tip.className='tour-tip';
  const dots=tourStappen.map((_,i)=>`<div class="tour-dot${i===tourIdx?' active':''}"></div>`).join('');
  tip.innerHTML=`<h3>${stap.title}</h3><p>${stap.body}</p>
    <div class="tour-footer">
      <button class="tour-btn-skip" onclick="closeTour();localStorage.setItem('tbc_tour_v2','1')">Sluiten</button>
      <button class="tour-btn-next" onclick="tourIdx++;showTourStep()">${tourIdx===tourStappen.length-1?'Afronden ✓':'Volgende →'}</button>
    </div>
    <div class="tour-dots">${dots}</div>`;

  if(!rect||stap.pos==='center'){
    tip.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:202;background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:20px;width:min(300px,90vw);box-shadow:0 8px 40px rgba(0,0,0,.6)';
  } else if(stap.pos==='bottom'){
    const top=Math.min(rect.bottom+14,window.innerHeight-200);
    const left=Math.max(8,Math.min(window.innerWidth-316,rect.left));
    tip.style.cssText=`position:fixed;top:${top}px;left:${left}px;z-index:202;background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:20px;width:min(300px,90vw);box-shadow:0 8px 40px rgba(0,0,0,.6)`;
  } else {
    const top=Math.max(8,rect.top-220);
    const left=Math.max(8,Math.min(window.innerWidth-316,rect.left));
    tip.style.cssText=`position:fixed;top:${top}px;left:${left}px;z-index:202;background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:20px;width:min(300px,90vw);box-shadow:0 8px 40px rgba(0,0,0,.6)`;
  }
  document.body.appendChild(tip);
}

function closeTour(){
  ['tour-ov','tour-sp','tour-tip'].forEach(id=>{const el=document.getElementById(id);if(el)el.remove();});
}

function fdt(d){return new Date(d).toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'});}

init();
