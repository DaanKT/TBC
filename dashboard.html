<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0B1F3A;--navy-l:#1E3A5F;--teal:#4FD1A5;--teal-d:#3ab891;--bg:#f0f2f5;--card:#fff;--border:#e2e5ea;--text:#1a1f2e;--muted:#6b7280;--red:#dc2626;--amber:#d97706;--green:#16a34a;--blue:#2563eb;--r:10px;--rs:6px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
.topbar{background:var(--navy);padding:0 1rem;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.topbar-logo{font-size:13px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.06em}
.topbar-logo span{color:var(--teal)}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-user{font-size:12px;color:rgba(255,255,255,.5)}
.btn-lo{font-family:'DM Sans',sans-serif;font-size:12px;background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.5);padding:4px 10px;border-radius:var(--rs);cursor:pointer}
.btn-lo:hover{color:#fff;border-color:rgba(255,255,255,.5)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:40;height:60px}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:none;transition:color .15s;padding:0;position:relative}
.bn-item.active{color:var(--teal)}
.bn-item .ic{font-size:20px;line-height:1}
.bn-badge{position:absolute;top:6px;right:calc(50% - 18px);background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:99px}
.content{padding:1rem;max-width:600px;margin:0 auto}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.page-title{font-size:18px;font-weight:700}
.page-sub{font-size:13px;color:var(--muted);margin-top:2px}
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1.25rem}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.stat.click{cursor:pointer;transition:border-color .15s}
.stat.click:hover,.stat.act{border-color:var(--teal);background:#f0fdf9}
.sv{font-size:22px;font-weight:700;line-height:1}
.sl{font-size:11px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.ss{font-size:12px;color:var(--muted);margin-top:4px}
.cr{color:var(--red)}.ca{color:var(--amber)}.cg{color:var(--green)}.cb{color:var(--blue)}.cn{color:var(--navy)}
button{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border-radius:var(--rs);border:1px solid var(--border);background:var(--card);color:var(--text);padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s}
button:hover{background:#f0f2f5}
button:disabled{opacity:.4;cursor:not-allowed}
button.teal{background:var(--teal);color:var(--navy);border-color:var(--teal);font-weight:600}
button.teal:hover{background:var(--teal-d)}
button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
button.primary:hover{background:var(--navy-l)}
button.danger{color:var(--red);border-color:#fecaca}
button.danger:hover{background:#fef2f2}
button.amber{background:#fffbeb;color:#92400e;border-color:#fde68a}
button.sm{font-size:12px;padding:5px 10px}
button.full{width:100%;justify-content:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:1rem}
.card-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.card-row:last-child{border-bottom:none}
.card-row.click{cursor:pointer;transition:background .1s}
.card-row.click:hover{background:#f8f9fb}
.card-row.act{background:#f0fdf9;border-left:3px solid var(--teal);padding-left:13px}
.row-main{font-size:14px;font-weight:600}
.row-sub{font-size:12px;color:var(--muted);margin-top:2px}
.row-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;border:1px solid;white-space:nowrap}
.b-open{background:#fef2f2;color:#991b1b;border-color:#fecaca}

.overlay.open{display:flex}
.modal{background:var(--card);border-radius:var(--r) var(--r) 0 0;padding:20px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 16px}
.mt{font-size:16px;font-weight:700;margin-bottom:4px}
.ms{font-size:13px;color:var(--muted);margin-bottom:16px}
.field{margin-bottom:12px}
label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],textarea,select{font-family:'DM Sans',sans-serif;font-size:15px;width:100%;border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;color:var(--text);background:var(--card);outline:none;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--teal)}
textarea{resize:vertical;min-height:80px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.pb{height:6px;background:var(--border);border-radius:99px;margin-top:6px;overflow:hidden}
.pf{height:100%;border-radius:99px;background:var(--teal);transition:width .4s}
.pf.am{background:var(--amber)}.pf.re{background:var(--red)}
.alert{border-radius:var(--r);padding:12px 16px;margin-bottom:1rem;font-size:13px}
.alert.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.alert.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.alert.success{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--muted);font-size:14px}
.divider{border:none;border-top:1px solid var(--border);margin:12px 0}
.tw{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:6px;width:90%;max-width:400px}
.toast{background:var(--navy);color:#fff;font-size:13px;padding:10px 16px;border-radius:var(--rs);animation:tin .2s ease;text-align:center}
.toast.err{background:var(--red)}.toast.ok{background:var(--green)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ld{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.ld.dk{border-color:rgba(0,0,0,.1);border-top-color:var(--navy)}
@keyframes sp{to{transform:rotate(360deg)}}
.section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:1rem 0 .5rem}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.75rem}
.tag{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:background .12s}
.tag.active{background:var(--navy);color:#fff;border-color:var(--navy)}

<script>
const SB='https://bstpobqvodljhpjzgnkp.supabase.co';
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdHBvYnF2b2RsamhwanpnbmtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MzEyODAsImV4cCI6MjA5NjEwNzI4MH0.zMy3hmD02DSCkVfAOh2URDqXm_WBFCYe8CgNkvWT_yI';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdHBvYnF2b2RsamhwanpnbmtwIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDUzMTI4MCwiZXhwIjoyMDk2MTA3MjgwfQ.2Nrgk7-TxZ-gIAFYhjcfNTFdm6g-6HaGIu3QGCEckPs';

function getSession(){try{return JSON.parse(localStorage.getItem('tbc_session'));}catch(e){return null;}}
function getMe(){try{return JSON.parse(localStorage.getItem('tbc_me'));}catch(e){return null;}}
function setMe(p){localStorage.setItem('tbc_me',JSON.stringify(p));}
function logout(){localStorage.removeItem('tbc_session');localStorage.removeItem('tbc_me');location.href='login.html';}
function hdr(svc=false){const s=getSession();const t=svc?SK:(s?s.access_token:'');return{'apikey':AK,'Authorization':'Bearer '+t,'Content-Type':'application/json','Prefer':'return=representation'};}
async function api(m,p,b,svc=false){const r=await fetch(SB+p,{method:m,headers:hdr(svc),body:b?JSON.stringify(b):undefined});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null;}
async function aApi(m,p,b,svc=false){const s=getSession();const tk=svc?SK:(s?s.access_token:'');const r=await fetch(SB+p,{method:m,headers:{'apikey':AK,'Authorization':'Bearer '+tk,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null;}
function v(id){return(document.getElementById(id)?.value||'').trim();}
function eur(n){return'€'+Number(n||0).toLocaleString('nl-NL',{minimumFractionDigits:0,maximumFractionDigits:0});}
function fdt(d){return new Date(d).toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'});}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0;}
function nowM(){return new Date().toISOString().slice(0,7);}
function nowD(){return new Date().toISOString().slice(0,10);}
function toast(msg,tp=''){const el=document.createElement('div');el.className='toast'+(tp?' '+tp:'');el.textContent=msg;let tw=document.getElementById('tw');if(!tw){tw=document.createElement('div');tw.id='tw';tw.className='tw';document.body.appendChild(tw);}tw.appendChild(el);setTimeout(()=>el.remove(),3500);}
function esc(s){return String(s).split("'").join("&apos;");}
async function refreshSession(){
  const s=getSession();
  if(!s||!s.refresh_token) return null;
  try{
    const res=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',
      headers:{'apikey':AK,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:s.refresh_token})
    });
    if(!res.ok) return null;
    const data=await res.json();
    if(data.access_token){
      localStorage.setItem('tbc_session',JSON.stringify(data));
      return data;
    }
  }catch(e){}
  return null;
}

async function checkAuth(){
  let s=getSession();
  if(!s||!s.access_token){localStorage.clear();location.replace('login.html');return null;}
  
  // Check if token is expired or about to expire (within 10 min)
  try{
    const payload=JSON.parse(atob(s.access_token.split('.')[1]));
    const expiresIn=(payload.exp*1000)-Date.now();
    if(expiresIn<600000){ // less than 10 minutes
      const newSession=await refreshSession();
      if(newSession) s=newSession;
      else if(expiresIn<0){localStorage.clear();location.replace('login.html');return null;}
    }
  }catch(e){}

  const me=getMe();
  if(me&&me.id)return me;
  try{
    const p=await api('GET','/rest/v1/profielen?id=eq.'+s.user.id);
    if(!p||!p.length)throw new Error('no profile');
    setMe(p[0]);return p[0];
  }catch(e){
    // Try refresh before giving up
    const newSession=await refreshSession();
    if(newSession){
      try{
        const p2=await api('GET','/rest/v1/profielen?id=eq.'+s.user.id);
        if(p2&&p2.length){setMe(p2[0]);return p2[0];}
      }catch(e2){}
    }
    localStorage.clear();location.replace('login.html');return null;
  }
}
function isAdmin(me){return me&&me.rol==='admin';}


function getWerkdagen(jaar, maand) {
  // maand is 1-based
  const dagen = new Date(jaar, maand, 0).getDate();
  let werkdagen = 0;
  for(let d=1; d<=dagen; d++) {
    const dag = new Date(jaar, maand-1, d).getDay();
    if(dag !== 0 && dag !== 6) werkdagen++;
  }
  return werkdagen;
}

function getWerkdagenTotVandaag(jaar, maand, dagVanMaand) {
  let werkdagen = 0;
  for(let d=1; d<=dagVanMaand; d++) {
    const dag = new Date(jaar, maand-1, d).getDay();
    if(dag !== 0 && dag !== 6) werkdagen++;
  }
  return werkdagen;
}

function getRestWerkdagen(jaar, maand, dagVanMaand) {
  const totaal = new Date(jaar, maand, 0).getDate();
  let werkdagen = 0;
  for(let d=dagVanMaand+1; d<=totaal; d++) {
    const dag = new Date(jaar, maand-1, d).getDay();
    if(dag !== 0 && dag !== 6) werkdagen++;
  }
  return werkdagen;
}

function isWerkdag(date) {
  const dag = date.getDay();
  return dag !== 0 && dag !== 6;
}

let me=null, regios=[], targets=[], commits=[], dagrapporten=[], profielen=[], correcties=[];
let corrUserId=null, corrUserNaam=null;
let adminCommitUserId=null, adminCommitUserNaam=null;
let targetEditUserId=null;
let bevId=null;

async function init(){
  me=await checkAuth(); if(!me)return;
  document.getElementById('topbar-user').textContent=(me.naam||me.email)+(isAdmin(me)?' (Admin)':'');
  await loadData();
  checkBadges();
  if(isAdmin(me)) renderAdmin();
  else renderMedewerker();
}

async function loadData(){
  const isA=isAdmin(me); const m=nowM();
  const [y,mo]=m.split('-').map(Number);
  regios=await api('GET','/rest/v1/regios?order=naam.asc')||[];
  targets=await api('GET','/rest/v1/targets?order=periode.desc')||[];
  const cu=isA
    ?'/rest/v1/commitments?datum=gte.'+m+'-01&order=datum.desc&select=*,profielen(naam,email,regio_id)'
    :'/rest/v1/commitments?user_id=eq.'+me.id+'&datum=gte.'+m+'-01&order=datum.desc';
  commits=await api('GET',cu)||[];
  const du=isA
    ?'/rest/v1/dagrapporten?datum=gte.'+m+'-01&order=datum.desc&select=*,profielen(naam,email,regio_id)'
    :'/rest/v1/dagrapporten?user_id=eq.'+me.id+'&datum=gte.'+m+'-01&order=datum.desc';
  dagrapporten=await api('GET',du)||[];
  const corrU=isA
    ?'/rest/v1/correcties?datum=gte.'+m+'-01&order=aangemaakt_op.desc&select=*,profielen(naam,email)'
    :'/rest/v1/correcties?user_id=eq.'+me.id+'&datum=gte.'+m+'-01&order=aangemaakt_op.desc';
  correcties=await api('GET',corrU)||[];
  if(isA) profielen=await api('GET','/rest/v1/profielen')||[];
}

function checkBadges(){
  const today=nowD(); const hr=new Date().getHours();
  const myDag=dagrapporten.find(d=>d.user_id===me.id&&d.datum===today);
  const bn=document.getElementById('bn-dag');
  if(bn) bn.style.display=(!myDag&&hr>=16)?'block':'none';
}

function calcActuals(userId){
  const m=nowM();
  const dags=dagrapporten.filter(d=>d.user_id===userId&&d.datum.startsWith(m));
  const dagActuals=dags.reduce((s,d)=>s+(d.productie_vandaag||0),0);
  const corrActuals=correcties.filter(c=>c.user_id===userId).reduce((s,c)=>s+(c.bedrag||0),0);
  return dagActuals+corrActuals;
}

function calcStreak(userId){
  const bev=commits.filter(c=>c.user_id===userId&&c.bevestigd).sort((a,b)=>b.datum.localeCompare(a.datum));
  let streak=0;
  for(const c of bev){ if(c.gehaald) streak++; else break; }
  return streak;
}

// ── MEDEWERKER VIEW ───────────────────────────────────────
function renderMedewerker(){
  const m=nowM(); const today=nowD();
  const [y,mo]=m.split('-').map(Number);
  const dagVanMaand=new Date().getDate();
  const werkdagenTotaal=getWerkdagen(y,mo);
  const werkdagenTot=getWerkdagenTotVandaag(y,mo,dagVanMaand);
  const werkdagenRest=getRestWerkdagen(y,mo,dagVanMaand);
  const myTarget=targets.find(t=>t.type==='persoon'&&t.user_id===me.id&&t.periode===m);
  const actuals=calcActuals(me.id);
  const target=myTarget?.omzet_target||0;
  const perDag=target?Math.round(target/werkdagenTotaal):0;
  const verwacht=perDag*werkdagenTot;
  const achterstand=verwacht-actuals;
  const nuNodigPerDag=werkdagenRest>0?Math.round((target-actuals)/werkdagenRest):0;
  const maandPct=Math.round((werkdagenTot/werkdagenTotaal)*100);
  const actualsPct=target?pct(actuals,target):0;
  const onTrack=actualsPct>=maandPct;
  const streak=calcStreak(me.id);
  const myReg=regios.find(r=>r.id===me.regio_id);
  const yesterday=getYesterday();
  const ystDag=dagrapporten.find(d=>d.user_id===me.id&&d.datum===yesterday);
  const todayDag=dagrapporten.find(d=>d.user_id===me.id&&d.datum===today);

  document.getElementById('tbr').innerHTML='';
  let h='';

  // ── ON TRACK BANNER ──
  if(target>0){
    const col=onTrack?'#EAF3DE':'#FCEBEB';
    const tcol=onTrack?'#3B6D11':'#A32D2D';
    const bcol=onTrack?'#639922':'#E24B4A';
    h+=`<div style="background:${col};border:0.5px solid ${onTrack?'#C0DD97':'#F7C1C1'};border-radius:var(--r);padding:14px 16px;margin-bottom:1rem">
      <div style="font-size:14px;font-weight:600;color:${tcol};margin-bottom:8px">${onTrack?'🟢 On track!':'🔴 Let op: je loopt achter'}</div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:${tcol};margin-bottom:5px">
        <span>Maandvoortgang ${maandPct}% (dag ${werkdagenTot} van ${werkdagenTotaal} werkdagen)</span>
        <span>Bereikt ${actualsPct}%</span>
      </div>
      <div style="height:10px;background:rgba(0,0,0,.1);border-radius:99px;overflow:hidden;position:relative">
        <div style="position:absolute;top:0;left:0;width:${maandPct}%;height:100%;background:rgba(0,0,0,.1);border-radius:99px"></div>
        <div style="width:${actualsPct}%;height:100%;background:${bcol};border-radius:99px;position:relative;z-index:1"></div>
      </div>
    </div>`;
  }

  // ── STATS GRID ──
  h+=`<div class="stats-row">
    <div class="stat"><div class="sv cn">${eur(actuals)}</div><div class="sl">Actuals</div><div class="ss">Target: ${eur(target)}</div></div>
    <div class="stat"><div class="sv ${achterstand>0?'cr':'cg'}">${achterstand>0?'-':'+'}${eur(Math.abs(achterstand))}</div><div class="sl">${achterstand>0?'Achterstand':'Voorsprong'}</div><div class="ss">Verwacht: ${eur(verwacht)}</div></div>
    <div class="stat"><div class="sv ca">${eur(perDag)}</div><div class="sl">Per werkdag nodig</div><div class="ss">Basis target</div></div>
    <div class="stat"><div class="sv ${nuNodigPerDag>perDag?'cr':'cg'}">${eur(nuNodigPerDag)}</div><div class="sl">Nu nodig/dag</div><div class="ss">${werkdagenRest} werkdagen rest</div></div>
  </div>`;

  // ── STREAK ──
  if(streak>0){
    h+=`<div style="background:linear-gradient(135deg,#0B1F3A,#1E3A5F);border-radius:var(--r);padding:12px 16px;margin-bottom:1rem;display:flex;align-items:center;gap:12px">
      <div style="font-size:28px">🔥</div>
      <div><div style="font-size:15px;font-weight:600;color:#fff">${streak} dag${streak!==1?'en':''} op rij target gehaald</div>
      <div style="font-size:12px;color:rgba(255,255,255,.5);margin-top:2px">Ga zo door!</div></div>
    </div>`;
  }

  // ── REGIO WIDGET ──
  if(myReg){
    const regTarget=targets.find(t=>t.type==='regio'&&t.regio_id===myReg.id&&t.periode===m);
    const regUsers=profielen.length?profielen.filter(u=>u.regio_id===myReg.id):[{id:me.id,naam:me.naam,email:me.email}];
    const regActuals=regUsers.reduce((s,u)=>s+calcActuals(u.id),0);
    const regTarget2=regTarget?.omzet_target||0;
    const regPct=regTarget2?pct(regActuals,regTarget2):0;
    h+=`<div class="section-label">Regio ${myReg.naam}</div>
    <div class="card" style="margin-bottom:1rem">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div><div style="font-size:18px;font-weight:600">${eur(regActuals)}</div><div style="font-size:12px;color:var(--muted)">Regio actuals${regTarget2?' · target: '+eur(regTarget2):''}</div></div>
        ${regTarget2?`<span style="font-size:16px;font-weight:700;color:${regPct>=maandPct?'var(--green)':'var(--red)'}">${regPct}%</span>`:''}
      </div>
      ${regUsers.map(u=>{
        const ua=calcActuals(u.id);
        const ut=targets.find(t=>t.type==='persoon'&&t.user_id===u.id&&t.periode===m);
        const up=ut?pct(ua,ut.omzet_target):null;
        const isMe=u.id===me.id;
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:0.5px solid var(--border)">
          <div style="font-size:13px;font-weight:${isMe?'600':'400'}">${isMe?'Jij':(u.naam||u.email)}</div>
          <div style="text-align:right"><div style="font-size:13px;font-weight:600">${eur(ua)}</div>${up!==null?`<div style="font-size:11px;color:${up>=maandPct?'var(--green)':'var(--red)'}">${up}% van target</div>`:''}</div>
        </div>`;
      }).join('')}
    </div>`;
  }

  // ── DAGELIJKSE CHECK-IN ──
  h+=`<div class="section-label">Dagelijkse check-in${todayDag?' ✓':''}</div>
  <div style="background:#0B1F3A;border-radius:var(--r);padding:16px;margin-bottom:1rem">
    ${ystDag?`<div style="background:rgba(255,255,255,.07);border-radius:var(--rs);padding:10px 12px;margin-bottom:12px">
      <div style="font-size:11px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Gisteren ingevuld</div>
      <div style="font-size:13px;color:rgba(255,255,255,.7)">Productie: <strong style="color:#fff">${eur(ystDag.productie_vandaag)}</strong> · Commit morgen: <strong style="color:#4FD1A5">${eur(ystDag.commit_morgen)}</strong></div>
    </div>`:''}
    <div style="margin-bottom:10px">
      <label style="font-size:11px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:5px">Productie intake vandaag (€)</label>
      <input type="number" id="ci-pv" value="${todayDag?todayDag.productie_vandaag:''}" placeholder="0" min="0" step="100" style="background:rgba(255,255,255,.1);border:0.5px solid rgba(255,255,255,.2);color:#fff;border-radius:var(--rs);padding:10px 12px;font-size:15px;width:100%;box-sizing:border-box"/>
    </div>
    <div style="margin-bottom:12px">
      <label style="font-size:11px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:5px">Commit voor morgen (€)</label>
      <input type="number" id="ci-cm" value="${todayDag?todayDag.commit_morgen:''}" placeholder="0" min="0" step="100" style="background:rgba(255,255,255,.1);border:0.5px solid rgba(255,255,255,.2);color:#fff;border-radius:var(--rs);padding:10px 12px;font-size:15px;width:100%;box-sizing:border-box"/>
    </div>
    <div style="margin-bottom:12px">
      <label style="font-size:11px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:5px">Notitie (optioneel)</label>
      <textarea id="ci-n" placeholder="Bijzonderheden..." style="background:rgba(255,255,255,.1);border:0.5px solid rgba(255,255,255,.2);color:#fff;border-radius:var(--rs);padding:10px 12px;font-size:14px;width:100%;box-sizing:border-box;min-height:60px;resize:none;font-family:inherit">${todayDag?todayDag.notitie||'':''}</textarea>
    </div>
    <button onclick="saveCheckin()" style="background:#4FD1A5;color:#0B1F3A;border:none;border-radius:var(--rs);padding:12px;font-size:14px;font-weight:700;width:100%;cursor:pointer">${todayDag?'Bijwerken':'Opslaan'}</button>
  </div>`;

  document.getElementById('content').innerHTML=h;
}

async function saveCheckin(){
  const pv=parseFloat(document.getElementById('ci-pv').value)||0;
  const cm=parseFloat(document.getElementById('ci-cm').value)||0;
  const n=document.getElementById('ci-n').value.trim();
  const today=nowD();
  const existing=dagrapporten.find(d=>d.user_id===me.id&&d.datum===today);
  try{
    const body={productie_vandaag:pv,commit_morgen:cm,notitie:n||null,user_id:me.id,datum:today};
    if(existing) await api('PATCH','/rest/v1/dagrapporten?id=eq.'+existing.id,body);
    else await api('POST','/rest/v1/dagrapporten',body);
    await loadData();
    if(isAdmin(me)) renderAdmin(); else renderMedewerker();
    toast('Check-in opgeslagen!','ok');
  }catch(e){toast('Fout: '+e.message,'err');}
}

function getYesterday(){const d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10);}

// ── ADMIN VIEW ────────────────────────────────────────────
function renderAdmin(){
  const m=nowM(); const today=nowD();
  const [y,mo]=m.split('-').map(Number);
  const dagVanMaand=new Date().getDate();
  const werkdagenTotaal=getWerkdagen(y,mo);
  const werkdagenTot=getWerkdagenTotVandaag(y,mo,dagVanMaand);
  const maandPct=Math.round((werkdagenTot/werkdagenTotaal)*100);

  document.getElementById('tbr').innerHTML=`<button class="teal sm" onclick="location.href='dagrapporten.html'">📋 Dagrapporten</button>`;

  // Regio overzicht
  h+=`<div class="section-label">Regio overzicht — ${m}</div><div class="card" style="margin-bottom:1rem">`;

    const rUsers=profielen.filter(u=>u.regio_id===r.id);
    const rActuals=rUsers.reduce((s,u)=>s+calcActuals(u.id),0);
    const rTarget=targets.find(t=>t.type==='regio'&&t.regio_id===r.id&&t.periode===m);
    const rPct=rTarget?pct(rActuals,rTarget.omzet_target):null;

    h+=`<div class="card-row"><div><div class="row-main">${r.naam} ${onT!==null?onT?'🟢':'🔴':''}</div>

      <div class="row-right"><span style="font-size:15px;font-weight:700;color:${rPct===null?'var(--muted)':rPct>=maandPct?'var(--green)':'var(--red)'}">${rPct!==null?rPct+'%':'—'}</span></div>
    </div>`;
  });
  h+=`</div>`;

  // Per medewerker
  h+=`<div class="section-label">Medewerkers — ${m}</div>`;
  const allMedewerkers=[{...me,naam:(me.naam||me.email)+' (jij)'},...profielen.filter(u=>u.id!==me.id)];
  allMedewerkers.forEach(u=>{
    const actuals=calcActuals(u.id);
    const uTarget=targets.find(t=>t.type==='persoon'&&t.user_id===u.id&&t.periode===m);
    const uPct=uTarget?pct(actuals,uTarget.omzet_target):null;
    const onT=uPct!==null?uPct>=maandPct:null;
    const reg=regios.find(r=>r.id===u.regio_id);
    const dagRap=dagrapporten.find(d=>d.user_id===u.id&&d.datum===today);
    const streak=calcStreak(u.id);
    const [yy,mm]=m.split('-').map(Number);
    const wTot=getWerkdagen(yy,mm);
    const wTot2=getWerkdagenTotVandaag(yy,mm,dagVanMaand);
    const perDag=uTarget?Math.round(uTarget.omzet_target/wTot):0;
    const verwacht=perDag*wTot2;
    const achter=verwacht-actuals;
    const wRest=getRestWerkdagen(yy,mm,dagVanMaand);
    const nuNodig=wRest>0&&uTarget?Math.round((uTarget.omzet_target-actuals)/wRest):0;

    h+=`<div class="card" style="margin-bottom:.75rem">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
        <div>
          <div style="font-size:15px;font-weight:600">${u.naam||u.email} ${onT!==null?onT?'🟢':'🔴':''}</div>
          <div style="font-size:12px;color:var(--muted)">${reg?reg.naam:'Geen regio'}${streak>0?' · 🔥 '+streak+' streak':''}</div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
          <button class="sm teal" onclick="openAdminCommit('${u.id}','${esc(u.naam||u.email)}')">🎯 Commit</button>
          <button class="sm" onclick="openTargetEdit('${u.id}','${esc(u.naam||u.email)}',${uTarget?uTarget.omzet_target:0},'${uTarget?uTarget.id:''}')">🏆 Target</button>
          <button class="sm amber" onclick="openCorrectie('${u.id}','${esc(u.naam||u.email)}',${actuals})">✏️ Correctie</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px">
        <div style="background:var(--bg);border-radius:var(--rs);padding:8px 10px;text-align:center">
          <div style="font-size:14px;font-weight:600">${eur(actuals)}</div>
          <div style="font-size:10px;color:var(--muted)">Actuals</div>
        </div>
        <div style="background:var(--bg);border-radius:var(--rs);padding:8px 10px;text-align:center">
          <div style="font-size:14px;font-weight:600;color:${achter>0?'var(--red)':'var(--green)'}">${achter>0?'-':'+'}${eur(Math.abs(achter))}</div>
          <div style="font-size:10px;color:var(--muted)">${achter>0?'Achter':'Voor'}</div>
        </div>
        <div style="background:var(--bg);border-radius:var(--rs);padding:8px 10px;text-align:center">
          <div style="font-size:14px;font-weight:600;color:${nuNodig>perDag?'var(--red)':'var(--green)'}">${eur(nuNodig)}</div>
          <div style="font-size:10px;color:var(--muted)">Nu/dag nodig</div>
        </div>
      </div>
      ${uTarget?`<div style="margin-bottom:6px">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:3px">
          <span>${uPct}% bereikt</span><span>Target: ${eur(uTarget.omzet_target)}</span>
        </div>
        <div style="height:6px;background:var(--border);border-radius:99px;overflow:hidden">
          <div style="width:${Math.min(uPct,100)}%;height:100%;background:${uPct>=maandPct?'var(--green)':'var(--red)'};border-radius:99px"></div>
        </div>
      </div>`:''}
      <div style="font-size:12px;color:var(--muted)">
        Dagrapport: <span style="color:${dagRap?'var(--green)':'var(--red)'}">
        ${dagRap?'✓ Ingevuld — productie: '+eur(dagRap.productie_vandaag):'✗ Ontbreekt'}</span>
      </div>
    </div>`;
  });

  document.getElementById('content').innerHTML=h;
}

// ── ADMIN ACTIONS ─────────────────────────────────────────
function openAdminCommit(uid, naam){
  adminCommitUserId=uid; adminCommitUserNaam=naam;
  const tom=new Date();tom.setDate(tom.getDate()+1);
  document.getElementById('ac-naam').textContent=naam;
  document.getElementById('ac-d').value=tom.toISOString().slice(0,10);
  document.getElementById('ac-o').value='';
  document.getElementById('ov-ac').classList.add('open');
}
async function saveAdminCommit(){
  const d=document.getElementById('ac-d').value;
  const o=parseFloat(document.getElementById('ac-o').value);
  if(!d||isNaN(o)){toast('Vul datum en omzet in.');return;}
  const btn=document.getElementById('btn-ac-s');btn.disabled=true;btn.innerHTML='<span class="ld"></span>';
  try{
    const u=profielen.find(x=>x.id===adminCommitUserId)||me;
    await api('POST','/rest/v1/commitments',{user_id:adminCommitUserId,regio_id:u.regio_id||null,datum:d,omzet_forecast:o});
    document.getElementById('ov-ac').classList.remove('open');
    await loadData();renderAdmin();toast('Commitment aangemaakt.','ok');
  }catch(e){toast('Fout: '+e.message,'err');}finally{btn.disabled=false;btn.innerHTML='Opslaan';}
}

function openTargetEdit(uid, naam, huidig, targetId){
  targetEditUserId=uid;
  document.getElementById('te-naam').textContent=naam;
  document.getElementById('te-o').value=huidig||'';
  document.getElementById('te-p').value=nowM();
  document.getElementById('te-id').value=targetId||'';
  document.getElementById('ov-te').classList.add('open');
}
async function saveTargetEdit(){
  const o=parseFloat(document.getElementById('te-o').value);
  const p=document.getElementById('te-p').value;
  const existId=document.getElementById('te-id').value;
  if(isNaN(o)||!p){toast('Vul target en periode in.');return;}
  const btn=document.getElementById('btn-te-s');btn.disabled=true;btn.innerHTML='<span class="ld"></span>';
  try{
    if(existId){
      await api('PATCH','/rest/v1/targets?id=eq.'+existId,{omzet_target:o,periode:p});
      const t=targets.find(x=>x.id===parseInt(existId));if(t){t.omzet_target=o;t.periode=p;}
    } else {
      const res=await api('POST','/rest/v1/targets',{type:'persoon',user_id:targetEditUserId,periode:p,omzet_target:o});
      if(res&&res[0])targets.push(res[0]);
    }
    document.getElementById('ov-te').classList.remove('open');
    await loadData();renderAdmin();toast('Target opgeslagen.','ok');
  }catch(e){toast('Fout: '+e.message,'err');}finally{btn.disabled=false;btn.innerHTML='Opslaan';}
}

function openCorrectie(uid, naam, huidig){
  corrUserId=uid; corrUserNaam=naam;
  document.getElementById('cr-naam').textContent=naam;
  document.getElementById('cr-huidig').textContent=eur(huidig);
  document.getElementById('cr-b').value='';
  document.getElementById('cr-r').value='';
  document.getElementById('ov-cr').classList.add('open');
}
async function saveCorrectie(){
  const b=parseFloat(document.getElementById('cr-b').value);
  const r=document.getElementById('cr-r').value.trim();
  if(isNaN(b)){toast('Vul een bedrag in (positief of negatief).');return;}
  if(!r){toast('Vul een reden in.');return;}
  const btn=document.getElementById('btn-cr-s');btn.disabled=true;btn.innerHTML='<span class="ld"></span>';
  try{
    await api('POST','/rest/v1/correcties',{user_id:corrUserId,admin_id:me.id,bedrag:b,reden:r,datum:nowD()});
    document.getElementById('ov-cr').classList.remove('open');
    await loadData();renderAdmin();toast('Correctie opgeslagen.','ok');
  }catch(e){toast('Fout: '+e.message,'err');}finally{btn.disabled=false;btn.innerHTML='Opslaan';}
}

// Bevestig
let bevCommitId=null;
function openBevModal(id){
  bevCommitId=id;
  const c=commits.find(x=>x.id===id);
  document.getElementById('bv-forecast').textContent=c?eur(c.omzet_forecast):'';
  document.getElementById('bv-o').value='';
  document.getElementById('ov-bev').classList.add('open');
}
async function quickBev(id){
  const c=commits.find(x=>x.id===id);if(!c)return;
  try{
    await api('PATCH','/rest/v1/commitments?id=eq.'+id,{bevestigd:true,omzet_actuals:c.omzet_forecast,gehaald:true});
    await loadData();if(isAdmin(me))renderAdmin();else renderMedewerker();
    toast('Top! 🎉','ok');
  }catch(e){toast('Fout: '+e.message,'err');}
}
async function saveBev(){
  const o=parseFloat(document.getElementById('bv-o').value);
  if(isNaN(o)){toast('Vul omzet in.');return;}
  const c=commits.find(x=>x.id===bevCommitId);
  const btn=document.getElementById('btn-bv-s');btn.disabled=true;btn.innerHTML='<span class="ld"></span>';
  try{
    await api('PATCH','/rest/v1/commitments?id=eq.'+bevCommitId,{bevestigd:true,omzet_actuals:o,gehaald:o>=(c?.omzet_forecast||0)});
    document.getElementById('ov-bev').classList.remove('open');
    await loadData();if(isAdmin(me))renderAdmin();else renderMedewerker();
    toast(o>=(c?.omzet_forecast||0)?'Target gehaald! 🎉':'Bevestigd.','ok');
  }catch(e){toast('Fout: '+e.message,'err');}finally{btn.disabled=false;btn.innerHTML='Bevestigen';}
}

init();

</script>
