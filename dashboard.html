<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Dashboard — TBC</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="manifest" href="manifest.json"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0B1F3A;--navy-l:#1E3A5F;--teal:#4FD1A5;--teal-d:#3ab891;--bg:#f0f2f5;--card:#fff;--border:#e2e5ea;--text:#1a1f2e;--muted:#6b7280;--red:#dc2626;--amber:#d97706;--green:#16a34a;--blue:#2563eb;--r:10px;--rs:6px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
.topbar{background:var(--navy);padding:0 1rem;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.topbar-logo{font-size:13px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.06em}
.topbar-logo span{color:var(--teal)}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-user{font-size:12px;color:rgba(255,255,255,.5)}
.btn-lo{font-family:'DM Sans',sans-serif;font-size:12px;background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.5);padding:4px 10px;border-radius:var(--rs);cursor:pointer}
.btn-lo:hover{color:#fff;border-color:rgba(255,255,255,.5)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:40;height:60px}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:none;transition:color .15s;padding:0;position:relative}
.bn-item.active{color:var(--teal)}
.bn-item .ic{font-size:20px;line-height:1}
.bn-badge{position:absolute;top:6px;right:calc(50% - 18px);background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:99px}
.content{padding:1rem;max-width:600px;margin:0 auto}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.page-title{font-size:18px;font-weight:700}
.page-sub{font-size:13px;color:var(--muted);margin-top:2px}
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1.25rem}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.stat.click{cursor:pointer;transition:border-color .15s}
.stat.click:hover,.stat.act{border-color:var(--teal);background:#f0fdf9}
.sv{font-size:22px;font-weight:700;line-height:1}
.sl{font-size:11px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.ss{font-size:12px;color:var(--muted);margin-top:4px}
.cr{color:var(--red)}.ca{color:var(--amber)}.cg{color:var(--green)}.cb{color:var(--blue)}.cn{color:var(--navy)}
button{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border-radius:var(--rs);border:1px solid var(--border);background:var(--card);color:var(--text);padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s}
button:hover{background:#f0f2f5}
button:disabled{opacity:.4;cursor:not-allowed}
button.teal{background:var(--teal);color:var(--navy);border-color:var(--teal);font-weight:600}
button.teal:hover{background:var(--teal-d)}
button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
button.primary:hover{background:var(--navy-l)}
button.danger{color:var(--red);border-color:#fecaca}
button.danger:hover{background:#fef2f2}
button.amber{background:#fffbeb;color:#92400e;border-color:#fde68a}
button.sm{font-size:12px;padding:5px 10px}
button.full{width:100%;justify-content:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:1rem}
.card-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.card-row:last-child{border-bottom:none}
.card-row.click{cursor:pointer;transition:background .1s}
.card-row.click:hover{background:#f8f9fb}
.card-row.act{background:#f0fdf9;border-left:3px solid var(--teal);padding-left:13px}
.row-main{font-size:14px;font-weight:600}
.row-sub{font-size:12px;color:var(--muted);margin-top:2px}
.row-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;border:1px solid;white-space:nowrap}
.b-open{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.b-behandeling{background:#fffbeb;color:#92400e;border-color:#fde68a}
.b-wacht{background:#eff6ff;color:#1e40af;border-color:#bfdbfe}
.b-opgelost{background:#f0fdf4;color:#166534;border-color:#bbf7d0}
.b-admin{background:rgba(79,209,165,.15);color:#0d6e52;border-color:var(--teal)}
.b-user{background:#f0f4ff;color:#3730a3;border-color:#c7d2fe}
.b-gehaald{background:#f0fdf4;color:#166534;border-color:#bbf7d0}
.b-gemist{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.b-open2{background:#fffbeb;color:#92400e;border-color:#fde68a}
.dp{max-height:0;overflow:hidden;transition:max-height .3s ease;background:#f8f9fb;border-bottom:1px solid var(--border)}
.dp.open{max-height:2000px}
.di{padding:14px 16px}
.overlay{display:none;position:fixed;inset:0;background:rgba(11,31,58,.55);z-index:100;align-items:flex-end;justify-content:center;padding:0}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:var(--r) var(--r) 0 0;padding:20px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 16px}
.mt{font-size:16px;font-weight:700;margin-bottom:4px}
.ms{font-size:13px;color:var(--muted);margin-bottom:16px}
.field{margin-bottom:12px}
label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],textarea,select{font-family:'DM Sans',sans-serif;font-size:15px;width:100%;border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;color:var(--text);background:var(--card);outline:none;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--teal)}
textarea{resize:vertical;min-height:80px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.pb{height:6px;background:var(--border);border-radius:99px;margin-top:6px;overflow:hidden}
.pf{height:100%;border-radius:99px;background:var(--teal);transition:width .4s}
.pf.am{background:var(--amber)}.pf.re{background:var(--red)}
.alert{border-radius:var(--r);padding:12px 16px;margin-bottom:1rem;font-size:13px}
.alert.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.alert.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.alert.success{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--muted);font-size:14px}
.divider{border:none;border-top:1px solid var(--border);margin:12px 0}
.tw{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:6px;width:90%;max-width:400px}
.toast{background:var(--navy);color:#fff;font-size:13px;padding:10px 16px;border-radius:var(--rs);animation:tin .2s ease;text-align:center}
.toast.err{background:var(--red)}.toast.ok{background:var(--green)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ld{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.ld.dk{border-color:rgba(0,0,0,.1);border-top-color:var(--navy)}
@keyframes sp{to{transform:rotate(360deg)}}
.section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:1rem 0 .5rem}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.75rem}
.tag{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:background .12s}
.tag.active{background:var(--navy);color:#fff;border-color:var(--navy)}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-logo">The Branding <span>Club</span></div>
  <div class="topbar-right"><span class="topbar-user" id="topbar-user"></span><button class="btn-lo" onclick="logout()">↩</button></div>
</div>
<div class="content" id="content"><div class="empty"><span class="ld dk"></span><br><br>Laden...</div></div>
<nav class="bottom-nav">
  <button class="bn-item active" onclick="location.href='dashboard.html'"><span class="ic">🏠</span><span>Home</span></button>
  <button class="bn-item" onclick="location.href='dagrapporten.html'"><span class="ic">📋</span><span>Dagrapport</span><span class="bn-badge" id="bn-dag" style="display:none">!</span></button>
  <button class="bn-item" onclick="location.href='taken.html'"><span class="ic">✅</span><span>Taken</span><span class="bn-badge" id="bn-taken" style="display:none">!</span></button>
  <button class="bn-item" onclick="location.href='klachten.html'"><span class="ic">⚠️</span><span>Klachten</span></button>
  <button class="bn-item" onclick="location.href='meer.html'"><span class="ic">⋯</span><span>Meer</span></button>
</nav>
<div class="tw" id="tw"></div>
<script>
const SB='https://bstpobqvodljhpjzgnkp.supabase.co';
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdHBvYnF2b2RsamhwanpnbmtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MzEyODAsImV4cCI6MjA5NjEwNzI4MH0.zMy3hmD02DSCkVfAOh2URDqXm_WBFCYe8CgNkvWT_yI';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdHBvYnF2b2RsamhwanpnbmtwIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDUzMTI4MCwiZXhwIjoyMDk2MTA3MjgwfQ.2Nrgk7-TxZ-gIAFYhjcfNTFdm6g-6HaGIu3QGCEckPs';

function getSession(){try{return JSON.parse(localStorage.getItem('tbc_session'));}catch(e){return null;}}
function getMe(){try{return JSON.parse(localStorage.getItem('tbc_me'));}catch(e){return null;}}
function setMe(p){localStorage.setItem('tbc_me',JSON.stringify(p));}
function logout(){localStorage.removeItem('tbc_session');localStorage.removeItem('tbc_me');location.href='login.html';}
function hdr(svc=false){const s=getSession();const t=svc?SK:(s?s.access_token:'');return{'apikey':AK,'Authorization':'Bearer '+t,'Content-Type':'application/json','Prefer':'return=representation'};}
async function api(m,p,b,svc=false){const r=await fetch(SB+p,{method:m,headers:hdr(svc),body:b?JSON.stringify(b):undefined});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null;}
async function aApi(m,p,b,svc=false){const s=getSession();const tk=svc?SK:(s?s.access_token:'');const r=await fetch(SB+p,{method:m,headers:{'apikey':AK,'Authorization':'Bearer '+tk,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null;}
function v(id){return(document.getElementById(id)?.value||'').trim();}
function eur(n){return'€'+Number(n||0).toLocaleString('nl-NL',{minimumFractionDigits:0,maximumFractionDigits:0});}
function fdt(d){return new Date(d).toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'});}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0;}
function nowM(){return new Date().toISOString().slice(0,7);}
function nowD(){return new Date().toISOString().slice(0,10);}
function toast(msg,tp=''){const el=document.createElement('div');el.className='toast'+(tp?' '+tp:'');el.textContent=msg;let tw=document.getElementById('tw');if(!tw){tw=document.createElement('div');tw.id='tw';tw.className='tw';document.body.appendChild(tw);}tw.appendChild(el);setTimeout(()=>el.remove(),3500);}
function esc(s){return String(s).replace(/'/g,"&apos;");}
async function checkAuth(){
  const s=getSession();
  if(!s||!s.access_token){localStorage.clear();location.replace('login.html');return null;}
  const me=getMe();
  if(me&&me.id)return me;
  try{
    const p=await api('GET','/rest/v1/profielen?id=eq.'+s.user.id);
    if(!p||!p.length)throw new Error('no profile');
    setMe(p[0]);return p[0];
  }catch(e){
    localStorage.clear();location.replace('login.html');return null;
  }
}
function isAdmin(me){return me&&me.rol==='admin';}


let me=null, regios=[], targets=[], commits=[], dagrapporten=[], profielen=[];

async function init(){
  me=await checkAuth(); if(!me)return;
  document.getElementById('topbar-user').textContent=(me.naam||me.email)+(me.rol==='admin'?' (Admin)':'');
  await loadData();
  renderDash();
  checkBadges();
}

async function loadData(){
  const isA=isAdmin(me);
  regios=await api('GET','/rest/v1/regios?order=naam.asc')||[];
  targets=await api('GET','/rest/v1/targets?order=periode.desc')||[];
  const m=nowM();
  const cu=isA?'/rest/v1/commitments?datum=gte.'+m+'-01&order=datum.desc&select=*,profielen(naam,email,regio_id)':'/rest/v1/commitments?user_id=eq.'+me.id+'&datum=gte.'+m+'-01&order=datum.desc';
  commits=await api('GET',cu)||[];
  const today=nowD();
  const du=isA?'/rest/v1/dagrapporten?datum=gte.'+m+'-01&order=datum.desc&select=*,profielen(naam,email)':'/rest/v1/dagrapporten?user_id=eq.'+me.id+'&datum=gte.'+m+'-01&order=datum.desc';
  dagrapporten=await api('GET',du)||[];
  if(isA) profielen=await api('GET','/rest/v1/profielen')||[];
}

function checkBadges(){
  const today=nowD();
  const hr=new Date().getHours();
  const myDag=dagrapporten.find(d=>d.user_id===me.id&&d.datum===today);
  const bn=document.getElementById('bn-dag');
  if(bn) bn.style.display=(!myDag&&hr>=16)?'block':'none';
  const unc=commits.filter(c=>c.user_id===me.id&&!c.bevestigd&&c.datum<today);
  const bt=document.getElementById('bn-taken');
  if(bt) bt.style.display=unc.length?'block':'none';
}

function renderDash(){
  const isA=isAdmin(me);
  const m=nowM();
  const today=nowD();
  const myC=commits.filter(c=>c.user_id===me.id);
  const myA=myC.filter(c=>c.bevestigd).reduce((s,c)=>s+(c.omzet_actuals||0),0);
  const myF=myC.reduce((s,c)=>s+(c.omzet_forecast||0),0);
  const myT=targets.find(t=>t.type==='persoon'&&t.user_id===me.id&&t.periode===m);
  const myReg=regios.find(r=>r.id===me.regio_id);
  const rC=commits.filter(c=>myReg?c.profielen?.regio_id===me.regio_id:c.user_id===me.id);
  const rA=rC.filter(c=>c.bevestigd).reduce((s,c)=>s+(c.omzet_actuals||0),0);
  const rT=myReg?targets.find(t=>t.type==='regio'&&t.regio_id===me.regio_id&&t.periode===m):null;
  const unc=commits.filter(c=>c.user_id===me.id&&!c.bevestigd&&c.datum<today);
  const hr=new Date().getHours();
  const myDag=dagrapporten.find(d=>d.user_id===me.id&&d.datum===today);
  const bev=commits.filter(c=>c.user_id===me.id&&c.bevestigd);
  const hit=bev.length?Math.round(bev.filter(c=>c.gehaald).length/bev.length*100):0;

  let h='';

  // Alerts
  if(unc.length) h+=`<div class="alert warn">⚠️ <strong>${unc.length} commitment${unc.length>1?'s':''} te bevestigen</strong> — <a href="dagrapporten.html" style="color:inherit;font-weight:600">Invullen →</a></div>`;
  if(!myDag&&hr>=16) h+=`<div class="alert info">📋 Dagrapport van vandaag nog niet ingevuld — <a href="dagrapporten.html" style="color:inherit;font-weight:600">Invullen →</a></div>`;

  // Stats 2x2
  const mp=myT?pct(myA,myT.omzet_target):null;
  const rp=rT?pct(rA,rT.omzet_target):null;
  h+=`<div class="stats-row">
    <div class="stat"><div class="sv cn">${eur(myA)}</div><div class="sl">Mijn actuals</div>${myT?`<div class="ss">${mp}% van target</div><div class="pb"><div class="pf${mp<50?' re':mp<80?' am':''}" style="width:${mp}%"></div></div>`:''}
    </div>
    <div class="stat"><div class="sv" style="color:var(--teal)">${eur(rA)}</div><div class="sl">${myReg?myReg.naam:'Regio'}</div>${rT?`<div class="ss">${rp}% van target</div><div class="pb"><div class="pf${rp<50?' re':rp<80?' am':''}" style="width:${rp}%"></div></div>`:''}
    </div>
    <div class="stat"><div class="sv ${unc.length?'ca':'cg'}">${unc.length}</div><div class="sl">Te bevestigen</div></div>
    <div class="stat"><div class="sv ${hit>=80?'cg':hit>=50?'ca':'cr'}">${hit}%</div><div class="sl">Hit rate</div><div class="ss">${bev.length} bevestigd</div></div>
  </div>`;

  // Quick actions
  h+=`<div class="r2" style="margin-bottom:1rem">
    <button class="teal full" onclick="location.href='dagrapporten.html'">📋 Dagrapport</button>
    <button class="primary full" onclick="location.href='dagrapporten.html#commit'">🎯 Commitment</button>
  </div>`;

  // Admin: regio overzicht
  if(isA){
    h+=`<div class="section-label">Regio overzicht — ${m}</div><div class="card">`;
    if(!regios.length) h+=`<div class="empty">Nog geen regio's.</div>`;
    else regios.forEach(r=>{
      const rc=commits.filter(c=>c.profielen?.regio_id===r.id);
      const ra=rc.filter(c=>c.bevestigd).reduce((s,c)=>s+(c.omzet_actuals||0),0);
      const rf=rc.reduce((s,c)=>s+(c.omzet_forecast||0),0);
      const rt=targets.find(t=>t.type==='regio'&&t.regio_id===r.id&&t.periode===m);
      const p=rt?pct(ra,rt.omzet_target):null;
      h+=`<div class="card-row"><div><div class="row-main">${r.naam}</div><div class="row-sub">${eur(ra)} actuals · ${eur(rf)} forecast</div></div><div class="row-right">${p!==null?`<span style="font-weight:700;font-size:14px;color:${p>=80?'var(--green)':p>=50?'var(--amber)':'var(--red)'}">${p}%</span>`:'<span style="color:var(--muted);font-size:12px">geen target</span>'}</div></div>`;
    });
    h+=`</div>`;

    // Dagrapport status vandaag
    h+=`<div class="section-label">Dagrapport status vandaag</div><div class="card">`;
    profielen.filter(u=>u.rol!=='admin').forEach(u=>{
      const dag=dagrapporten.find(d=>d.user_id===u.id&&d.datum===today);
      h+=`<div class="card-row"><div><div class="row-main">${u.naam||u.email}</div><div class="row-sub">${dag?`Maand: ${eur(dag.maandstand)} · Vandaag: ${eur(dag.productie_vandaag)} · Morgen: ${eur(dag.commit_morgen)}`:'Nog niet ingevuld'}</div></div><div class="row-right"><span class="badge ${dag?'b-opgelost':'b-open'}">${dag?'✓ Ingevuld':'Ontbreekt'}</span></div></div>`;
    });
    h+=`</div>`;
  }

  // Recente commits persoonlijk
  const rec=commits.filter(c=>c.user_id===me.id).slice(0,3);
  if(rec.length){
    h+=`<div class="section-label">Recente commitments</div><div class="card">`;
    rec.forEach(c=>{
      const st=c.bevestigd?(c.gehaald?'gehaald':'gemist'):'open2';
      const sl=c.bevestigd?(c.gehaald?'Gehaald ✓':'Gemist ✗'):'Open';
      h+=`<div class="card-row"><div><div class="row-main">${fdt(c.datum)} — ${eur(c.omzet_forecast)}</div><div class="row-sub">${c.bevestigd&&c.omzet_actuals!=null?'Actuals: '+eur(c.omzet_actuals):'Nog niet bevestigd'}</div></div><div class="row-right"><span class="badge b-${st}">${sl}</span></div></div>`;
    });
    h+=`</div>`;
  }

  document.getElementById('content').innerHTML=h;
}

init();

</script>
</body>
</html>
