<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Dashboard — TBC</title>
<link rel="apple-touch-icon" href="icon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="manifest" href="manifest.json"/>
<script>try{localStorage.setItem('tbc_theme','dark');document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
:root{
  --bg:#111827;
  --surface:#1f2937;
  --surface2:#263040;
  --surface3:#2d3748;
  --border:rgba(255,255,255,.08);
  --border2:rgba(255,255,255,.15);
  --text:#f1f5f9;
  --text2:#94a3b8;
  --text3:#475569;
  --teal:#4FD1A5;
  --tealfade:rgba(79,209,165,.12);
  --gold:#f6a623;
  --goldfade:rgba(246,166,35,.12);
  --red:#f04f5e;
  --redfade:rgba(240,79,94,.1);
  --green:#34d399;
  --greenfade:rgba(52,211,153,.1);
  --blue:#60a5fa;
  --navy:#0B1F3A;
  --r:12px;--rs:8px;
}
[data-theme=light]{
  --bg:#f1f5f9;
  --surface:#ffffff;
  --surface2:#f8fafc;
  --surface3:#e2e8f0;
  --border:rgba(0,0,0,.09);
  --border2:rgba(0,0,0,.14);
  --text:#0f172a;
  --text2:#475569;
  --text3:#94a3b8;
  --teal:#2a9d7a;
  --tealfade:rgba(42,157,122,.1);
  --gold:#d97706;
  --goldfade:rgba(217,119,6,.1);
  --red:#dc2626;
  --redfade:rgba(220,38,38,.08);
  --green:#16a34a;
  --greenfade:rgba(22,163,74,.1);
  --blue:#2563eb;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:68px;-webkit-font-smoothing:antialiased}
/* TOPBAR */
.topbar{background:var(--navy);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(255,255,255,.06)}
.topbar-logo{font-size:13px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.06em}
.topbar-logo span{color:var(--teal)}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.topbar-user{font-size:12px;color:rgba(255,255,255,.4)}
.btn-lo{font-family:'DM Sans',sans-serif;background:none;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.5);font-size:12px;padding:4px 10px;border-radius:var(--rs);cursor:pointer}
.btn-lo:hover{color:#fff}
.btn-th{background:none;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.6);font-size:15px;width:30px;height:30px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
/* SIDEBAR */
.sidebar{display:none;position:fixed;left:0;top:52px;bottom:0;width:210px;background:var(--navy);border-right:1px solid rgba(255,255,255,.06);flex-direction:column;padding:12px 10px;gap:2px;overflow-y:auto;z-index:50}
.sidebar::-webkit-scrollbar{display:none}
.sb-logo{font-size:11px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px 12px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:6px}
.sb-logo span{color:var(--teal)}
.sb-sec{font-size:9px;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:.08em;padding:8px 10px 3px;font-weight:700;margin-top:2px}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;font-size:13px;color:rgba(255,255,255,.45);cursor:pointer;border:none;background:none;transition:all .12s;width:100%;text-align:left;font-family:'DM Sans',sans-serif;font-weight:500}
.sb-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.8)}
.sb-item.active{background:rgba(79,209,165,.12);color:var(--teal);border:1px solid rgba(79,209,165,.18)}
.sb-ic{font-size:16px;line-height:1}
.sb-badge{margin-left:auto;background:var(--red);color:#fff;font-size:9px;padding:1px 6px;border-radius:99px;font-weight:700}
/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--navy);border-top:1px solid rgba(255,255,255,.07);display:flex;height:60px;z-index:100}
.bottom-nav::-webkit-scrollbar{display:none}
.bn-item{flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;font-weight:600;color:rgba(255,255,255,.3);cursor:pointer;border:none;background:none;text-transform:uppercase;letter-spacing:.02em;transition:color .12s}
.bn-item.active{color:var(--teal)}
.bn-item .ic{font-size:18px;line-height:1}
.bn-dot{width:4px;height:4px;border-radius:50%;background:var(--teal);opacity:0;margin-top:1px}
.bn-item.active .bn-dot{opacity:1}
/* CONTENT */
.content{padding:1rem;max-width:800px;margin:0 auto}
/* BUTTONS */
button{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border-radius:var(--rs);border:1px solid var(--border2);background:var(--surface2);color:var(--text);padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .12s;line-height:1}
button:hover{background:var(--surface3)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--teal);color:#000;border-color:var(--teal);font-weight:700}
button.primary:hover{opacity:.9}
button.amber{background:var(--goldfade);color:var(--gold);border-color:rgba(246,166,35,.25)}
button.danger{color:var(--red);border-color:rgba(240,79,94,.25);background:var(--redfade)}
button.sm{font-size:11px;padding:5px 10px}
button.full{width:100%;justify-content:center}
/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:.875rem}
.card-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.card-row:last-child{border-bottom:none}
.card-row.click{cursor:pointer;transition:background .1s}
.card-row.click:hover{background:var(--surface2)}
.card-row.act{background:var(--tealfade);border-left:2px solid var(--teal);padding-left:12px}
.row-main{font-size:14px;font-weight:600}
.row-sub{font-size:12px;color:var(--text2);margin-top:2px}
.row-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.sv{font-size:22px;font-weight:800;line-height:1;letter-spacing:-.02em}
.sl{font-size:10px;color:var(--text3);margin-top:5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.ss{font-size:12px;color:var(--text2);margin-top:3px}
.ct{color:var(--teal)}.cr{color:var(--red)}.ca{color:var(--gold)}.cg{color:var(--green)}.cb{color:var(--blue)}
/* PROGRESS */
.pb{height:5px;background:var(--border2);border-radius:99px;overflow:hidden;margin-top:6px}
.pf{height:100%;border-radius:99px;background:var(--teal);transition:width .5s}
.pf.red{background:var(--red)}.pf.gold{background:var(--gold)}
/* SECTION */
.section-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:1.25rem 0 .6rem;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
/* BADGES */
.badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid;white-space:nowrap;display:inline-block}
.b-verstuurd{background:rgba(96,165,250,.1);color:var(--blue);border-color:rgba(96,165,250,.25)}
.b-followup,.b-follow_up{background:var(--goldfade);color:var(--gold);border-color:rgba(246,166,35,.25)}
.b-gewonnen{background:var(--greenfade);color:var(--green);border-color:rgba(52,211,153,.25)}
.b-verloren{background:var(--redfade);color:var(--red);border-color:rgba(240,79,94,.25)}
.b-open{background:var(--goldfade);color:var(--gold);border-color:rgba(246,166,35,.25)}
.b-behandeling{background:rgba(96,165,250,.1);color:var(--blue);border-color:rgba(96,165,250,.25)}
.b-opgelost{background:var(--greenfade);color:var(--green);border-color:rgba(52,211,153,.25)}
.b-urgent{background:var(--redfade);color:var(--red);border-color:rgba(240,79,94,.35)}
.b-hoog{background:var(--redfade);color:var(--red);border-color:rgba(240,79,94,.25)}
.b-normaal{background:var(--surface2);color:var(--text2);border-color:var(--border2)}
.b-laag{background:var(--greenfade);color:var(--green);border-color:rgba(52,211,153,.25)}
/* ALERTS */
.alert{border-radius:var(--r);padding:11px 14px;margin-bottom:1rem;font-size:13px;display:flex;align-items:flex-start;gap:8px;border:1px solid}
.alert.warn{background:var(--goldfade);border-color:rgba(246,166,35,.2);color:var(--gold)}
.alert.danger{background:var(--redfade);border-color:rgba(240,79,94,.2);color:var(--red)}
.alert.success{background:var(--greenfade);border-color:rgba(52,211,153,.2);color:var(--green)}
.alert.info{background:rgba(96,165,250,.1);border-color:rgba(96,165,250,.2);color:var(--blue)}
/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:20px;width:100%;max-width:580px;max-height:92vh;overflow-y:auto;border:1px solid var(--border2);border-bottom:none}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:99px;margin:0 auto 16px}
.mt{font-size:16px;font-weight:700;margin-bottom:4px}
.ms{font-size:13px;color:var(--text2);margin-bottom:16px}
/* FORMS */
.field{margin-bottom:12px}
label{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],input[type=url],textarea,select{font-family:'DM Sans',sans-serif;font-size:14px;width:100%;border:1px solid var(--border2);border-radius:var(--rs);padding:10px 12px;color:var(--text);background:var(--surface2);outline:none;-webkit-appearance:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--teal)}
textarea{resize:vertical;min-height:80px;line-height:1.5}
select option{background:var(--surface2);color:var(--text)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* SEARCH */
.search-wrap{position:relative;margin-bottom:1rem}
.search-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;font-size:14px}
.search-bar{font-family:'DM Sans',sans-serif;font-size:14px;width:100%;border:1px solid var(--border2);border-radius:var(--rs);padding:10px 14px 10px 36px;color:var(--text);background:var(--surface2);outline:none}
.search-bar:focus{border-color:var(--teal)}
/* TAGS */
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.tag{font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid var(--border2);background:var(--surface2);cursor:pointer;color:var(--text2);transition:all .12s;font-weight:500;white-space:nowrap}
.tag.active{background:var(--tealfade);color:var(--teal);border-color:rgba(79,209,165,.3)}
/* TOAST */
.tw{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:6px;width:88%;max-width:380px;pointer-events:none}
.toast{background:var(--surface2);color:var(--text);font-size:13px;padding:11px 16px;border-radius:var(--rs);animation:tin .2s ease;text-align:center;border:1px solid var(--border2);pointer-events:all}
.toast.err{background:var(--redfade);color:var(--red);border-color:rgba(240,79,94,.3)}
.toast.ok{background:var(--greenfade);color:var(--green);border-color:rgba(52,211,153,.3)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* LOADER */
.ld{display:inline-block;width:18px;height:18px;border:2.5px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* MISC */
.empty{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:14px}
.chev{transition:transform .2s;color:var(--text3)}
.chev.open{transform:rotate(180deg)}
.dp{max-height:0;overflow:hidden;transition:max-height .35s ease}
.dp.open{max-height:3000px}
.di{padding:14px}
.page-title{font-size:20px;font-weight:800;letter-spacing:-.01em}
.page-sub{font-size:13px;color:var(--text2);margin-top:3px}
.help-btn{position:fixed;bottom:72px;right:16px;width:36px;height:36px;background:var(--surface2);color:var(--text2);border:1px solid var(--border2);border-radius:50%;font-size:15px;cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center;font-weight:700}
/* TOUR */
.tour-tip{position:fixed;background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:18px;width:min(290px,88vw);z-index:1000}
.tour-tip h3{font-size:15px;font-weight:700;margin-bottom:6px}
.tour-tip p{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:14px}
.tour-footer{display:flex;justify-content:space-between;align-items:center}
.tour-skip{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;padding:4px}
.tour-next{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;background:var(--teal);color:#000;border:none;border-radius:8px;padding:7px 16px;cursor:pointer}
.tour-dots{display:flex;gap:5px;justify-content:center;margin-top:12px}
.tour-dot{width:6px;height:6px;border-radius:50%;background:var(--border2)}
.tour-dot.on{background:var(--teal);width:16px;border-radius:3px}
/* RESPONSIVE */
@media(min-width:768px){
  body{padding-bottom:0}
  .bottom-nav{display:none}
  .sidebar{display:flex}
  .content{padding:1.5rem 2rem;margin-left:210px}
  .stats-row{grid-template-columns:repeat(4,1fr)}
  .help-btn{bottom:24px}
  .tw{bottom:24px}
}

.typing-card{background:linear-gradient(135deg,var(--surface2),var(--surface3));border-radius:var(--r);padding:14px 16px;margin-bottom:1rem;border:1px solid rgba(79,209,165,.15);position:relative;overflow:hidden}
.typing-card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--teal),transparent);opacity:.5}
.tc-greeting{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;font-weight:600}
.tc-quote{font-size:15px;font-weight:800;min-height:20px;letter-spacing:-.01em;line-height:1.3}
.tc-sub{font-size:12px;color:var(--text2);margin-top:5px}
.tc{display:inline-block;width:2px;height:14px;background:var(--teal);margin-left:2px;vertical-align:middle;animation:bl .7s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:0}}
.streak-card{background:linear-gradient(135deg,var(--goldfade),rgba(246,166,35,.03));border-radius:var(--r);padding:12px 14px;margin-bottom:1rem;border:1px solid rgba(246,166,35,.2);display:flex;align-items:center;gap:12px}
.tip-card{background:var(--surface2);border-left:2px solid var(--teal);border-radius:0 var(--r) var(--r) 0;padding:12px 14px;margin-bottom:1rem}
.tip-lbl{font-size:10px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.tip-body{font-size:13px;color:var(--text2);line-height:1.55}
.hmr-row{display:flex;gap:8px;margin-bottom:10px}
.hmr-btn{flex:1;padding:8px 4px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--surface3);cursor:pointer;font-size:16px;text-align:center;transition:all .15s}
.hmr-btn.on{border-color:var(--teal);background:var(--tealfade);transform:scale(1.1)}
.ci-lbl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px}
.ci-in{font-family:"DM Sans",sans-serif;font-size:14px;width:100%;border:1px solid var(--border2);border-radius:var(--rs);padding:10px 12px;color:var(--text);background:var(--surface2);outline:none;transition:border-color .15s}
.ci-in:focus{border-color:var(--teal)}
textarea.ci-in{resize:none;min-height:70px;line-height:1.5;font-size:13px}
.nm-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.nm-tag{font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid var(--border2);background:var(--surface2);cursor:pointer;color:var(--text2);transition:all .12s}
.nm-tag.on{background:var(--tealfade);color:var(--teal);border-color:rgba(79,209,165,.3)}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-logo">The Branding <span>Club</span></div>
  <div class="topbar-right">
    <span class="topbar-user" id="topbar-user"></span>
    <div id="tbr" style="display:flex;gap:6px"></div>
    <button class="btn-lo" onclick="logout()">↩</button>
  </div>
</header>
<nav class="sidebar">
  <div class="sb-logo">The Branding <span>Club</span></div>
  <button class="sb-item active" onclick="location.href='dashboard.html'"><span class="sb-ic">🏠</span>Dashboard</button><button class="sb-item" onclick="location.href='offertes.html'"><span class="sb-ic">📋</span>Pipeline</button><button class="sb-item" onclick="location.href='feed.html'"><span class="sb-ic">💬</span>Feed<span class="sb-badge">2</span></button><button class="sb-item" onclick="location.href='taken.html'"><span class="sb-ic">✅</span>Taken</button><div class="sb-sec">Operations</div><button class="sb-item" onclick="location.href='levertijden.html'"><span class="sb-ic">📦</span>Levertijden</button><button class="sb-item" onclick="location.href='klachten.html'"><span class="sb-ic">⚠️</span>Klachten</button><button class="sb-item" onclick="location.href='links.html'"><span class="sb-ic">🔗</span>Links</button><div class="sb-sec">Admin</div><button class="sb-item" onclick="location.href='meer.html'"><span class="sb-ic">⚙️</span>Beheer</button>
</nav>
<div class="tw" id="tw"></div>
<button class="help-btn" onclick="startTour()">?</button>
<div class="content" id="content">
  <div class="empty" style="padding:3rem"><span class="ld"></span><br><br>Laden...</div>
</div>

<div class="overlay" id="ov-bev" onclick="if(event.target===this)this.classList.remove('open')">
<div class="modal"><div class="modal-handle"></div>
<div class="mt">Commitment bevestigen</div><div class="ms">Forecast: <strong id="bv-f"></strong></div>
<div class="field"><label>Werkelijke omzet (€)</label><input type="number" id="bv-o" placeholder="0" min="0" step="100"/></div>
<div class="mf"><button onclick="document.getElementById('ov-bev').classList.remove('open')">Annuleren</button><button class="primary" id="btn-bv-s" onclick="saveBev()">Bevestigen</button></div>
</div></div>

<div class="overlay" id="ov-ac" onclick="if(event.target===this)this.classList.remove('open')">
<div class="modal"><div class="modal-handle"></div>
<div class="mt">Commitment invoeren</div><div class="ms">Voor: <strong id="ac-naam"></strong></div>
<div class="field"><label>Datum</label><input type="date" id="ac-d"/></div>
<div class="field"><label>Omzet forecast (€)</label><input type="number" id="ac-o" placeholder="2500" min="0" step="100"/></div>
<div class="mf"><button onclick="document.getElementById('ov-ac').classList.remove('open')">Annuleren</button><button class="primary" id="btn-ac-s" onclick="saveAC()">Opslaan</button></div>
</div></div>

<div class="overlay" id="ov-te" onclick="if(event.target===this)this.classList.remove('open')">
<div class="modal"><div class="modal-handle"></div>
<div class="mt">Target aanpassen</div><div class="ms">Voor: <strong id="te-naam"></strong></div>
<input type="hidden" id="te-id"/>
<div class="field"><label>Periode</label><input type="month" id="te-p"/></div>
<div class="field"><label>Target (€)</label><input type="number" id="te-o" placeholder="80000" min="0" step="1000"/></div>
<div class="mf"><button onclick="document.getElementById('ov-te').classList.remove('open')">Annuleren</button><button class="primary" id="btn-te-s" onclick="saveTE()">Opslaan</button></div>
</div></div>

function gs(k){try{return JSON.parse(localStorage.getItem(k));}catch{return null;}}
function ss(k,v){localStorage.setItem(k,JSON.stringify(v));}
function getSess(){return gs('tbc_session');}
function getMe(){return gs('tbc_me');}
function setMe(p){ss('tbc_me',p);}
function logout(){localStorage.clear();location.href='login.html';}
function hdr(svc){const s=getSess();return{'apikey':AK,'Authorization':'Bearer '+(svc?SK:s?.access_token||''),'Content-Type':'application/json','Prefer':'return=representation'};}
async function api(m,p,b,svc){
  const r=await fetch(SB+p,{method:m,headers:hdr(svc),body:b?JSON.stringify(b):undefined});
  const t=await r.text();
  if(!r.ok)throw new Error(t);
  return t?JSON.parse(t):null;
}
function v(id){return(document.getElementById(id)?.value||'').trim();}
function eur(n){return'\u20ac'+Number(n||0).toLocaleString('nl-NL',{minimumFractionDigits:0,maximumFractionDigits:0});}
function fdt(d){return new Date(d).toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'});}
function fdts(d){return new Date(d).toLocaleDateString('nl-NL',{day:'2-digit',month:'short'});}
function ftm(d){return new Date(d).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0;}
function nowM(){return new Date().toISOString().slice(0,7);}
function nowD(){return new Date().toISOString().slice(0,10);}
function esc(s){return String(s).replace(/'/g,"&apos;");}
function toast(msg,tp){const el=document.createElement('div');el.className='toast'+(tp?' '+tp:'');el.textContent=msg;const tw=document.getElementById('tw');tw.appendChild(el);setTimeout(()=>el.remove(),3500);}
function isAdmin(me){return me?.rol==='admin';}
function isRA(me){return me?.rol==='admin'||me?.rol==='regio_admin';}
async function refreshSess(){
  const s=getSess();if(!s?.refresh_token)return null;
  try{
    const r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':AK,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
    if(!r.ok)return null;
    const d=await r.json();
    if(d.access_token){ss('tbc_session',d);return d;}
  }catch{}return null;
}
async function checkAuth(){
  let s=getSess();
  if(!s?.access_token){localStorage.clear();location.replace('login.html');return null;}
  try{
    const pl=JSON.parse(atob(s.access_token.split('.')[1]));
    if((pl.exp*1000)-Date.now()<600000){
      const ns=await refreshSess();
      if(ns)s=ns;
      else if(Date.now()>pl.exp*1000){localStorage.clear();location.replace('login.html');return null;}
    }
  }catch{}
  const me=getMe();
  if(me?.id)return me;
  try{
    const p=await api('GET','/rest/v1/profielen?id=eq.'+s.user.id);
    if(p?.length){setMe(p[0]);return p[0];}
  }catch{}
  localStorage.clear();location.replace('login.html');return null;
}
function gWd(y,m){const d=new Date(y,m,0).getDate();let w=0;for(let i=1;i<=d;i++)if(new Date(y,m-1,i).getDay()%6)w++;return w;}
function gWdN(y,m,dag){let w=0;for(let i=1;i<=dag;i++)if(new Date(y,m-1,i).getDay()%6)w++;return w;}
function gWdR(y,m,dag){const tot=new Date(y,m,0).getDate();let w=0;for(let i=dag+1;i<=tot;i++)if(new Date(y,m-1,i).getDay()%6)w++;return w;}
function gYest(){const d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10);}
function getNextWorkday(ds){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+1);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()+1);return d.toISOString().slice(0,10);}

function showTS(){

  const s=TOUR[tIdx];if(!s){['t-ov','t-sp','t-tip'].forEach(id=>document.getElementById(id)?.remove());localStorage.setItem('tbc_t3','1');return;}

  if(s.sel){const el=document.querySelector(s.sel.split(',')[0]);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>{const rc=el.getBoundingClientRect();const sp=document.createElement('div');sp.id='t-sp';sp.style.cssText=`position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.75);z-index:999;pointer-events:none;top:${rc.top-5}px;left:${rc.left-5}px;width:${rc.width+10}px;height:${rc.height+10}px`;document.body.appendChild(sp);buildT(s,rc);},300);return;}}

let me=null,regios=[],targets=[],commits=[],dagrapporten=[],profielen=[],correcties=[],adminRegios=[];
let openMed=null,bevId=null,acUID=null,teUID=null,crUID=null,crN=null,ecId=null;
let nmT='all',nmId=null,selHumeur=null;

async function init() {
  try {
    me = await checkAuth();
    if (!me) return;
    document.getElementById('topbar-user').textContent = (me.naam||me.email) + (isAdmin(me)?' (Admin)':'');
    if (isRA(me)) {
      document.getElementById('tbr').innerHTML = `<button class="primary sm" onclick="openNM('all',null)">🔔 Melding</button>`;
    }
    await loadAll();
    if (isRA(me)) renderAdmin(); else renderMed();
    registerSW();
    setupDashboardRealtime();
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="empty">Fout bij laden: ' + e.message + '<br><br><button onclick="init()">Opnieuw proberen</button></div>';
  }
}

async function loadAll() {
  const m = nowM();
  const _d35=new Date();_d35.setDate(_d35.getDate()-35);const d35s=_d35.toISOString().slice(0,10);
  regios = await api('GET','/rest/v1/regios?order=naam.asc') || [];
  targets = await api('GET','/rest/v1/targets?order=periode.desc') || [];
  if (isRA(me)) {
    profielen = await api('GET','/rest/v1/profielen') || [];
    adminRegios = isAdmin(me) ? regios.map(r=>({regio_id:r.id})) : (await api('GET','/rest/v1/admin_regios?user_id=eq.'+me.id) || []);
    commits = await api('GET','/rest/v1/commitments?datum=gte.'+d35s+'&order=datum.desc') || [];
    dagrapporten = await api('GET','/rest/v1/dagrapporten?datum=gte.'+m+'-01&order=datum.desc') || [];
    correcties = await api('GET','/rest/v1/correcties?datum=gte.'+m+'-01&order=aangemaakt_op.desc') || [];
  } else {
    if (me.regio_id) profielen = await api('GET','/rest/v1/profielen?regio_id=eq.'+me.regio_id+'&rol=eq.gebruiker') || [];
    commits = await api('GET','/rest/v1/commitments?datum=gte.'+d35s+'&order=datum.desc&user_id=eq.'+me.id) || [];
    dagrapporten = await api('GET','/rest/v1/dagrapporten?datum=gte.'+m+'-01&order=datum.desc&user_id=eq.'+me.id) || [];
    correcties = await api('GET','/rest/v1/correcties?datum=gte.'+m+'-01&user_id=eq.'+me.id) || [];
  }
}

function calcA(uid) {
  const m = nowM();
  return dagrapporten.filter(d=>d.user_id===uid&&d.datum.startsWith(m)).reduce((s,d)=>s+(d.productie_vandaag||0),0)
    + correcties.filter(c=>c.user_id===uid).reduce((s,c)=>s+(c.bedrag||0),0);
}
function calcStr(uid) {
  const bev = commits.filter(c=>c.user_id===uid&&c.bevestigd).sort((a,b)=>b.datum.localeCompare(a.datum));
  let s=0; for(const c of bev){if(c.gehaald)s++;else break;} return s;
}

const QQ = ['Always play to win.','Elke dag beter dan gisteren.','Focus. Execute. Win.','Jij bepaalt de uitkomst.','Geen excuses. Alleen resultaten.'];
let qi=0,ci=0,del=false;
function startTyping() {
  const el = document.getElementById('tq'); if(!el) return;
  const q = QQ[qi];
  if (!del) { el.innerHTML = q.slice(0,ci+1)+'<span class="tc"></span>'; ci++; if(ci===q.length){del=true;setTimeout(startTyping,2200);return;} }
  else { el.innerHTML = q.slice(0,ci-1)+'<span class="tc"></span>'; ci--; if(ci===0){del=false;qi=(qi+1)%QQ.length;setTimeout(startTyping,400);return;} }
  setTimeout(startTyping, del?38:76);
}

function getTip(actuals, target, mp) {
  const ap = target?pct(actuals,target):0;
  const ach = mp - ap;
  if(ach<=-5) return {t:'🟢 Je loopt voor op schema!',b:'Goed bezig. Houd dit tempo vast.',c:'var(--green)'};
  if(ach<=5)  return {t:'🟡 Op schema',b:'Precies op koers. Focus op kwaliteit vandaag.',c:'var(--teal)'};
  if(ach<=15) return {t:'🟠 Licht achter',b:'Welke warme prospect staat al 2+ dagen open? Bel die als eerste.',c:'var(--gold)'};
  return {t:'🔴 Flink achter — actie vereist',b:'Alleen warme leads vandaag. Geen koude acquisitie.',c:'var(--red)'};
}

function renderMed() {
  const m = nowM();
  const today = nowD();
  const yest = gYest();
  const [y,mo] = m.split('-').map(Number);
  const dag = new Date().getDate();
  const uur = new Date().getHours();
  const wTot = gWd(y,mo);
  const wNu = gWdN(y,mo,dag);
  const wRest = gWdR(y,mo,dag);
  const myT = targets.find(t=>t.type==='persoon'&&t.user_id===me.id&&t.periode===m);
  const actuals = calcA(me.id);
  const target = myT?.omzet_target||0;
  const perDag = target?Math.round(target/wTot):0;
  const verwacht = perDag*wNu;
  const achter = verwacht - actuals;
  const mp = Math.round((wNu/wTot)*100);
  const ap = target?pct(actuals,target):0;
  const onTrack = ap >= mp;
  const streak = calcStr(me.id);
  const myReg = regios.find(r=>r.id===me.regio_id);
  const todayD = dagrapporten.find(d=>d.user_id===me.id&&d.datum===today);
  const yestD = dagrapporten.find(d=>d.user_id===me.id&&d.datum===yest);
  const yestC = commits.find(c=>c.user_id===me.id&&(c.datum===today||c.datum===yest)&&!c.bevestigd);
  const nuNodig = wRest>0&&target ? Math.round((target-actuals)/wRest) : 0;
  const achterPct = target ? Math.round((achter/target)*100) : 0;
  const verplicht = achterPct >= 15;
  const naam = me.naam?.split(' ')[0]||'';
  const beg = uur<12?'Goedemorgen':uur<18?'Goedemiddag':'Goedenavond';
  const emoji = uur<12?'☀️':uur<18?'👋':'🌙';

  let h = '';

  // BEGROETING
  h += `<div class="typing-card">
    <div class="tc-greeting">${beg} ${naam}! ${emoji}</div>
    <div class="tc-quote" id="tq"><span class="tc"></span></div>
    <div class="tc-sub">Dag ${wNu} van ${wTot} werkdagen · ${mp}% van de maand</div>
  </div>`;

  // GISTEREN COMMIT BEVESTIGEN
  if (yestC) {
    h += `<div style="background:linear-gradient(135deg,var(--surface2),var(--surface3));border-radius:var(--r);padding:14px;margin-bottom:1rem;border:1px solid rgba(79,209,165,.2)">
      <div style="font-size:13px;font-weight:700;margin-bottom:10px">Commit was <span style="color:var(--teal)">${eur(yestC.omzet_forecast)}</span> — gehaald?</div>
      <div style="display:flex;gap:8px">
        <button class="primary full" style="flex:1" onclick="quickBev(${yestC.id})">✓ Ja, gehaald!</button>
        <button class="full" style="flex:1" onclick="openBevModal(${yestC.id})">Gedeeltelijk</button>
      </div>
    </div>`;
  } else {
    const yestBev = commits.find(c=>c.user_id===me.id&&(c.datum===yest||c.datum===today)&&c.bevestigd);
    if (yestBev) {
      h += `<div style="background:${yestBev.gehaald?'var(--greenfade)':'var(--redfade)'};border:1px solid ${yestBev.gehaald?'rgba(52,211,153,.2)':'rgba(240,79,94,.2)'};border-radius:var(--r);padding:12px 14px;margin-bottom:1rem">
        <div style="font-size:13px;font-weight:700;color:${yestBev.gehaald?'var(--green)':'var(--red)'}">${yestBev.gehaald?'✅ Commit gehaald!':'❌ Commit gemist'}</div>
        <div style="font-size:12px;color:var(--text2);margin-top:3px">Commit: ${eur(yestBev.omzet_forecast)} · Werkelijk: ${eur(yestBev.omzet_actuals)}</div>
      </div>`;
    }
  }

  // STREAK
  if (streak > 0) {
    h += `<div class="streak-card">
      <div style="font-size:26px">🔥</div>
      <div><div style="font-size:16px;font-weight:800;color:var(--gold)">${streak} dag${streak!==1?'en':''} op rij</div><div style="font-size:12px;color:var(--text3);margin-top:2px">Commit gehaald — ga door!</div></div>
    </div>`;
  }

  // ON TRACK BANNER
  if (target > 0) {
    h += `<div style="background:${onTrack?'var(--greenfade)':'var(--redfade)'};border:1px solid ${onTrack?'rgba(52,211,153,.2)':'rgba(240,79,94,.2)'};border-radius:var(--r);padding:12px 14px;margin-bottom:1rem">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="font-size:13px;font-weight:700;color:${onTrack?'var(--green)':'var(--red)'}">${onTrack?'🟢 Op schema':'🔴 Achter op schema'}</div>
        <div style="font-size:12px;font-weight:700;color:${onTrack?'var(--green)':'var(--red)'}">${ap}% vs ${mp}% norm</div>
      </div>
      <div style="height:6px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;position:relative">
        <div style="position:absolute;left:0;top:0;width:${mp}%;height:100%;background:rgba(255,255,255,.1);border-radius:99px"></div>
        <div style="width:${ap}%;height:100%;background:${onTrack?'var(--green)':'var(--red)'};border-radius:99px;position:relative;z-index:1;transition:width .5s"></div>
      </div>
    </div>`;
  }

  // STATS
  h += `<div class="stats-row">
    <div class="stat"><div class="sv ct">${eur(actuals)}</div><div class="sl">Actuals</div><div class="ss">${target?'Target: '+eur(target):'Geen target'}</div></div>
    <div class="stat"><div class="sv ${achter>0?'cr':'cg'}">${achter>0?'-':'+'}${eur(Math.abs(achter))}</div><div class="sl">${achter>0?'Achterstand':'Voorsprong'}</div><div class="ss">Verwacht: ${eur(verwacht)}</div></div>
    <div class="stat"><div class="sv ca">${eur(perDag)}</div><div class="sl">Per werkdag</div><div class="ss">Basis target</div></div>
    <div class="stat"><div class="sv ${nuNodig>perDag?'cr':'cg'}">${eur(nuNodig)}</div><div class="sl">Nu/dag nodig</div><div class="ss">${wRest} werkdagen rest</div></div>
  </div>`;

  // TIP
  if (target > 0) {
    const tip = getTip(actuals, target, mp);
    h += `<div class="tip-card"><div class="tip-lbl" style="color:${tip.c}">${tip.t}</div><div class="tip-body">${tip.b}</div></div>`;
  }

  // PUSH BANNER
  if ('Notification' in window && Notification.permission === 'default') {
    h += `<div style="background:var(--goldfade);border:1px solid rgba(246,166,35,.2);border-radius:var(--r);padding:12px 14px;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;gap:12px">
      <div><div style="font-size:13px;font-weight:700;color:var(--gold)">🔔 Schakel meldingen in</div><div style="font-size:12px;color:var(--text2);margin-top:2px">Dagelijkse coaching tips</div></div>
      <button class="amber sm" onclick="reqPush()">Inschakelen</button>
    </div>`;
  } else if ('Notification' in window && Notification.permission === 'granted') {
    h += `<div style="background:var(--greenfade);border:1px solid rgba(52,211,153,.15);border-radius:var(--r);padding:10px 14px;margin-bottom:1rem;font-size:12px;color:var(--green)">✅ Meldingen ingeschakeld</div>`;
  }

  // REGIO WIDGET
  if (myReg) {
    const rT = targets.find(t=>t.type==='regio'&&t.regio_id===myReg.id&&t.periode===m);
    const rU = profielen.filter(u=>u.regio_id===myReg.id&&u.rol==='gebruiker');
    const allU = rU.length ? rU : [{id:me.id}];
    const rA = allU.reduce((s,u)=>s+calcA(u.id),0);
    const rTgt = rT?.omzet_target||0;
    const rP = rTgt?pct(rA,rTgt):0;
    h += `<div class="section-label">Regio ${myReg.naam}</div>
    <div class="card" style="margin-bottom:1rem">
      <div style="padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)">
        <div><div style="font-size:18px;font-weight:800;color:var(--teal)">${eur(rA)}</div><div style="font-size:12px;color:var(--text2)">${rTgt?'Target: '+eur(rTgt):''}</div></div>
        ${rTgt?`<span style="font-size:18px;font-weight:800;color:${rP>=mp?'var(--green)':'var(--red)'}">${rP}%</span>`:''}
      </div>
      ${allU.map(u=>{const ua=calcA(u.id);const ut=targets.find(t=>t.type==='persoon'&&t.user_id===u.id&&t.periode===m);const up=ut?pct(ua,ut.omzet_target):null;const isMe=u.id===me.id;return `<div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border)"><div style="font-size:13px;font-weight:${isMe?700:400}">${isMe?'Jij':(u.naam||u.email)}</div><div style="text-align:right"><div style="font-size:13px;font-weight:700;color:var(--teal)">${eur(ua)}</div>${up!==null?`<div style="font-size:11px;color:${up>=mp?'var(--green)':'var(--red)'}">${up}%</div>`:''}</div></div>`;}).join('')}
    </div>`;
  }

  // CHECK-IN
  const ciBlocked = !!(yestC && !todayD);
  const vCommit = yestD?.commit_morgen||null;
  const todayCommit = commits.find(c=>c.user_id===me.id&&c.datum===today&&!c.bevestigd);
  h += `<div class="section-label">Dagelijkse check-in${todayD?' ✓':ciBlocked?' 🔒':''}</div>`;
  if (ciBlocked) h += `<div style="background:var(--redfade);border:1px solid rgba(240,79,94,.3);border-radius:var(--r);padding:14px 16px;margin-bottom:.75rem;display:flex;align-items:center;gap:12px"><div style="font-size:24px;flex-shrink:0">🔒</div><div><div style="font-size:13px;font-weight:700;color:var(--red)">Check-in geblokkeerd</div><div style="font-size:12px;color:var(--text2);margin-top:3px">Bevestig eerst je commitment van gisteren (hierboven) om te kunnen inchecken.</div></div></div>`;
  h += `<div style="background:var(--surface2);border-radius:var(--r);padding:16px;margin-bottom:1rem;border:1px solid ${ciBlocked?'rgba(240,79,94,.15)':'var(--border2)'};${ciBlocked?'opacity:.45;pointer-events:none':''}">
    ${(todayCommit||vCommit)?`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:10px 12px;background:var(--tealfade);border-radius:var(--rs);border:1px solid rgba(79,209,165,.15)"><div><div style="font-size:10px;color:var(--teal);text-transform:uppercase;font-weight:700;letter-spacing:.05em">🎯 Commit vandaag</div><div style="font-size:16px;font-weight:800;color:var(--teal)">${eur(todayCommit?todayCommit.omzet_forecast:vCommit)}</div></div>${ciBlocked?`<div style="font-size:11px;color:var(--text3)">Bevestig hierboven</div>`:`<div style="font-size:20px">🎯</div>`}</div>`:''}
    ${yestD?`<div style="background:rgba(255,255,255,.04);border-radius:var(--rs);padding:10px 12px;margin-bottom:12px;border:1px solid var(--border)"><div style="font-size:10px;color:var(--text3);text-transform:uppercase;font-weight:600;letter-spacing:.05em;margin-bottom:3px">Gisteren</div><div style="font-size:13px;color:var(--text2)">Productie: <strong>${eur(yestD.productie_vandaag)}</strong> · Commit: <strong style="color:var(--teal)">${eur(yestD.commit_morgen)}</strong></div>${yestD.notitie?`<div style="font-size:12px;color:var(--text3);margin-top:4px;font-style:italic">Plan: ${yestD.notitie}</div>`:''}</div>`:''}
    <div style="margin-bottom:10px">
      <span class="ci-lbl">Hoe voel je je vandaag?</span>
      <div class="hmr-row">${['😫','😕','😐','🙂','🔥'].map((e,i)=>`<button class="hmr-btn${todayD&&todayD.humeur===(i+1)?' on':''}" onclick="selH(${i+1})">${e}</button>`).join('')}</div>
    </div>
    <div style="margin-bottom:10px">
      <span class="ci-lbl">Productie intake vandaag (€)</span>
      <input class="ci-in" type="number" id="ci-pv" value="${todayD?todayD.productie_vandaag:''}" placeholder="0" min="0" step="100"/>
    </div>
    <div style="margin-bottom:12px;background:var(--tealfade);border-radius:var(--rs);padding:12px;border:1px solid rgba(79,209,165,.2)">
      <span class="ci-lbl" style="color:var(--teal)">🎯 Commit voor morgen (€) <span style="color:var(--red)">*</span></span>
      <input class="ci-in" type="number" id="ci-cm" value="${todayD?todayD.commit_morgen:''}" placeholder="Verplicht!" min="0" step="100" style="border-color:rgba(79,209,165,.4);background:var(--surface3)"/>
      <div style="font-size:11px;color:var(--text3);margin-top:4px">Verplicht — je kunt niet inchecken zonder commit voor morgen.</div>
    </div>
    <div style="margin-bottom:10px">
      <span class="ci-lbl">Top 3 acties voor morgen</span>
      <textarea class="ci-in" id="ci-top3" placeholder="1. ...&#10;2. ...&#10;3. ...">${todayD?.top3_acties||''}</textarea>
    </div>
    <div style="margin-bottom:12px">
      <span class="ci-lbl" style="${verplicht?'color:var(--red)':''}">${verplicht?'⚠️ Hoe ga jij dit fixen? (verplicht)':'Blokkades / notitie'}</span>
      <textarea class="ci-in" id="ci-n" placeholder="${verplicht?'Verplicht als je >15% achterloopt...':'Optioneel...'}" style="border-color:${verplicht?'rgba(240,79,94,.4)':'var(--border2)'}">${todayD?.notitie||''}</textarea>
    </div>
    <button class="primary full" onclick="saveCI(${verplicht})">${todayD?'Check-in bijwerken':'Check-in opslaan'}</button>
  </div>`;

  document.getElementById('content').innerHTML = h;
  setTimeout(startTyping, 300);
}

function selH(val) {
  selHumeur = val;
  document.querySelectorAll('.hmr-btn').forEach((b,i)=>b.classList.toggle('on',i+1===val));
}

async function saveCI(verplicht) {
  const pv = parseFloat(document.getElementById('ci-pv').value)||0;
  const cm = parseFloat(document.getElementById('ci-cm').value)||0;
  const n = document.getElementById('ci-n').value.trim();
  const top3 = document.getElementById('ci-top3').value.trim();
  if (!cm || cm <= 0) { toast('Commit voor morgen is verplicht — vul een bedrag in.','err'); document.getElementById('ci-cm').focus(); return; }
  if (verplicht&&!n) { toast('Vul in hoe je dit gaat fixen.','err'); return; }
  const today = nowD();
  const existing = dagrapporten.find(d=>d.user_id===me.id&&d.datum===today);
  try {
    const body = {productie_vandaag:pv,commit_morgen:cm,notitie:n||null,top3_acties:top3||null,humeur:selHumeur||null,user_id:me.id,datum:today};
    if (existing) await api('PATCH','/rest/v1/dagrapporten?id=eq.'+existing.id,body);
    else await api('POST','/rest/v1/dagrapporten',body);
    const nextDay = getNextWorkday(today);
    const existingC = commits.find(c=>c.user_id===me.id&&c.datum===nextDay&&!c.bevestigd);
    try {
      if (existingC) await api('PATCH','/rest/v1/commitments?id=eq.'+existingC.id,{omzet_forecast:cm});
      else await api('POST','/rest/v1/commitments',{user_id:me.id,regio_id:me.regio_id||null,datum:nextDay,omzet_forecast:cm});
    } catch {}
    try { await api('POST','/rest/v1/feed_berichten',{user_id:me.id,bericht:`📋 ${me.naam} heeft ingecheckt · Productie: ${eur(pv)} · Commit morgen: ${eur(cm)}`,type:'systeem'}); } catch {}
    await loadAll(); renderMed(); toast('Check-in opgeslagen! ✅','ok');
  } catch(e) { toast('Fout: '+e.message,'err'); }
}

function renderAdmin() {
  const m = nowM(); const today = nowD();
  const [y,mo] = m.split('-').map(Number);
  const dag = new Date().getDate();
  const wTot = gWd(y,mo); const wNu = gWdN(y,mo,dag); const wRest = gWdR(y,mo,dag);
  const mp = Math.round((wNu/wTot)*100);
  const regIds = isAdmin(me)?regios.map(r=>r.id):adminRegios.map(r=>r.regio_id);
  const meds = profielen.filter(u=>u.rol==='gebruiker'&&u.regio_id&&regIds.includes(u.regio_id));
  const totA = meds.reduce((s,u)=>s+calcA(u.id),0);
  const nict = meds.filter(u=>!dagrapporten.find(d=>d.user_id===u.id&&d.datum===today));
  const totT = meds.reduce((s,u)=>{const t=targets.find(x=>x.type==='persoon'&&x.user_id===u.id&&x.periode===m);return s+(t?.omzet_target||0);},0);
  const teamP = totT?pct(totA,totT):0;
  const uur = new Date().getHours();
  const beg = uur<12?'Goedemorgen':uur<18?'Goedemiddag':'Goedenavond';

  let h = '';

  h += `<div class="typing-card">
    <div class="tc-greeting">${beg}, ${me.naam?.split(' ')[0]||me.naam}! 👑</div>
    <div style="font-size:15px;font-weight:700;margin-top:4px">Team staat op <span style="color:${teamP<mp?'var(--red)':'var(--teal)'}">${teamP}%</span> · dag ${wNu}/${wTot}</div>
  </div>`;

  if (nict.length) h += `<div class="alert danger">⚠️ <strong>${nict.map(u=>u.naam||u.email).join(', ')}</strong> ${nict.length===1?'heeft':'hebben'} nog niet ingecheckt</div>`;

  h += `<div class="stats-row">
    <div class="stat"><div class="sv ct">${eur(totA)}</div><div class="sl">Totaal actuals</div><div class="ss">${m}</div></div>
    <div class="stat"><div class="sv ca">${mp}%</div><div class="sl">Maandvoortgang</div><div class="ss">Dag ${wNu}/${wTot}</div></div>
    <div class="stat"><div class="sv ${nict.length?'cr':'cg'}">${nict.length}</div><div class="sl">Niet ingecheckt</div></div>
    <div class="stat"><div class="sv cb">${regIds.length}</div><div class="sl">Regio's</div></div>
  </div>`;

  const myRegs = regios.filter(r=>regIds.includes(r.id));
  if (myRegs.length > 1) {
    h += `<div class="section-label">Regio overzicht</div><div class="card" style="margin-bottom:1rem">`;
    myRegs.forEach(r=>{
      const rM = meds.filter(u=>u.regio_id===r.id);
      const rA = rM.reduce((s,u)=>s+calcA(u.id),0);
      const rT = targets.find(t=>t.type==='regio'&&t.regio_id===r.id&&t.periode===m);
      const rP = rT?pct(rA,rT.omzet_target):null;
      h += `<div class="card-row"><div><div class="row-main">${r.naam} ${rP!==null?rP>=mp?'🟢':'🔴':''}</div><div class="row-sub">${eur(rA)}${rT?' · '+eur(rT.omzet_target):''}</div></div><span style="font-size:16px;font-weight:800;color:${rP===null?'var(--text3)':rP>=mp?'var(--green)':'var(--red)'}">${rP!==null?rP+'%':'—'}</span></div>`;
    });
    h += `</div>`;
  }

  h += `<div class="section-label">Medewerkers</div>`;
  meds.forEach(u=>{
    const actuals=calcA(u.id);
    const uT=targets.find(t=>t.type==='persoon'&&t.user_id===u.id&&t.periode===m);
    const uP=uT?pct(actuals,uT.omzet_target):null;
    const onT=uP!==null?uP>=mp:null;
    const reg=regios.find(r=>r.id===u.regio_id);
    const dr=dagrapporten.find(d=>d.user_id===u.id&&d.datum===today);
    const pD=uT?Math.round(uT.omzet_target/wTot):0;
    const ach=(pD*wNu)-actuals;
    const nN=wRest>0&&uT?Math.round((uT.omzet_target-actuals)/wRest):0;
    const str=calcStr(u.id);
    const isOp=openMed===u.id;
    const uC=commits.filter(c=>c.user_id===u.id).sort((a,b)=>b.datum.localeCompare(a.datum));

    h += `<div class="card" style="margin-bottom:.75rem">
      <div class="card-row click${isOp?' act':''}" onclick="openMed=openMed==='${u.id}'?null:'${u.id}';renderAdmin()">
        <div>
          <div class="row-main">${u.naam||u.email} ${onT!==null?onT?'🟢':'🔴':''} ${str>0?'🔥'+str:''}</div>
          <div class="row-sub">${reg?reg.naam:'Geen regio'} · ${eur(actuals)}${uT?' / '+eur(uT.omzet_target):''}</div>
        </div>
        <div class="row-right">
          ${isAdmin(me)?`<button class="sm amber" onclick="event.stopPropagation();openCR('${u.id}','${esc(u.naam||u.email)}',${actuals})">✏️</button>`:''}
          <span class="chev${isOp?' open':''}">▾</span>
        </div>
      </div>
      <div class="dp${isOp?' open':''}"><div class="di">
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">
          <div style="background:var(--surface3);border-radius:var(--rs);padding:8px;text-align:center;border:1px solid var(--border)"><div style="font-size:14px;font-weight:700;color:var(--teal)">${eur(actuals)}</div><div style="font-size:9px;color:var(--text3);text-transform:uppercase;margin-top:2px">Actuals</div></div>
          <div style="background:var(--surface3);border-radius:var(--rs);padding:8px;text-align:center;border:1px solid var(--border)"><div style="font-size:14px;font-weight:700;color:${ach>0?'var(--red)':'var(--green)'}">${ach>0?'-':'+'}${eur(Math.abs(ach))}</div><div style="font-size:9px;color:var(--text3);text-transform:uppercase;margin-top:2px">${ach>0?'Achter':'Voor'}</div></div>
          <div style="background:var(--surface3);border-radius:var(--rs);padding:8px;text-align:center;border:1px solid var(--border)"><div style="font-size:14px;font-weight:700;color:${nN>pD?'var(--red)':'var(--green)'}">${eur(nN)}</div><div style="font-size:9px;color:var(--text3);text-transform:uppercase;margin-top:2px">Nu/dag</div></div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
          <button class="sm primary" onclick="openAC('${u.id}','${esc(u.naam||u.email)}')">🎯 Commit</button>
          ${isAdmin(me)?`<button class="sm" onclick="openTE('${u.id}','${esc(u.naam||u.email)}',${uT?uT.omzet_target:0},'${uT?uT.id:''}')">🏆 Target</button>`:''}
          <button class="sm" onclick="openNM('user','${u.id}','${esc(u.naam||u.email)}')">🔔 Melding</button>
        </div>
        ${dr?`<div style="background:var(--surface3);border-radius:var(--rs);padding:10px 12px;margin-bottom:12px;border:1px solid var(--border)">
          <div style="font-size:10px;color:var(--text3);text-transform:uppercase;font-weight:600;letter-spacing:.05em;margin-bottom:4px">Check-in vandaag</div>
          <div style="font-size:13px">Productie: <strong style="color:var(--teal)">${eur(dr.productie_vandaag)}</strong> · Morgen: <strong style="color:var(--teal)">${eur(dr.commit_morgen)}</strong></div>
          ${dr.humeur?`<div style="font-size:16px;margin-top:4px">${['😫','😕','😐','🙂','🔥'][dr.humeur-1]}</div>`:''}
          ${dr.top3_acties?`<div style="margin-top:6px;font-size:12px;color:var(--text2);white-space:pre-wrap">${dr.top3_acties}</div>`:''}
          ${dr.notitie?`<div style="margin-top:4px;font-size:12px;color:var(--text3);font-style:italic">💬 ${dr.notitie}</div>`:''}
          <button class="sm" style="margin-top:8px" onclick="coachN(${dr.id})">✏️ Coaching notitie</button>
        </div>`:`<div style="background:var(--redfade);border-radius:var(--rs);padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--red);border:1px solid rgba(240,79,94,.2)">✗ Geen check-in vandaag</div>`}
        <div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Commits deze maand</div>
        ${uC.length?uC.map(c=>`<div style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)"><div style="flex:1"><div style="font-size:13px;font-weight:600">${fdt(c.datum)} — ${eur(c.omzet_forecast)}</div>${c.bevestigd?`<div style="font-size:11px;color:${c.gehaald?'var(--green)':'var(--red)'}">${c.gehaald?'✓ Gehaald':'✗ Gemist'} — ${eur(c.omzet_actuals)}</div>`:'<div style="font-size:11px;color:var(--text3)">Open</div>'}</div>${isAdmin(me)?`<button class="sm" onclick="openEC(${c.id},'${esc(u.naam||u.email)}',${c.omzet_forecast},'${c.datum}')">✏️</button>`:''}</div>`).join(''):`<div style="font-size:13px;color:var(--text3)">Geen commits.</div>`}
      </div></div>
    </div>`;
  });

  document.getElementById('content').innerHTML = h;
}

async function coachN(id) {
  const dr = dagrapporten.find(d=>d.id===id);
  const n = prompt('Coaching notitie:', dr?.coaching_notitie||'');
  if (n===null) return;
  try { await api('PATCH','/rest/v1/dagrapporten?id=eq.'+id,{coaching_notitie:n||null}); await loadAll(); renderAdmin(); toast('Opgeslagen','ok'); } catch(e) { toast('Fout: '+e.message,'err'); }
}

  document.getElementById('btn-ec-s').disabled=true;
  try { await api('PATCH','/rest/v1/commitments?id=eq.'+ecId,{omzet_forecast:o,datum:d}); document.getElementById('ov-ec').classList.remove('open'); await loadAll(); renderAdmin(); toast('Bijgewerkt.','ok'); } catch(e){toast('Fout: '+e.message,'err');}finally{document.getElementById('btn-ec-s').disabled=false;}
}

function openNM(type,id) {
  nmT=type; nmId=id||null;
  let html=`<span class="nm-tag${nmT==='all'?' on':''}" onclick="nmT='all';nmId=null;renderNMT()">👥 Heel team</span>`;
  regios.forEach(r=>{html+=`<span class="nm-tag${nmT==='regio'&&nmId==r.id?' on':''}" onclick="nmT='regio';nmId='${r.id}';renderNMT()">🗺️ ${r.naam}</span>`;});
  profielen.filter(u=>u.rol==='gebruiker'&&u.regio_id).forEach(u=>{html+=`<span class="nm-tag${nmT==='user'&&nmId===u.id?' on':''}" onclick="nmT='user';nmId='${u.id}';renderNMT()">👤 ${u.naam||u.email}</span>`;});
  document.getElementById('nm-tags').innerHTML=html;
  document.getElementById('nm-t').value=''; document.getElementById('nm-m').value='';
  document.getElementById('ov-nm').classList.add('open');
}
function renderNMT() { openNM(nmT,nmId); }
async function saveNM() {
  const title=v('nm-t'),msg=v('nm-m'); if(!title||!msg)return toast('Vul titel en bericht in.');
  const btn=document.getElementById('btn-nm-s'); btn.disabled=true; btn.innerHTML='<span class="ld"></span>';
  try {
    const s=getSess();
    const resp=await fetch('https://bstpobqvodljhpjzgnkp.supabase.co/functions/v1/send-notification',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token},body:JSON.stringify({type:'admin_message',userId:nmT==='all'?'all':nmT==='regio'?'regio:'+nmId:nmId,data:{title,message:msg}})});
    const data=await resp.json();
    document.getElementById('ov-nm').classList.remove('open');
    toast(data.sent>0?`Melding verstuurd naar ${data.sent} persoon${data.sent!==1?'en':''}! 🔔`:'Geen actieve subscriptions','ok');
  } catch(e){toast('Fout: '+e.message,'err');}finally{btn.disabled=false;btn.innerHTML='Versturen 🚀';}
}

// PUSH
function u8(b){const p='='.repeat((4-b.length%4)%4);const base64=(b+p).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(base64);const out=new Uint8Array(raw.length);for(let i=0;i<raw.length;++i)out[i]=raw.charCodeAt(i);return out;}
async function registerSW(){if('serviceWorker'in navigator)try{await navigator.serviceWorker.register('/sw.js');}catch{}}
let _dashReloadTimer=null;
function setupDashboardRealtime(){
  const scheduleReload=()=>{
    clearTimeout(_dashReloadTimer);
    _dashReloadTimer=setTimeout(async()=>{await loadAll();isRA(me)?renderAdmin():renderMed();},800);
  };
  _sb.channel('dashboard-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'commitments'},scheduleReload)
    .on('postgres_changes',{event:'*',schema:'public',table:'dagrapporten'},scheduleReload)
    .subscribe();
}
async function reqPush(){
  if(location.protocol!=='https:'){toast('Push werkt alleen via HTTPS.','err');return;}
  const reg=await navigator.serviceWorker.getRegistration('/sw.js');
  if(!reg){toast('Service worker niet gevonden.','err');return;}
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){toast('Notificaties geweigerd.');return;}
  try{
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)});
    const sd=sub.toJSON(); const s=getSess();
    await fetch(SB+'/rest/v1/push_subscriptions',{method:'POST',headers:{'Content-Type':'application/json','apikey':AK,'Authorization':'Bearer '+s.access_token,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({user_id:me.id,endpoint:sd.endpoint,p256dh:sd.keys?.p256dh,auth:sd.keys?.auth})});
    toast('Meldingen ingeschakeld! ✅','ok'); await loadAll(); isRA(me)?renderAdmin():renderMed();
  }catch(e){toast('Fout: '+e.message,'err');}
}

init();
