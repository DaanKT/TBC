<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Feed — TBC</title>
<link rel="apple-touch-icon" href="icon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="manifest" href="manifest.json"/>
<script>try{localStorage.setItem('tbc_theme','dark');document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
:root{
  --bg:#111827;
  --surface:#1f2937;
  --surface2:#263040;
  --surface3:#2d3748;
  --border:rgba(255,255,255,.08);
  --border2:rgba(255,255,255,.15);
  --text:#f1f5f9;
  --text2:#94a3b8;
  --text3:#475569;
  --teal:#4FD1A5;
  --tealfade:rgba(79,209,165,.12);
  --gold:#f6a623;
  --goldfade:rgba(246,166,35,.12);
  --red:#f04f5e;
  --redfade:rgba(240,79,94,.1);
  --green:#34d399;
  --greenfade:rgba(52,211,153,.1);
  --blue:#60a5fa;
  --navy:#0B1F3A;
  --r:12px;--rs:8px;
}
[data-theme=light]{
  --bg:#f1f5f9;
  --surface:#ffffff;
  --surface2:#f8fafc;
  --surface3:#e2e8f0;
  --border:rgba(0,0,0,.09);
  --border2:rgba(0,0,0,.14);
  --text:#0f172a;
  --text2:#475569;
  --text3:#94a3b8;
  --teal:#2a9d7a;
  --tealfade:rgba(42,157,122,.1);
  --gold:#d97706;
  --goldfade:rgba(217,119,6,.1);
  --red:#dc2626;
  --redfade:rgba(220,38,38,.08);
  --green:#16a34a;
  --greenfade:rgba(22,163,74,.1);
  --blue:#2563eb;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:68px;-webkit-font-smoothing:antialiased}
/* TOPBAR */
.topbar{background:var(--navy);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(255,255,255,.06)}
.topbar-logo{font-size:13px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.06em}
.topbar-logo span{color:var(--teal)}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.topbar-user{font-size:12px;color:rgba(255,255,255,.4)}
.btn-lo{font-family:'DM Sans',sans-serif;background:none;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.5);font-size:12px;padding:4px 10px;border-radius:var(--rs);cursor:pointer}
.btn-lo:hover{color:#fff}
/* SIDEBAR */
.sidebar{display:none;position:fixed;left:0;top:52px;bottom:0;width:210px;background:var(--navy);border-right:1px solid rgba(255,255,255,.06);flex-direction:column;padding:12px 10px;gap:2px;overflow-y:auto;z-index:50}
.sidebar::-webkit-scrollbar{display:none}
.sb-logo{font-size:11px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px 12px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:6px}
.sb-logo span{color:var(--teal)}
.sb-sec{font-size:9px;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:.08em;padding:8px 10px 3px;font-weight:700;margin-top:2px}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;font-size:13px;color:rgba(255,255,255,.45);cursor:pointer;border:none;background:none;transition:all .12s;width:100%;text-align:left;font-family:'DM Sans',sans-serif;font-weight:500}
.sb-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.8)}
.sb-item.active{background:rgba(79,209,165,.12);color:var(--teal);border:1px solid rgba(79,209,165,.18)}
.sb-ic{font-size:16px;line-height:1}
.sb-badge{margin-left:auto;background:var(--red);color:#fff;font-size:9px;padding:1px 6px;border-radius:99px;font-weight:700}
/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--navy);border-top:1px solid rgba(255,255,255,.07);display:flex;height:60px;z-index:100}
.bottom-nav::-webkit-scrollbar{display:none}
.bn-item{flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;font-weight:600;color:rgba(255,255,255,.3);cursor:pointer;border:none;background:none;text-transform:uppercase;letter-spacing:.02em;transition:color .12s}
.bn-item.active{color:var(--teal)}
.bn-item .ic{font-size:18px;line-height:1}
.bn-dot{width:4px;height:4px;border-radius:50%;background:var(--teal);opacity:0;margin-top:1px}
.bn-item.active .bn-dot{opacity:1}
/* CONTENT */
.content{padding:1rem;max-width:800px;margin:0 auto}
/* BUTTONS */
button{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border-radius:var(--rs);border:1px solid var(--border2);background:var(--surface2);color:var(--text);padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .12s;line-height:1}
button:hover{background:var(--surface3)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--teal);color:#000;border-color:var(--teal);font-weight:700}
button.primary:hover{opacity:.9}
button.amber{background:var(--goldfade);color:var(--gold);border-color:rgba(246,166,35,.25)}
button.danger{color:var(--red);border-color:rgba(240,79,94,.25);background:var(--redfade)}
button.sm{font-size:11px;padding:5px 10px}
button.full{width:100%;justify-content:center}
/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:.875rem}
.card-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.card-row:last-child{border-bottom:none}
.card-row.click{cursor:pointer;transition:background .1s}
.card-row.click:hover{background:var(--surface2)}
.card-row.act{background:var(--tealfade);border-left:2px solid var(--teal);padding-left:12px}
.row-main{font-size:14px;font-weight:600}
.row-sub{font-size:12px;color:var(--text2);margin-top:2px}
.row-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.sv{font-size:22px;font-weight:800;line-height:1;letter-spacing:-.02em}
.sl{font-size:10px;color:var(--text3);margin-top:5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.ss{font-size:12px;color:var(--text2);margin-top:3px}
.ct{color:var(--teal)}.cr{color:var(--red)}.ca{color:var(--gold)}.cg{color:var(--green)}.cb{color:var(--blue)}
/* PROGRESS */
.pb{height:5px;background:var(--border2);border-radius:99px;overflow:hidden;margin-top:6px}
.pf{height:100%;border-radius:99px;background:var(--teal);transition:width .5s}
.pf.red{background:var(--red)}.pf.gold{background:var(--gold)}
/* SECTION */
.section-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:1.25rem 0 .6rem;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
/* BADGES */
.badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid;white-space:nowrap;display:inline-block}
.b-verstuurd{background:rgba(96,165,250,.1);color:var(--blue);border-color:rgba(96,165,250,.25)}
.b-followup,.b-follow_up{background:var(--goldfade);color:var(--gold);border-color:rgba(246,166,35,.25)}
.b-gewonnen{background:var(--greenfade);color:var(--green);border-color:rgba(52,211,153,.25)}
.b-verloren{background:var(--redfade);color:var(--red);border-color:rgba(240,79,94,.25)}
.b-open{background:var(--goldfade);color:var(--gold);border-color:rgba(246,166,35,.25)}
.b-behandeling{background:rgba(96,165,250,.1);color:var(--blue);border-color:rgba(96,165,250,.25)}
.b-opgelost{background:var(--greenfade);color:var(--green);border-color:rgba(52,211,153,.25)}
.b-urgent{background:var(--redfade);color:var(--red);border-color:rgba(240,79,94,.35)}
.b-hoog{background:var(--redfade);color:var(--red);border-color:rgba(240,79,94,.25)}
.b-normaal{background:var(--surface2);color:var(--text2);border-color:var(--border2)}
.b-laag{background:var(--greenfade);color:var(--green);border-color:rgba(52,211,153,.25)}
/* ALERTS */
.alert{border-radius:var(--r);padding:11px 14px;margin-bottom:1rem;font-size:13px;display:flex;align-items:flex-start;gap:8px;border:1px solid}
.alert.warn{background:var(--goldfade);border-color:rgba(246,166,35,.2);color:var(--gold)}
.alert.danger{background:var(--redfade);border-color:rgba(240,79,94,.2);color:var(--red)}
.alert.success{background:var(--greenfade);border-color:rgba(52,211,153,.2);color:var(--green)}
.alert.info{background:rgba(96,165,250,.1);border-color:rgba(96,165,250,.2);color:var(--blue)}
/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:20px;width:100%;max-width:580px;max-height:92vh;overflow-y:auto;border:1px solid var(--border2);border-bottom:none}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:99px;margin:0 auto 16px}
.mt{font-size:16px;font-weight:700;margin-bottom:4px}
.ms{font-size:13px;color:var(--text2);margin-bottom:16px}
/* FORMS */
.field{margin-bottom:12px}
label{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],input[type=url],textarea,select{font-family:'DM Sans',sans-serif;font-size:14px;width:100%;border:1px solid var(--border2);border-radius:var(--rs);padding:10px 12px;color:var(--text);background:var(--surface2);outline:none;-webkit-appearance:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--teal)}
textarea{resize:vertical;min-height:80px;line-height:1.5}
select option{background:var(--surface2);color:var(--text)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* SEARCH */
.search-wrap{position:relative;margin-bottom:1rem}
.search-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;font-size:14px}
.search-bar{font-family:'DM Sans',sans-serif;font-size:14px;width:100%;border:1px solid var(--border2);border-radius:var(--rs);padding:10px 14px 10px 36px;color:var(--text);background:var(--surface2);outline:none}
.search-bar:focus{border-color:var(--teal)}
/* TAGS */
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.tag{font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid var(--border2);background:var(--surface2);cursor:pointer;color:var(--text2);transition:all .12s;font-weight:500;white-space:nowrap}
.tag.active{background:var(--tealfade);color:var(--teal);border-color:rgba(79,209,165,.3)}
/* TOAST */
.tw{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:6px;width:88%;max-width:380px;pointer-events:none}
.toast{background:var(--surface2);color:var(--text);font-size:13px;padding:11px 16px;border-radius:var(--rs);animation:tin .2s ease;text-align:center;border:1px solid var(--border2);pointer-events:all}
.toast.err{background:var(--redfade);color:var(--red);border-color:rgba(240,79,94,.3)}
.toast.ok{background:var(--greenfade);color:var(--green);border-color:rgba(52,211,153,.3)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* LOADER */
.ld{display:inline-block;width:18px;height:18px;border:2.5px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* MISC */
.empty{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:14px}
.chev{transition:transform .2s;color:var(--text3)}
.chev.open{transform:rotate(180deg)}
.dp{max-height:0;overflow:hidden;transition:max-height .35s ease}
.dp.open{max-height:3000px}
.di{padding:14px}
.page-title{font-size:20px;font-weight:800;letter-spacing:-.01em}
.page-sub{font-size:13px;color:var(--text2);margin-top:3px}
.help-btn{position:fixed;bottom:72px;right:16px;width:36px;height:36px;background:var(--surface2);color:var(--text2);border:1px solid var(--border2);border-radius:50%;font-size:15px;cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center;font-weight:700}
/* TOUR */
.tour-tip{position:fixed;background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:18px;width:min(290px,88vw);z-index:1000}
.tour-tip h3{font-size:15px;font-weight:700;margin-bottom:6px}
.tour-tip p{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:14px}
.tour-footer{display:flex;justify-content:space-between;align-items:center}
.tour-skip{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;padding:4px}
.tour-next{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;background:var(--teal);color:#000;border:none;border-radius:8px;padding:7px 16px;cursor:pointer}
.tour-dots{display:flex;gap:5px;justify-content:center;margin-top:12px}
.tour-dot{width:6px;height:6px;border-radius:50%;background:var(--border2)}
.tour-dot.on{background:var(--teal);width:16px;border-radius:3px}
/* RESPONSIVE */
@media(min-width:768px){
  body{padding-bottom:0}
  .bottom-nav{display:none}
  .sidebar{display:flex}
  .content{padding:0;margin-left:210px;height:calc(100vh - 52px)}
  .stats-row{grid-template-columns:repeat(4,1fr)}
  .help-btn{bottom:24px}
  .tw{bottom:24px}
}
/* FEED LAYOUT */
.content{padding:0;display:flex;flex-direction:column;height:calc(100vh - 52px - 60px)}
.feed-messages{flex:1;overflow-y:auto;padding:.875rem 1rem;display:flex;flex-direction:column;gap:4px}
.feed-messages::-webkit-scrollbar{width:4px}
.feed-messages::-webkit-scrollbar-track{background:transparent}
.feed-messages::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
.input-area{display:flex;gap:8px;align-items:flex-end;padding:10px 14px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0}
.input-box{flex:1;resize:none;border:1px solid var(--border2);border-radius:var(--r);padding:10px 12px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);background:var(--surface2);outline:none;line-height:1.5;transition:border-color .15s;overflow-y:auto}
.input-box:focus{border-color:var(--teal)}
.send-btn{flex-shrink:0;width:40px;height:40px;border-radius:50%;background:var(--teal);color:#000;border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;transition:opacity .12s;padding:0}
.send-btn:hover{opacity:.85}
/* MESSAGES */
.msg-group{display:flex;gap:10px;margin-bottom:6px;align-items:flex-end}
.msg-group.own{flex-direction:row-reverse}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;line-height:1}
.av-da{background:rgba(79,209,165,.25);color:var(--teal)}
.av-se{background:rgba(96,165,250,.25);color:var(--blue)}
.av-mi{background:rgba(246,166,35,.25);color:var(--gold)}
.bubble{max-width:74%;display:flex;flex-direction:column;gap:3px}
.bubble-name{font-size:10px;font-weight:700;color:var(--text3);padding:0 10px}
.bubble-text{background:var(--surface2);border:1px solid var(--border);border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:14px;line-height:1.5;word-break:break-word;color:var(--text)}
.msg-group.own .bubble-text{background:rgba(79,209,165,.13);border-color:rgba(79,209,165,.22);border-radius:16px 16px 4px 16px}
.bubble-time{font-size:10px;color:var(--text3);padding:0 10px}
.msg-group.own .bubble-name,.msg-group.own .bubble-time{text-align:right}
/* DATE + SYSTEM MESSAGES */
.date-divider{text-align:center;margin:10px 0;position:relative}
.date-divider::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:var(--border)}
.date-divider span{background:var(--bg);padding:0 10px;font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.04em;position:relative;z-index:1}
.sys-msg{text-align:center;font-size:12px;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:4px 14px;margin:4px auto;max-width:85%}
.sys-msg.win{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.25);color:var(--green)}
.sys-msg.streak{background:rgba(246,166,35,.1);border-color:rgba(246,166,35,.25);color:var(--gold)}
/* MENTIONS */
.mentions-popup{position:absolute;bottom:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);display:none;overflow:hidden;z-index:10}
.mentions-popup.open{display:block}
.mention-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:background .1s}
.mention-item:hover{background:var(--surface2)}
.mention-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:rgba(79,209,165,.25);color:var(--teal)}
.mention{background:rgba(79,209,165,.15);color:var(--teal);border-radius:4px;padding:1px 4px;font-weight:600}
/* TABS */
.feed-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface)}
.feed-tab{flex:1;padding:11px 8px;font-size:13px;font-weight:600;color:var(--text2);border:none;border-bottom:2px solid transparent;background:none;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:6px}
.feed-tab.active{color:var(--teal);border-bottom-color:var(--teal)}
.feed-tab:hover:not(.active){color:var(--text)}
.dm-tab-badge{background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:99px;display:none}
.dm-tab-badge.vis{display:inline-block}
/* PANELS */
.panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.panel.hidden{display:none!important}
/* DM LIST */
.dm-list{flex:1;overflow-y:auto;padding:.5rem}
.dm-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r);cursor:pointer;transition:background .1s}
.dm-item:hover{background:var(--surface2)}
.dm-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.dm-item-name{font-size:14px;font-weight:600}
.dm-item-sub{font-size:12px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
/* DM CHAT */
.dm-header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface)}
.dm-back{background:none;border:none;color:var(--text2);cursor:pointer;font-size:20px;line-height:1;padding:2px 4px;display:flex;align-items:center;border-radius:var(--rs)}
.dm-back:hover{background:var(--surface2)}
.dm-header-name{font-size:14px;font-weight:700}
.dm-messages{flex:1;overflow-y:auto;padding:.875rem 1rem;display:flex;flex-direction:column;gap:4px}
.dm-messages::-webkit-scrollbar{width:4px}
.dm-messages::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
.dm-input-wrap{display:flex;gap:8px;align-items:flex-end;padding:10px 14px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-logo">The Branding <span>Club</span></div>
  <div class="topbar-right">
    <span class="topbar-user" id="topbar-user"></span>
    <div id="tbr" style="display:flex;gap:6px"></div>

  </div>
</header>

  <div class="sb-logo">The Branding <span>Club</span></div>
  <button class="sb-item" onclick="location.href='dashboard.html'"><span class="sb-ic">🏠</span>Dashboard</button><button class="sb-item" onclick="location.href='offertes.html'"><span class="sb-ic">📋</span>Pipeline</button><button class="sb-item active" onclick="location.href='feed.html'"><span class="sb-ic">💬</span>Feed<span class="sb-badge">2</span></button><button class="sb-item" onclick="location.href='taken.html'"><span class="sb-ic">✅</span>Taken</button><div class="sb-sec">Operations</div><button class="sb-item" onclick="location.href='levertijden.html'"><span class="sb-ic">📦</span>Levertijden</button><button class="sb-item" onclick="location.href='klachten.html'"><span class="sb-ic">⚠️</span>Klachten</button><button class="sb-item" onclick="location.href='links.html'"><span class="sb-ic">🔗</span>Links</button><div class="sb-sec">Admin</div><button class="sb-item" onclick="location.href='meer.html'"><span class="sb-ic">⚙️</span>Beheer</button>
</nav>
<div class="tw" id="tw"></div>
<div class="content">
  <!-- Tab-balk -->
  <div class="feed-tabs">
    <button class="feed-tab active" id="tab-feed" onclick="switchTab('feed')">💬 Feed</button>
    <button class="feed-tab" id="tab-dm" onclick="switchTab('dm')">✉️ Berichten <span class="dm-tab-badge" id="dm-badge"></span></button>
  </div>

  <!-- Groepsfeed panel -->
  <div class="panel" id="panel-feed">
    <div class="feed-messages" id="feed-messages">
      <div style="text-align:center;padding:2rem;color:var(--text3)"><span class="ld"></span><br><br>Feed laden...</div>
    </div>
    <div style="position:relative">
      <div class="mentions-popup" id="mentions-popup"></div>
      <div class="input-area">
        <textarea class="input-box" id="msg-input" placeholder="Stuur een bericht... Typ @ om iemand te taggen" rows="1" oninput="autoResize(this);checkMention(this)"></textarea>
        <button class="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <!-- DM panel: lijst -->
  <div class="panel hidden" id="panel-dm">
    <div class="panel" id="dm-list-panel">
      <div class="dm-list" id="dm-list"></div>
    </div>
    <!-- DM panel: gesprek -->
    <div class="panel hidden" id="dm-chat-panel">
      <div class="dm-header">
        <button class="dm-back" onclick="closeDMChat()">←</button>
        <div class="dm-header-name" id="dm-peer-name"></div>
      </div>

      <div class="dm-input-wrap">
        <textarea class="input-box" id="dm-input" placeholder="Stuur een privébericht..." rows="1" oninput="autoResize(this)"></textarea>
        <button class="send-btn" onclick="sendDM()">➤</button>
      </div>
    </div>
  </div>
</div>




<script>
const SB='https://bstpobqvodljhpjzgnkp.supabase.co';
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdHBvYnF2b2RsamhwanpnbmtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MzEyODAsImV4cCI6MjA5NjEwNzI4MH0.zMy3hmD02DSCkVfAOh2URDqXm_WBFCYe8CgNkvWT_yI';
const _sb=supabase.createClient(SB,AK);
function getSession(){try{return JSON.parse(localStorage.getItem('tbc_session'));}catch(e){return null;}}
function getMe(){try{return JSON.parse(localStorage.getItem('tbc_me'));}catch(e){return null;}}
function logout(){localStorage.removeItem('tbc_session');localStorage.removeItem('tbc_me');location.href='login.html';}
function hdr(){const s=getSession();return{'apikey':AK,'Authorization':'Bearer '+(s?s.access_token:''),'Content-Type':'application/json','Prefer':'return=representation'};}
async function api(m,p,b){const r=await fetch(SB+p,{method:m,headers:hdr(),body:b?JSON.stringify(b):undefined});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null;}
function toast(msg,tp=''){const el=document.createElement('div');el.className='toast'+(tp?' '+tp:'');el.textContent=msg;document.getElementById('tw').appendChild(el);setTimeout(()=>el.remove(),3500);}
function fdt(d){return new Date(d).toLocaleDateString('nl-NL',{day:'2-digit',month:'short'});}
function ftm(d){return new Date(d).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});}

let me=null, profielen=[], berichtenCache=[];
let activeTab='feed', dmPeer=null, dmUnread=0;
const AV_COLORS=['av-da','av-se','av-mi'];
function avCls(idx){return AV_COLORS[Math.abs(idx)%AV_COLORS.length];}
const avatarColors={'da':'av-da','se':'av-se','mi':'av-mi'};

async function checkAuth(){
  const s=getSession();
  if(!s||!s.access_token){localStorage.clear();location.replace('login.html');return null;}
  let m=getMe();if(m&&m.id)return m;
  try{const p=await api('GET','/rest/v1/profielen?id=eq.'+s.user.id);if(p&&p.length){localStorage.setItem('tbc_me',JSON.stringify(p[0]));return p[0];}}catch(e){}
  localStorage.clear();location.replace('login.html');return null;
}

function getAvatarClass(userId){
  const initials=(profielen.find(p=>p.id===userId)?.naam||'?').slice(0,2).toUpperCase();
  const colors=['av-da','av-se','av-mi'];
  const idx=profielen.findIndex(p=>p.id===userId)%colors.length;
  return {cls:colors[Math.max(0,idx)],initials};
}

function renderBerichten(berichten){
  const el=document.getElementById('feed-messages');
  if(!berichten.length){el.innerHTML='<div style="text-align:center;padding:2rem;color:var(--text3);font-size:14px">Nog geen berichten. Stuur het eerste bericht! 👋</div>';return;}

  let html='';
  let lastDate='';

  berichten.forEach(b=>{
    const d=fdt(b.aangemaakt_op);
    if(d!==lastDate){html+=`<div class="date-divider"><span>${d}</span></div>`;lastDate=d;}

    if(b.type==='systeem'||b.type==='deal'||b.type==='streak'){
      const cls=b.type==='deal'?'win':b.type==='streak'?'streak':'';
      html+=`<div class="sys-msg ${cls}">${b.bericht}</div>`;
      return;
    }

    const isOwn=b.user_id===me.id;
    const profiel=profielen.find(p=>p.id===b.user_id);
    const naam=profiel?.naam||'Onbekend';
    const initials=naam.slice(0,2).toUpperCase();
    const avColors=['av-da','av-se','av-mi'];
    const avIdx=profielen.findIndex(p=>p.id===b.user_id)%avColors.length;
    const avCls=avColors[Math.max(0,avIdx)];

    // Highlight @mentions
    let tekst=b.bericht.replace(/@[\w\s]+/g,m=>`<span class="mention">${m}</span>`);

    html+=`<div class="msg-group${isOwn?' own':''}">
      <div class="avatar ${avCls}">${initials}</div>
      <div class="bubble">
        ${!isOwn?`<div class="bubble-name">${naam}</div>`:''}
        <div class="bubble-text">${tekst}</div>
        <div class="bubble-time">${ftm(b.aangemaakt_op)}</div>
      </div>
    </div>`;
  });

  el.innerHTML=html;
  el.scrollTop=el.scrollHeight;
}

async function loadFeed(){
  const berichten=await api('GET','/rest/v1/feed_berichten?order=aangemaakt_op.asc&limit=100')||[];
  berichtenCache=berichten;
  renderBerichten(berichten);
}

async function sendMessage(){
  const input=document.getElementById('msg-input');
  const tekst=input.value.trim();
  if(!tekst)return;

  // Detecteer mentions
  const mentionMatches=tekst.match(/@(\w+)/g)||[];
  const mentions=[];
  mentionMatches.forEach(m=>{
    const naam=m.slice(1).toLowerCase();
    const p=profielen.find(x=>(x.naam||'').toLowerCase().startsWith(naam));
    if(p)mentions.push(p.id);
  });

  try{
    const body={user_id:me.id,bericht:tekst,type:'bericht',mentions:mentions.length?mentions:null};
    await api('POST','/rest/v1/feed_berichten',body);
    input.value='';input.style.height='auto';
    await loadFeed();
  }catch(e){toast('Fout: '+e.message,'err');}
}

function autoResize(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,120)+'px';
}

function checkMention(el){
  const val=el.value;
  const atIdx=val.lastIndexOf('@');
  if(atIdx===-1){document.getElementById('mentions-popup').classList.remove('open');return;}
  const query=val.slice(atIdx+1).toLowerCase();
  const matches=profielen.filter(p=>(p.naam||'').toLowerCase().startsWith(query)&&p.id!==me.id);
  if(!matches.length){document.getElementById('mentions-popup').classList.remove('open');return;}

  const popup=document.getElementById('mentions-popup');
  popup.innerHTML=matches.map(p=>{
    const initials=(p.naam||'?').slice(0,2).toUpperCase();
    return `<div class="mention-item" onclick="insertMention('${p.naam}')">
      <div class="mention-av av-da">${initials}</div>
      <div style="font-size:13px;font-weight:600">${p.naam||p.email}</div>
    </div>`;
  }).join('');
  popup.classList.add('open');
}

function insertMention(naam){
  const input=document.getElementById('msg-input');
  const val=input.value;
  const atIdx=val.lastIndexOf('@');
  input.value=val.slice(0,atIdx)+'@'+naam+' ';
  document.getElementById('mentions-popup').classList.remove('open');
  input.focus();
}

/* ── TAB SWITCHING ───────────────────────────────────────── */
function switchTab(tab){
  activeTab=tab;
  document.getElementById('panel-feed').classList.toggle('hidden',tab!=='feed');
  document.getElementById('panel-dm').classList.toggle('hidden',tab!=='dm');
  document.getElementById('tab-feed').classList.toggle('active',tab==='feed');
  document.getElementById('tab-dm').classList.toggle('active',tab==='dm');
  if(tab==='dm'){dmUnread=0;updateDMBadge();if(!dmPeer)renderDMList();}
}
function updateDMBadge(){
  const el=document.getElementById('dm-badge');
  el.textContent=dmUnread||'';
  el.classList.toggle('vis',dmUnread>0);
}

/* ── DM LIJST ────────────────────────────────────────────── */
function renderDMList(){
  const el=document.getElementById('dm-list');
  const peers=profielen.filter(p=>p.id!==me.id);
  if(!peers.length){el.innerHTML='<div style="text-align:center;padding:2rem;color:var(--text3);font-size:14px">Geen collega\'s gevonden.</div>';return;}
  el.innerHTML=peers.map((p,i)=>`
    <div class="dm-item" onclick="openDMChat('${p.id}')">
      <div class="dm-av ${avCls(i)}">${(p.naam||'?').slice(0,2).toUpperCase()}</div>
      <div style="flex:1;min-width:0">
        <div class="dm-item-name">${p.naam||p.email}</div>
        ${p.regio_id?`<div class="dm-item-sub">${p.email||''}</div>`:''}
      </div>
      <span style="font-size:18px;color:var(--text3)">›</span>
    </div>`).join('');
}

/* ── DM GESPREK ──────────────────────────────────────────── */
async function openDMChat(peerId){
  dmPeer=profielen.find(p=>p.id===peerId);
  if(!dmPeer)return;
  document.getElementById('dm-list-panel').classList.add('hidden');
  document.getElementById('dm-chat-panel').classList.remove('hidden');
  document.getElementById('dm-peer-name').textContent=dmPeer.naam||dmPeer.email;
  await loadDMMessages();
}

function closeDMChat(){
  dmPeer=null;
  document.getElementById('dm-chat-panel').classList.add('hidden');
  document.getElementById('dm-list-panel').classList.remove('hidden');
}

async function loadDMMessages(){
  if(!dmPeer)return;
  const filter=`or=(and(sender_id.eq.${me.id},receiver_id.eq.${dmPeer.id}),and(sender_id.eq.${dmPeer.id},receiver_id.eq.${me.id}))`;
  const msgs=await api('GET',`/rest/v1/direct_messages?${filter}&order=created_at.asc&limit=100`)||[];
  renderDMMessages(msgs);
}

function renderDMMessages(msgs){
  const el=document.getElementById('dm-messages');
  if(!msgs.length){el.innerHTML='<div style="text-align:center;padding:2rem;color:var(--text3);font-size:13px">Stuur het eerste bericht! 👋</div>';return;}
  let html='',lastDate='';
  msgs.forEach(m=>{
    const d=fdt(m.created_at);
    if(d!==lastDate){html+=`<div class="date-divider"><span>${d}</span></div>`;lastDate=d;}
    const own=m.sender_id===me.id;
    html+=`<div class="msg-group${own?' own':''}">
      <div class="bubble">
        <div class="bubble-text">${m.message.replace(/</g,'&lt;')}</div>
        <div class="bubble-time">${ftm(m.created_at)}</div>
      </div>
    </div>`;
  });
  el.innerHTML=html;
  el.scrollTop=el.scrollHeight;
}

async function sendDM(){
  const input=document.getElementById('dm-input');
  const tekst=input.value.trim();
  if(!tekst||!dmPeer)return;
  input.value='';input.style.height='auto';
  try{
    await api('POST','/rest/v1/direct_messages',{sender_id:me.id,receiver_id:dmPeer.id,message:tekst});
    await loadDMMessages();
  }catch(e){toast('Fout: '+e.message,'err');}
}

/* ── REALTIME ─────────────────────────────────────────────── */
function setupRealtime(){
  _sb.channel('feed-berichten')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'feed_berichten'},()=>{
      if(activeTab==='feed')loadFeed();
    })
    .subscribe();

  _sb.channel('direct-messages-in')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'direct_messages',filter:`receiver_id=eq.${me.id}`},(payload)=>{
      if(activeTab==='dm'&&dmPeer&&dmPeer.id===payload.new.sender_id){
        loadDMMessages();
      } else {
        dmUnread++;
        updateDMBadge();
      }
    })
    .subscribe();
}

document.getElementById('msg-input').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
});
document.getElementById('dm-input').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendDM();}
});

async function init(){
  me=await checkAuth();if(!me)return;
  document.getElementById('topbar-user').textContent=me.naam||me.email;
  profielen=await api('GET','/rest/v1/profielen')||[];
  await loadFeed();
  setupRealtime();
}
init();
</script>
