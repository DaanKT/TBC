<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Klachten — The Branding Club</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0B1F3A;
    --navy-light: #1E3A5F;
    --teal: #4FD1A5;
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #1a1f2e;
    --muted: #6b7280;
    --radius: 10px;
    --radius-sm: 6px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { background: var(--navy); padding: 0 2rem; height: 60px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 14px; font-weight: 600; color: #fff; letter-spacing: 0.04em; text-transform: uppercase; }
  .logo span { color: var(--teal); }
  .header-sub { font-size: 12px; color: rgba(255,255,255,0.45); font-family: 'DM Mono', monospace; }
  main { max-width: 760px; margin: 2rem auto; padding: 0 1rem 4rem; }
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.5rem; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .stat-num { font-size: 22px; font-weight: 600; color: var(--text); line-height: 1; }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-num.red { color: #dc2626; }
  .stat-num.amber { color: #d97706; }
  .stat-num.green { color: #16a34a; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .toolbar-left { font-size: 13px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .toolbar-right { display: flex; gap: 8px; }
  button { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 7px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background 0.12s, border-color 0.12s; }
  button:hover { background: #f0f2f5; border-color: #c5cad4; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  button.primary:hover { background: var(--navy-light); border-color: var(--navy-light); }
  button.teal { background: var(--teal); color: var(--navy); border-color: var(--teal); font-weight: 600; }
  button.teal:hover { background: #3fbf95; border-color: #3fbf95; }
  button.danger { color: #dc2626; border-color: #fecaca; }
  button.danger:hover { background: #fef2f2; }
  button.small { font-size: 12px; padding: 5px 10px; }
  .list-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .klant-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; user-select: none; }
  .klant-row:last-of-type { border-bottom: none; }
  .klant-row:hover { background: #f8f9fb; }
  .klant-row.active { background: #f0f8f5; border-left: 3px solid var(--teal); padding-left: 15px; }
  .klant-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .klant-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .klant-right { display: flex; align-items: center; gap: 10px; }
  .badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 99px; border: 1px solid; white-space: nowrap; }
  .b-open { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
  .b-behandeling { background: #fffbeb; color: #92400e; border-color: #fde68a; }
  .b-wacht { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }
  .b-opgelost { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
  .chevron { font-size: 12px; color: var(--muted); transition: transform 0.2s; flex-shrink: 0; }
  .chevron.open { transform: rotate(180deg); }
  .detail-panel { background: #f8f9fb; border-bottom: 1px solid var(--border); max-height: 0; overflow: hidden; transition: max-height 0.28s ease; }
  .detail-panel.open { max-height: 1200px; }
  .detail-inner { padding: 16px 18px; }
  .klacht-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 10px; }
  .klacht-card:last-child { margin-bottom: 0; }
  .kc-header { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; flex-wrap: wrap; }
  .kc-deal { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }
  .kc-samen { font-size: 13px; color: var(--text); line-height: 1.55; }
  .kc-footer { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  select { font-family: 'DM Sans', sans-serif; font-size: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); color: var(--text); padding: 5px 8px; cursor: pointer; outline: none; }
  select:focus { border-color: var(--teal); }
  .detail-actions { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 14px; }
  .form-overlay { display: none; position: fixed; inset: 0; background: rgba(11,31,58,0.5); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
  .form-overlay.open { display: flex; }
  .form-modal { background: var(--card); border-radius: var(--radius); padding: 24px; width: 100%; max-width: 500px; border: 1px solid var(--border); }
  .form-title { font-size: 16px; font-weight: 600; margin-bottom: 18px; color: var(--text); }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
  input, textarea { font-family: 'DM Sans', sans-serif; font-size: 14px; width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; color: var(--text); background: var(--card); outline: none; transition: border-color 0.15s; }
  input:focus, textarea:focus { border-color: var(--teal); }
  textarea { resize: vertical; min-height: 90px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-footer { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; }
  .toast-wrap { position: fixed; bottom: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; gap: 6px; }
  .toast { background: var(--navy); color: #fff; font-size: 13px; padding: 10px 16px; border-radius: var(--radius-sm); animation: tin .2s ease; }
  .toast.error { background: #dc2626; }
  @keyframes tin { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  .loader { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  .loader.dark { border-color: rgba(0,0,0,0.15); border-top-color: var(--navy); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 500px) { .stats-row { grid-template-columns: 1fr 1fr; } .row2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <div class="logo">The Branding <span>Club</span></div>
  <div class="header-sub">Klachtenregistratie</div>
</header>

<main>
  <div class="stats-row">
    <div class="stat"><div class="stat-num" id="s-total">—</div><div class="stat-label">Totaal</div></div>
    <div class="stat"><div class="stat-num red" id="s-open">—</div><div class="stat-label">Open</div></div>
    <div class="stat"><div class="stat-num amber" id="s-behandeling">—</div><div class="stat-label">In behandeling</div></div>
    <div class="stat"><div class="stat-num green" id="s-opgelost">—</div><div class="stat-label">Opgelost</div></div>
  </div>

  <div class="toolbar">
    <span class="toolbar-left">Klanten</span>
    <div class="toolbar-right">
      <button id="btn-export" onclick="exportOpen()" style="display:none;">&#9993; Mail open klachten</button>
      <button class="primary" onclick="openForm()">+ Nieuwe klacht</button>
    </div>
  </div>

  <div class="list-card" id="list-card">
    <div class="empty-state"><div class="loader dark" style="margin:0 auto 12px;"></div><div>Klachten laden...</div></div>
  </div>
</main>

<div class="form-overlay" id="form-overlay" onclick="closeFormOutside(event)">
  <div class="form-modal">
    <div class="form-title">Klacht toevoegen</div>
    <div class="row2">
      <div class="field"><label>Klantnaam *</label><input type="text" id="f-klant" placeholder="bijv. De Wildse Hut" /></div>
      <div class="field"><label>Deal nummer</label><input type="text" id="f-deal" placeholder="optioneel" /></div>
    </div>
    <div class="field"><label>Klacht samenvatting *</label><textarea id="f-samen" placeholder="Beschrijf de klacht concreet..."></textarea></div>
    <div class="field"><label>Status</label>
      <select id="f-status" style="width:100%;padding:9px 12px;font-size:14px;">
        <option value="open">Open</option>
        <option value="behandeling">In behandeling</option>
        <option value="wacht">Wacht op klant</option>
        <option value="opgelost">Opgelost</option>
      </select>
    </div>
    <div class="form-footer">
      <button onclick="closeForm()">Annuleren</button>
      <button class="teal" id="btn-save" onclick="saveKlacht()">Opslaan</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script>
const SUPABASE_URL = 'https://bstpobqvodljhpjzgnkp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdHBvYnF2b2RsamhwanpnbmtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MzEyODAsImV4cCI6MjA5NjEwNzI4MH0.zMy3hmD02DSCkVfAOh2URDqXm_WBFCYe8CgNkvWT_yI';
const BASE = SUPABASE_URL + '/rest/v1/klachten';
const HEADERS = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

const statusMap = {
  open: { label: 'Open', cls: 'b-open' },
  behandeling: { label: 'In behandeling', cls: 'b-behandeling' },
  wacht: { label: 'Wacht op klant', cls: 'b-wacht' },
  opgelost: { label: 'Opgelost', cls: 'b-opgelost' }
};

let allKlachten = [];
let openKlant = null;

function toast(msg, err) {
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' error' : '');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

async function api(method, url, body) {
  const opts = { method, headers: HEADERS };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if (!res.ok) { const t = await res.text(); throw new Error(t); }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function loadKlachten() {
  try {
    allKlachten = await api('GET', BASE + '?order=aangemaakt_op.asc', null);
    render();
  } catch(e) {
    document.getElementById('list-card').innerHTML = '<div class="empty-state" style="color:#dc2626;">Kon geen verbinding maken met Supabase.<br><small>' + e.message + '</small></div>';
  }
}

function groupByKlant(items) {
  const map = {};
  items.forEach(k => {
    if (!map[k.klant]) map[k.klant] = [];
    map[k.klant].push(k);
  });
  return map;
}

function renderStats(items) {
  document.getElementById('s-total').textContent = items.length;
  document.getElementById('s-open').textContent = items.filter(k => k.status === 'open').length;
  document.getElementById('s-behandeling').textContent = items.filter(k => k.status === 'behandeling' || k.status === 'wacht').length;
  document.getElementById('s-opgelost').textContent = items.filter(k => k.status === 'opgelost').length;
  const hasOpen = items.some(k => k.status !== 'opgelost');
  document.getElementById('btn-export').style.display = hasOpen ? 'inline-flex' : 'none';
}

function render() {
  renderStats(allKlachten);
  const container = document.getElementById('list-card');
  const grouped = groupByKlant(allKlachten);
  const klanten = Object.keys(grouped);

  if (!klanten.length) {
    container.innerHTML = '<div class="empty-state"><div style="font-size:36px;margin-bottom:10px;opacity:0.4;">&#128203;</div><div>Nog geen klachten geregistreerd.</div><div style="margin-top:6px;font-size:12px;">Klik op "Nieuwe klacht" om te beginnen.</div></div>';
    return;
  }

  container.innerHTML = klanten.map(klant => {
    const items = grouped[klant];
    const isOpen = openKlant === klant;
    const openCount = items.filter(k => k.status !== 'opgelost').length;
    const statusSet = [...new Set(items.map(k => k.status))];
    const badges = statusSet.map(s => `<span class="badge ${statusMap[s].cls}">${statusMap[s].label}</span>`).join('');

    const detailHtml = items.map(k => `
      <div class="klacht-card" id="kc-${k.id}">
        <div class="kc-header">
          <span class="badge ${statusMap[k.status].cls}">${statusMap[k.status].label}</span>
          ${k.deal ? `<span class="kc-deal">${k.deal}</span>` : ''}
        </div>
        <div class="kc-samen">${k.samenvatting.replace(/</g,'&lt;')}</div>
        <div class="kc-footer">
          <select id="sel-${k.id}" onchange="updateStatus(${k.id}, this.value, '${esc(klant)}')">
            <option value="open" ${k.status==='open'?'selected':''}>Open</option>
            <option value="behandeling" ${k.status==='behandeling'?'selected':''}>In behandeling</option>
            <option value="wacht" ${k.status==='wacht'?'selected':''}>Wacht op klant</option>
            <option value="opgelost" ${k.status==='opgelost'?'selected':''}>Opgelost</option>
          </select>
          <button class="small danger" onclick="deleteKlacht(${k.id}, '${esc(klant)}')">&#128465; Verwijder</button>
        </div>
      </div>
    `).join('');

    return `
      <div>
        <div class="klant-row${isOpen ? ' active' : ''}" onclick="toggleKlant('${esc(klant)}')">
          <div>
            <div class="klant-name">${klant}</div>
            <div class="klant-meta">${items.length} klacht${items.length !== 1 ? 'en' : ''}${openCount > 0 ? ' &middot; ' + openCount + ' open' : ''}</div>
          </div>
          <div class="klant-right">
            <div style="display:flex;gap:4px;flex-wrap:wrap;">${badges}</div>
            <span class="chevron${isOpen ? ' open' : ''}">&#9660;</span>
          </div>
        </div>
        <div class="detail-panel${isOpen ? ' open' : ''}">
          <div class="detail-inner">
            ${detailHtml}
            <div class="detail-actions">
              <button class="small" onclick="mailKlant('${esc(klant)}')">&#9993; Mail klachten van ${klant}</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function toggleKlant(klant) {
  openKlant = openKlant === klant ? null : klant;
  render();
}

function openForm() {
  document.getElementById('form-overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-klant').focus(), 50);
}

function closeForm() {
  document.getElementById('form-overlay').classList.remove('open');
  ['f-klant','f-deal','f-samen'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-status').value = 'open';
}

function closeFormOutside(e) {
  if (e.target === document.getElementById('form-overlay')) closeForm();
}

async function saveKlacht() {
  const klant = document.getElementById('f-klant').value.trim();
  const samenvatting = document.getElementById('f-samen').value.trim();
  const deal = document.getElementById('f-deal').value.trim();
  const status = document.getElementById('f-status').value;
  if (!klant || !samenvatting) { toast('Vul klantnaam en samenvatting in.'); return; }

  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> Opslaan...';

  try {
    await api('POST', BASE, { klant, samenvatting, deal: deal || null, status });
    openKlant = klant;
    closeForm();
    await loadKlachten();
    toast('Klacht opgeslagen voor ' + klant + '.');
  } catch(e) {
    toast('Fout bij opslaan: ' + e.message, true);
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Opslaan';
  }
}

async function updateStatus(id, status, klant) {
  try {
    await api('PATCH', BASE + '?id=eq.' + id, { status });
    const k = allKlachten.find(x => x.id === id);
    if (k) k.status = status;
    openKlant = klant;
    render();
    toast('Status bijgewerkt.');
  } catch(e) {
    toast('Fout bij bijwerken: ' + e.message, true);
  }
}

async function deleteKlacht(id, klant) {
  if (!confirm('Klacht verwijderen?')) return;
  try {
    await api('DELETE', BASE + '?id=eq.' + id, null);
    allKlachten = allKlachten.filter(k => k.id !== id);
    const remaining = allKlachten.filter(k => k.klant === klant);
    openKlant = remaining.length ? klant : null;
    render();
    toast('Klacht verwijderd.');
  } catch(e) {
    toast('Fout bij verwijderen: ' + e.message, true);
  }
}

function mailKlant(klant) {
  const items = allKlachten.filter(k => k.klant === klant);
  const subject = encodeURIComponent('Klacht(en) — ' + klant);
  const body = buildBody([{ klant, items }]);
  window.location.href = 'mailto:matthijs@thebranding.club?subject=' + subject + '&body=' + encodeURIComponent(body);
}

function exportOpen() {
  const grouped = groupByKlant(allKlachten.filter(k => k.status !== 'opgelost'));
  const klanten = Object.keys(grouped);
  if (!klanten.length) { toast('Geen open klachten.'); return; }
  const list = klanten.map(klant => ({ klant, items: grouped[klant] }));
  const subject = encodeURIComponent('Open klachten — ' + new Date().toLocaleDateString('nl-NL'));
  const body = buildBody(list);
  window.location.href = 'mailto:matthijs@thebranding.club?subject=' + subject + '&body=' + encodeURIComponent(body);
}

function buildBody(list) {
  const lines = ['Hoi Matthijs,', '', 'Overzicht klachten:', ''];
  let n = 1;
  list.forEach(({ klant, items }) => {
    items.forEach(k => {
      lines.push(n + '. ' + klant);
      if (k.deal) lines.push('   Deal: ' + k.deal);
      lines.push('   Status: ' + statusMap[k.status].label);
      lines.push('   Klacht: ' + k.samenvatting);
      lines.push('');
      n++;
    });
  });
  lines.push('Met vriendelijke groet,', 'Daniël');
  return lines.join('\n');
}

function esc(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

loadKlachten();
</script>
</body>
</html>
