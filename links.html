<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Links — TBC</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<link rel="manifest" href="manifest.json"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0B1F3A;--navy-l:#1E3A5F;--teal:#4FD1A5;--bg:#f0f2f5;--card:#fff;--border:#e2e5ea;--text:#1a1f2e;--muted:#6b7280;--red:#dc2626;--amber:#d97706;--green:#16a34a;--r:12px;--rs:8px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
.topbar{background:var(--navy);padding:0 1rem;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.topbar-logo{font-size:13px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.06em}
.topbar-logo span{color:var(--teal)}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-user{font-size:12px;color:rgba(255,255,255,.5)}
.btn-lo{font-family:'DM Sans',sans-serif;font-size:12px;background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.5);padding:4px 10px;border-radius:var(--rs);cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:40;height:60px;overflow-x:auto;padding:0 4px}
.bottom-nav::-webkit-scrollbar{display:none}
.bn-item{min-width:60px;flex:1;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:none}
.bn-item.active{color:var(--teal)}
.bn-item .ic{font-size:20px;line-height:1}
.content{padding:1rem;max-width:720px;margin:0 auto}
button{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border-radius:var(--rs);border:1px solid var(--border);background:var(--card);color:var(--text);padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.teal{background:var(--teal);color:var(--navy);border-color:var(--teal);font-weight:600}
button.sm{font-size:12px;padding:5px 10px}
button.danger{color:var(--red);border-color:#fecaca}
button.danger:hover{background:#fef2f2}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:1rem}
.overlay{display:none;position:fixed;inset:0;background:rgba(11,31,58,.55);z-index:100;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:var(--r) var(--r) 0 0;padding:20px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 16px}
.mt{font-size:16px;font-weight:700;margin-bottom:16px}
.field{margin-bottom:12px}
label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=url],select{font-family:'DM Sans',sans-serif;font-size:15px;width:100%;border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;color:var(--text);background:var(--card);outline:none;-webkit-appearance:none}
input:focus{border-color:var(--teal)}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.tw{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:6px;width:90%;max-width:400px}
.toast{background:var(--navy);color:#fff;font-size:13px;padding:10px 16px;border-radius:var(--rs);animation:tin .2s ease;text-align:center}
.toast.ok{background:var(--green)}.toast.err{background:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ld{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.ld.dk{border-color:rgba(0,0,0,.1);border-top-color:var(--navy)}
@keyframes sp{to{transform:rotate(360deg)}}
.section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:1rem 0 .5rem}
.link-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1rem}
.link-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;transition:border-color .15s,transform .1s;text-decoration:none;display:flex;flex-direction:column;gap:6px;position:relative}
.link-card:hover{border-color:var(--teal);transform:translateY(-1px)}
.link-card:active{transform:scale(.98)}
.link-icoon{font-size:24px;line-height:1}
.link-naam{font-size:13px;font-weight:700;color:var(--text)}
.link-url{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-edit-btn{position:absolute;top:8px;right:8px;background:none;border:none;cursor:pointer;font-size:14px;color:var(--muted);padding:4px;border-radius:4px;display:none}
.link-card:hover .link-edit-btn{display:block}
.search-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:10px 14px;width:100%;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);outline:none;margin-bottom:1rem}
.search-bar:focus{border-color:var(--teal)}
.empty{text-align:center;padding:2rem;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-logo">The Branding <span>Club</span></div>
  <div class="topbar-right">
    <span class="topbar-user" id="topbar-user"></span>
    <button class="btn-lo" onclick="logout()">↩</button>
  </div>
</div>
<div class="content" id="content"><div class="empty"><span class="ld dk"></span><br><br>Laden...</div></div>
<nav class="bottom-nav">
  <button class="bn-item" onclick="location.href='dashboard.html'"><span class="ic">🏠</span><span>Home</span></button>
  <button class="bn-item" onclick="location.href='offertes.html'"><span class="ic">📋</span><span>Offertes</span></button>
  <button class="bn-item" onclick="location.href='feed.html'"><span class="ic">💬</span><span>Feed</span></button>
  <button class="bn-item" onclick="location.href='taken.html'"><span class="ic">✅</span><span>Taken</span></button>
  <button class="bn-item active" onclick="location.href='meer.html'"><span class="ic">⋯</span><span>Meer</span></button>
</nav>
<div class="tw" id="tw"></div>

<!-- Link modal -->
<div class="overlay" id="ov-link" onclick="if(event.target===this)this.classList.remove('open')">
<div class="modal"><div class="modal-handle"></div>
<div class="mt" id="lm-title">Link toevoegen</div>
<input type="hidden" id="lm-id"/>
<div class="field"><label>Naam *</label><input type="text" id="lm-naam" placeholder="bijv. Brandhub"/></div>
<div class="field"><label>URL *</label><input type="url" id="lm-url" placeholder="https://..."/></div>
<div class="field"><label>Icoon (emoji)</label><input type="text" id="lm-icoon" placeholder="🔗" maxlength="4"/></div>
<div class="field"><label>Categorie</label>
  <select id="lm-cat">
    <option>Intern</option><option>CRM</option><option>Klanten</option><option>Tools</option><option>Overig</option>
  </select>
</div>
<div class="mf">
  <button onclick="document.getElementById('ov-link').classList.remove('open')">Annuleren</button>
  <button id="lm-del" class="danger sm" onclick="deleteLink()" style="display:none">Verwijderen</button>
  <button class="teal" id="btn-lm-s" onclick="saveLink()">Opslaan</button>
</div>
</div></div>

<script>
const SB='https://bstpobqvodljhpjzgnkp.supabase.co';
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdHBvYnF2b2RsamhwanpnbmtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MzEyODAsImV4cCI6MjA5NjEwNzI4MH0.zMy3hmD02DSCkVfAOh2URDqXm_WBFCYe8CgNkvWT_yI';
function getSession(){try{return JSON.parse(localStorage.getItem('tbc_session'));}catch(e){return null;}}
function getMe(){try{return JSON.parse(localStorage.getItem('tbc_me'));}catch(e){return null;}}
function logout(){localStorage.removeItem('tbc_session');localStorage.removeItem('tbc_me');location.href='login.html';}
function hdr(){const s=getSession();return{'apikey':AK,'Authorization':'Bearer '+(s?s.access_token:''),'Content-Type':'application/json','Prefer':'return=representation'};}
async function api(m,p,b){const r=await fetch(SB+p,{method:m,headers:hdr(),body:b?JSON.stringify(b):undefined});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null;}
function toast(msg,tp=''){const el=document.createElement('div');el.className='toast'+(tp?' '+tp:'');el.textContent=msg;document.getElementById('tw').appendChild(el);setTimeout(()=>el.remove(),3500);}

let me=null, links=[], editId=null, zoekterm='';

async function checkAuth(){
  const s=getSession();if(!s){localStorage.clear();location.replace('login.html');return null;}
  let m=getMe();if(m&&m.id)return m;
  try{const p=await api('GET','/rest/v1/profielen?id=eq.'+s.user.id);if(p&&p.length){localStorage.setItem('tbc_me',JSON.stringify(p[0]));return p[0];}}catch(e){}
  localStorage.clear();location.replace('login.html');return null;
}

function isAdmin(me){return me&&me.rol==='admin';}

async function loadLinks(){
  links=await api('GET','/rest/v1/quick_links?actief=eq.true&order=categorie.asc,volgorde.asc')||[];
}

function render(){
  const gefilterd=zoekterm?links.filter(l=>l.naam.toLowerCase().includes(zoekterm)||l.url.toLowerCase().includes(zoekterm)||(l.categorie||'').toLowerCase().includes(zoekterm)):links;

  // Groepeer per categorie
  const cats={};
  gefilterd.forEach(l=>{
    const cat=l.categorie||'Overig';
    if(!cats[cat])cats[cat]=[];
    cats[cat].push(l);
  });

  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
    <div><div style="font-size:18px;font-weight:700">Snelle links</div><div style="font-size:12px;color:var(--muted)">${links.length} links beschikbaar</div></div>
    ${isAdmin(me)?`<button class="teal sm" onclick="openModal()">+ Link toevoegen</button>`:''}
  </div>
  <input class="search-bar" placeholder="🔍 Zoek een link..." oninput="zoekterm=this.value.toLowerCase();render()" value="${zoekterm}"/>`;

  if(!gefilterd.length){
    h+=`<div class="empty">Geen links gevonden.</div>`;
  } else {
    Object.entries(cats).forEach(([cat,catLinks])=>{
      h+=`<div class="section-label">${cat}</div><div class="link-grid">`;
      catLinks.forEach(l=>{
        h+=`<div class="link-card" onclick="openLink('${l.url}')">
          ${isAdmin(me)?`<button class="link-edit-btn" onclick="event.stopPropagation();openModal(${l.id})">✏️</button>`:''}
          <div class="link-icoon">${l.icoon||'🔗'}</div>
          <div class="link-naam">${l.naam}</div>
          <div class="link-url">${l.url.replace(/^https?:\/\//,'')}</div>
        </div>`;
      });
      h+=`</div>`;
    });
  }

  document.getElementById('content').innerHTML=h;
}

function openLink(url){
  // Probeer te openen, werkt ook als je moet inloggen
  window.open(url,'_blank');
}

function openModal(id=null){
  editId=id;
  document.getElementById('lm-title').textContent=id?'Link bewerken':'Link toevoegen';
  document.getElementById('lm-del').style.display=id?'inline-flex':'none';
  if(id){
    const l=links.find(x=>x.id===id);if(!l)return;
    document.getElementById('lm-id').value=l.id;
    document.getElementById('lm-naam').value=l.naam||'';
    document.getElementById('lm-url').value=l.url||'';
    document.getElementById('lm-icoon').value=l.icoon||'🔗';
    document.getElementById('lm-cat').value=l.categorie||'Overig';
  } else {
    document.getElementById('lm-id').value='';
    document.getElementById('lm-naam').value='';
    document.getElementById('lm-url').value='';
    document.getElementById('lm-icoon').value='🔗';
    document.getElementById('lm-cat').value='Intern';
  }
  document.getElementById('ov-link').classList.add('open');
}

async function saveLink(){
  const naam=document.getElementById('lm-naam').value.trim();
  const url=document.getElementById('lm-url').value.trim();
  if(!naam||!url){toast('Vul naam en URL in.','err');return;}
  const btn=document.getElementById('btn-lm-s');btn.disabled=true;
  try{
    const body={naam,url,icoon:document.getElementById('lm-icoon').value||'🔗',categorie:document.getElementById('lm-cat').value,aangemaakt_door:me.id};
    const id=document.getElementById('lm-id').value;
    if(id) await api('PATCH','/rest/v1/quick_links?id=eq.'+id,body);
    else await api('POST','/rest/v1/quick_links',body);
    document.getElementById('ov-link').classList.remove('open');
    await loadLinks();render();toast('Link opgeslagen! ✅','ok');
  }catch(e){toast('Fout: '+e.message,'err');}finally{btn.disabled=false;}
}

async function deleteLink(){
  const id=document.getElementById('lm-id').value;
  if(!id||!confirm('Link verwijderen?'))return;
  try{
    await api('PATCH','/rest/v1/quick_links?id=eq.'+id,{actief:false});
    document.getElementById('ov-link').classList.remove('open');
    await loadLinks();render();toast('Link verwijderd.','ok');
  }catch(e){toast('Fout: '+e.message,'err');}
}

async function init(){
  me=await checkAuth();if(!me)return;
  document.getElementById('topbar-user').textContent=me.naam||me.email;
  await loadLinks();render();
}
init();
</script>
</body>
</html>
