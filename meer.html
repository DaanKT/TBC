<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Meer — TBC</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="manifest" href="manifest.json"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0B1F3A;--navy-l:#1E3A5F;--teal:#4FD1A5;--teal-d:#3ab891;--bg:#f0f2f5;--card:#fff;--border:#e2e5ea;--text:#1a1f2e;--muted:#6b7280;--red:#dc2626;--amber:#d97706;--green:#16a34a;--blue:#2563eb;--r:10px;--rs:6px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
.topbar{background:var(--navy);padding:0 1rem;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.topbar-logo{font-size:13px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.06em}
.topbar-logo span{color:var(--teal)}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-user{font-size:12px;color:rgba(255,255,255,.5)}
.btn-lo{font-family:'DM Sans',sans-serif;font-size:12px;background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.5);padding:4px 10px;border-radius:var(--rs);cursor:pointer}
.btn-lo:hover{color:#fff;border-color:rgba(255,255,255,.5)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:40;height:60px}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:none;transition:color .15s;padding:0;position:relative}
.bn-item.active{color:var(--teal)}
.bn-item .ic{font-size:20px;line-height:1}
.bn-badge{position:absolute;top:6px;right:calc(50% - 18px);background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:99px}
.content{padding:1rem;max-width:600px;margin:0 auto}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.page-title{font-size:18px;font-weight:700}
.page-sub{font-size:13px;color:var(--muted);margin-top:2px}
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1.25rem}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.stat.click{cursor:pointer;transition:border-color .15s}
.stat.click:hover,.stat.act{border-color:var(--teal);background:#f0fdf9}
.sv{font-size:22px;font-weight:700;line-height:1}
.sl{font-size:11px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.ss{font-size:12px;color:var(--muted);margin-top:4px}
.cr{color:var(--red)}.ca{color:var(--amber)}.cg{color:var(--green)}.cb{color:var(--blue)}.cn{color:var(--navy)}
button{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border-radius:var(--rs);border:1px solid var(--border);background:var(--card);color:var(--text);padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s}
button:hover{background:#f0f2f5}
button:disabled{opacity:.4;cursor:not-allowed}
button.teal{background:var(--teal);color:var(--navy);border-color:var(--teal);font-weight:600}
button.teal:hover{background:var(--teal-d)}
button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
button.primary:hover{background:var(--navy-l)}
button.danger{color:var(--red);border-color:#fecaca}
button.danger:hover{background:#fef2f2}
button.amber{background:#fffbeb;color:#92400e;border-color:#fde68a}
button.sm{font-size:12px;padding:5px 10px}
button.full{width:100%;justify-content:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:1rem}
.card-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.card-row:last-child{border-bottom:none}
.card-row.click{cursor:pointer;transition:background .1s}
.card-row.click:hover{background:#f8f9fb}
.card-row.act{background:#f0fdf9;border-left:3px solid var(--teal);padding-left:13px}
.row-main{font-size:14px;font-weight:600}
.row-sub{font-size:12px;color:var(--muted);margin-top:2px}
.row-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;border:1px solid;white-space:nowrap}
.b-open{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.b-behandeling{background:#fffbeb;color:#92400e;border-color:#fde68a}
.b-wacht{background:#eff6ff;color:#1e40af;border-color:#bfdbfe}
.b-opgelost{background:#f0fdf4;color:#166534;border-color:#bbf7d0}
.b-admin{background:rgba(79,209,165,.15);color:#0d6e52;border-color:var(--teal)}
.b-user{background:#f0f4ff;color:#3730a3;border-color:#c7d2fe}
.b-gehaald{background:#f0fdf4;color:#166534;border-color:#bbf7d0}
.b-gemist{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.b-open2{background:#fffbeb;color:#92400e;border-color:#fde68a}
.dp{max-height:0;overflow:hidden;transition:max-height .3s ease;background:#f8f9fb;border-bottom:1px solid var(--border)}
.dp.open{max-height:2000px}
.di{padding:14px 16px}
.overlay{display:none;position:fixed;inset:0;background:rgba(11,31,58,.55);z-index:100;align-items:flex-end;justify-content:center;padding:0}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:var(--r) var(--r) 0 0;padding:20px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 16px}
.mt{font-size:16px;font-weight:700;margin-bottom:4px}
.ms{font-size:13px;color:var(--muted);margin-bottom:16px}
.field{margin-bottom:12px}
label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],textarea,select{font-family:'DM Sans',sans-serif;font-size:15px;width:100%;border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;color:var(--text);background:var(--card);outline:none;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--teal)}
textarea{resize:vertical;min-height:80px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.pb{height:6px;background:var(--border);border-radius:99px;margin-top:6px;overflow:hidden}
.pf{height:100%;border-radius:99px;background:var(--teal);transition:width .4s}
.pf.am{background:var(--amber)}.pf.re{background:var(--red)}
.alert{border-radius:var(--r);padding:12px 16px;margin-bottom:1rem;font-size:13px}
.alert.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.alert.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.alert.success{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--muted);font-size:14px}
.divider{border:none;border-top:1px solid var(--border);margin:12px 0}
.tw{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:6px;width:90%;max-width:400px}
.toast{background:var(--navy);color:#fff;font-size:13px;padding:10px 16px;border-radius:var(--rs);animation:tin .2s ease;text-align:center}
.toast.err{background:var(--red)}.toast.ok{background:var(--green)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ld{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.ld.dk{border-color:rgba(0,0,0,.1);border-top-color:var(--navy)}
@keyframes sp{to{transform:rotate(360deg)}}
.section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:1rem 0 .5rem}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.75rem}
.tag{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:background .12s}
.tag.active{background:var(--navy);color:#fff;border-color:var(--navy)}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-logo">The Branding <span>Club</span></div>
  <div class="topbar-right"><span class="topbar-user" id="topbar-user"></span><button class="btn-lo" onclick="logout()">↩</button></div>
</div>
<div class="content" id="content"><div class="empty"><span class="ld dk"></span></div></div>
<nav class="bottom-nav">
  <button class="bn-item" onclick="location.href='dashboard.html'"><span class="ic">🏠</span><span>Home</span></button>
  <button class="bn-item" onclick="location.href='dagrapporten.html'"><span class="ic">📋</span><span>Dagrapport</span></button>
  <button class="bn-item" onclick="location.href='taken.html'"><span class="ic">✅</span><span>Taken</span></button>
  <button class="bn-item" onclick="location.href='klachten.html'"><span class="ic">⚠️</span><span>Klachten</span></button>
  <button class="bn-item active" onclick="location.href='meer.html'"><span class="ic">⋯</span><span>Meer</span></button>
</nav>
<div class="tw" id="tw"></div>

<!-- Gebruiker modal -->
<div class="overlay" id="ov-um" onclick="if(event.target===this)this.classList.remove('open')">
<div class="modal"><div class="modal-handle"></div>
<div class="mt" id="um-mt">Gebruiker</div>
<input type="hidden" id="um-id"/>
<div class="field"><label>Naam *</label><input type="text" id="um-n"/></div>
<div class="field"><label>E-mail</label><input type="email" id="um-e"/></div>
<div id="um-p-wrap" class="field"><label>Wachtwoord *</label><input type="password" id="um-p" placeholder="minimaal 6 tekens"/></div>
<div class="field"><label>Rol</label><select id="um-rol"><option value="gebruiker">Gebruiker</option><option value="admin">Admin</option></select></div>
<div class="field"><label>Regio</label><select id="um-r"><option value="">— Geen —</option></select></div>
<div class="mf"><button onclick="document.getElementById('ov-um').classList.remove('open')">Annuleren</button><button class="teal" id="btn-um-s" onclick="saveUser()">Opslaan</button></div>
</div></div>

<!-- Regio modal -->
<div class="overlay" id="ov-rg" onclick="if(event.target===this)this.classList.remove('open')">
<div class="modal"><div class="modal-handle"></div>
<div class="mt">Regio</div>
<div class="field"><label>Naam *</label><input type="text" id="rg-n" placeholder="bijv. Noord-Holland"/></div>
<div class="mf"><button onclick="document.getElementById('ov-rg').classList.remove('open')">Annuleren</button><button class="teal" id="btn-rg-s" onclick="saveRegio()">Opslaan</button></div>
</div></div>

<!-- Target modal -->
<div class="overlay" id="ov-tg" onclick="if(event.target===this)this.classList.remove('open')">
<div class="modal"><div class="modal-handle"></div>
<div class="mt">Target instellen</div>
<div class="field"><label>Type</label><select id="tg-tp" onchange="document.getElementById('tg-rw').style.display=this.value==='regio'?'block':'none';document.getElementById('tg-uw').style.display=this.value==='persoon'?'block':'none'"><option value="regio">Regio</option><option value="persoon">Persoon</option></select></div>
<div class="field" id="tg-rw"><label>Regio</label><select id="tg-r"></select></div>
<div class="field" id="tg-uw" style="display:none"><label>Persoon</label><select id="tg-u"></select></div>
<div class="field"><label>Periode</label><input type="month" id="tg-p"/></div>
<div class="field"><label>Target (€) *</label><input type="number" id="tg-o" placeholder="50000" min="0" step="1000"/></div>
<div class="mf"><button onclick="document.getElementById('ov-tg').classList.remove('open')">Annuleren</button><button class="teal" id="btn-tg-s" onclick="saveTarget()">Opslaan</button></div>
</div></div>

<script>
const SB='https://bstpobqvodljhpjzgnkp.supabase.co';
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdHBvYnF2b2RsamhwanpnbmtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MzEyODAsImV4cCI6MjA5NjEwNzI4MH0.zMy3hmD02DSCkVfAOh2URDqXm_WBFCYe8CgNkvWT_yI';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdHBvYnF2b2RsamhwanpnbmtwIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDUzMTI4MCwiZXhwIjoyMDk2MTA3MjgwfQ.2Nrgk7-TxZ-gIAFYhjcfNTFdm6g-6HaGIu3QGCEckPs';

function getSession(){try{return JSON.parse(localStorage.getItem('tbc_session'));}catch(e){return null;}}
function getMe(){try{return JSON.parse(localStorage.getItem('tbc_me'));}catch(e){return null;}}
function setMe(p){localStorage.setItem('tbc_me',JSON.stringify(p));}
function logout(){localStorage.removeItem('tbc_session');localStorage.removeItem('tbc_me');location.href='login.html';}
function hdr(svc=false){const s=getSession();const t=svc?SK:(s?s.access_token:'');return{'apikey':AK,'Authorization':'Bearer '+t,'Content-Type':'application/json','Prefer':'return=representation'};}
async function api(m,p,b,svc=false){const r=await fetch(SB+p,{method:m,headers:hdr(svc),body:b?JSON.stringify(b):undefined});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null;}
async function aApi(m,p,b,svc=false){const s=getSession();const tk=svc?SK:(s?s.access_token:'');const r=await fetch(SB+p,{method:m,headers:{'apikey':AK,'Authorization':'Bearer '+tk,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null;}
function v(id){return(document.getElementById(id)?.value||'').trim();}
function eur(n){return'€'+Number(n||0).toLocaleString('nl-NL',{minimumFractionDigits:0,maximumFractionDigits:0});}
function fdt(d){return new Date(d).toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'});}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0;}
function nowM(){return new Date().toISOString().slice(0,7);}
function nowD(){return new Date().toISOString().slice(0,10);}
function toast(msg,tp=''){const el=document.createElement('div');el.className='toast'+(tp?' '+tp:'');el.textContent=msg;let tw=document.getElementById('tw');if(!tw){tw=document.createElement('div');tw.id='tw';tw.className='tw';document.body.appendChild(tw);}tw.appendChild(el);setTimeout(()=>el.remove(),3500);}
function esc(s){return String(s).replace(/'/g,"'");}
async function checkAuth(){const s=getSession();if(!s){location.href='login.html';return null;}const me=getMe();if(me)return me;try{const p=await api('GET','/rest/v1/profielen?id=eq.'+s.user.id);if(!p||!p.length)throw new Error('no profile');setMe(p[0]);return p[0];}catch(e){logout();return null;}}
function isAdmin(me){return me&&me.rol==='admin';}


let me=null, profielen=[], regios=[], targets=[];
let editRegioId=null, resetUID=null;

async function init(){
  me=await checkAuth(); if(!me)return;
  document.getElementById('topbar-user').textContent=(me.naam||me.email)+(isAdmin(me)?' (Admin)':'');
  if(isAdmin(me)){
    regios=await api('GET','/rest/v1/regios?order=naam.asc')||[];
    targets=await api('GET','/rest/v1/targets?order=periode.desc')||[];
    profielen=await api('GET','/rest/v1/profielen')||[];
  }
  render();
}

let activeTab='kpi';
function render(){
  const isA=isAdmin(me);
  let h=`<div class="page-header"><div><div class="page-title">Meer</div></div></div>`;
  const tabs=isA?[['kpi',"KPI's"],['gebruikers','Gebruikers'],['regios',"Regio's"],['targets','Targets']]:[[' kpi',"KPI's"]];
  h+=`<div class="tag-row">`;
  (isA?[['kpi',"📈 KPI's"],['gebruikers','👥 Gebruikers'],['regios',"🗺️ Regio's"],['targets','🏆 Targets']]:[[' kpi',"📈 KPI's"]]).forEach(([t,l])=>{
    h+=`<span class="tag ${activeTab===t.trim()?'active':''}" onclick="activeTab='${t.trim()}';render()">${l}</span>`;
  });
  h+=`</div>`;
  if(activeTab==='kpi') h+=renderKPI(isA);
  else if(activeTab==='gebruikers') h+=renderGebruikers();
  else if(activeTab==='regios') h+=renderRegios();
  else if(activeTab==='targets') h+=renderTargets();
  document.getElementById('content').innerHTML=h;
}

function renderKPI(isA){
  const m=nowM();
  const myReg=regios.find(r=>r.id===me.regio_id);
  let h=`<div class="section-label">Mijn prestaties — ${m}</div>`;
  // will be loaded async via fetch if needed — show placeholder
  h+=`<div class="alert info">KPI-data wordt geladen via de andere pagina's. Zie Dashboard voor je actuele cijfers.</div>`;
  if(isA && regios.length){
    h+=`<div class="section-label">Targets per regio</div><div class="card">`;
    regios.forEach(r=>{
      const rt=targets.filter(t=>t.type==='regio'&&t.regio_id===r.id).slice(0,3);
      h+=`<div class="card-row"><div><div class="row-main">${r.naam}</div><div class="row-sub">${rt.length?rt.map(t=>t.periode+': €'+Number(t.omzet_target).toLocaleString('nl-NL')).join(' · '):'Geen targets'}</div></div></div>`;
    });
    h+=`</div>`;
  }
  return h;
}

function renderGebruikers(){
  let h=`<div style="display:flex;justify-content:flex-end;margin-bottom:.75rem"><button class="teal sm" onclick="openUM()">+ Gebruiker</button></div>`;
  h+=`<div class="card">`;
  if(!profielen.length) h+=`<div class="empty">Geen gebruikers.</div>`;
  profielen.forEach(u=>{
    const reg=regios.find(r=>r.id===u.regio_id);
    h+=`<div class="card-row"><div><div class="row-main">${u.naam||u.email}</div><div class="row-sub">${u.email} · ${reg?reg.naam:'Geen regio'}</div></div>
    <div class="row-right">
      <span class="badge ${u.rol==='admin'?'b-admin':'b-user'}">${u.rol}</span>
      <button class="sm" onclick="openEditU('${u.id}','${esc(u.naam||'')}','${esc(u.email)}','${u.rol}','${u.regio_id||''}')">✏️</button>
    </div></div>`;
  });
  h+=`</div>`;
  return h;
}

function renderRegios(){
  let h=`<div style="display:flex;justify-content:flex-end;margin-bottom:.75rem"><button class="teal sm" onclick="openRM()">+ Regio</button></div>`;
  h+=`<div class="card">`;
  if(!regios.length) h+=`<div class="empty">Geen regio's.</div>`;
  regios.forEach(r=>{
    const leden=profielen.filter(u=>u.regio_id===r.id);
    h+=`<div class="card-row"><div><div class="row-main">${r.naam}</div><div class="row-sub">${leden.map(u=>u.naam||u.email).join(', ')||'Geen leden'}</div></div>
    <div class="row-right"><button class="sm" onclick="openRM(${r.id},'${esc(r.naam)}')">✏️</button><button class="sm danger" onclick="delRg(${r.id})">🗑</button></div></div>`;
  });
  h+=`</div>`;
  return h;
}

function renderTargets(){
  let h=`<div style="display:flex;justify-content:flex-end;margin-bottom:.75rem"><button class="teal sm" onclick="openTM()">+ Target</button></div>`;
  h+=`<div class="card">`;
  if(!targets.length) h+=`<div class="empty">Geen targets.</div>`;
  targets.slice(0,20).forEach(t=>{
    const naam=t.type==='regio'?(regios.find(r=>r.id===t.regio_id)?.naam||'?'):(profielen.find(u=>u.id===t.user_id)?.naam||'?');
    h+=`<div class="card-row"><div><div class="row-main">${naam} — ${t.periode}</div><div class="row-sub"><span class="badge ${t.type==='regio'?'b-behandeling':'b-user'}">${t.type}</span> · €${Number(t.omzet_target).toLocaleString('nl-NL')}</div></div>
    <div class="row-right"><button class="sm danger" onclick="delTg(${t.id})">🗑</button></div></div>`;
  });
  h+=`</div>`;
  return h;
}

// GEBRUIKER
function openUM(){
  document.getElementById('um-n').value='';document.getElementById('um-e').value='';document.getElementById('um-p').value='';
  document.getElementById('um-rol').value='gebruiker';
  document.getElementById('um-r').innerHTML='<option value="">— Geen —</option>'+regios.map(r=>`<option value="${r.id}">${r.naam}</option>`).join('');
  document.getElementById('um-id').value='';
  document.getElementById('um-mt').textContent='Nieuwe gebruiker';
  document.getElementById('um-p-wrap').style.display='block';
  document.getElementById('ov-um').classList.add('open');
}
function openEditU(id,naam,email,rol,regioId){
  document.getElementById('um-id').value=id;
  document.getElementById('um-n').value=naam;
  document.getElementById('um-e').value=email;
  document.getElementById('um-p').value='';
  document.getElementById('um-rol').value=rol;
  document.getElementById('um-r').innerHTML='<option value="">— Geen —</option>'+regios.map(r=>`<option value="${r.id}"${r.id==regioId?' selected':''}>${r.naam}</option>`).join('');
  document.getElementById('um-mt').textContent='Gebruiker bewerken';
  document.getElementById('um-p-wrap').style.display='none';
  document.getElementById('ov-um').classList.add('open');
}
async function saveUser(){
  const id=document.getElementById('um-id').value;
  const n=document.getElementById('um-n').value.trim();
  const e=document.getElementById('um-e').value.trim();
  const p=document.getElementById('um-p').value;
  const rol=document.getElementById('um-rol').value;
  const rid=document.getElementById('um-r').value;
  const btn=document.getElementById('btn-um-s');btn.disabled=true;btn.innerHTML='<span class="ld"></span>';
  try{
    if(id){
      // update profiel
      await api('PATCH','/rest/v1/profielen?id=eq.'+id,{naam:n,rol,regio_id:rid?parseInt(rid):null});
      if(p&&p.length>=6) await aApi('PUT','/auth/v1/admin/users/'+id,{password:p},true);
      const u=profielen.find(x=>x.id===id);if(u){u.naam=n;u.rol=rol;u.regio_id=rid?parseInt(rid):null;}
    } else {
      if(!n||!e||!p){toast('Vul naam, e-mail en wachtwoord in.');return;}
      const res=await aApi('POST','/auth/v1/admin/users',{email:e,password:p,email_confirm:true,user_metadata:{naam:n}},true);
      await api('POST','/rest/v1/profielen',{id:res.id,email:e,naam:n,rol,regio_id:rid?parseInt(rid):null},true);
      profielen.push({id:res.id,email:e,naam:n,rol,regio_id:rid?parseInt(rid):null});
    }
    document.getElementById('ov-um').classList.remove('open');
    activeTab='gebruikers';render();toast('Opgeslagen.','ok');
  }catch(ex){toast('Fout: '+ex.message,'err');}finally{btn.disabled=false;btn.innerHTML='Opslaan';}
}

// REGIO
function openRM(id,naam){editRegioId=id||null;document.getElementById('rg-n').value=naam||'';document.getElementById('ov-rg').classList.add('open');}
async function saveRegio(){
  const n=document.getElementById('rg-n').value.trim();if(!n){toast('Naam verplicht.');return;}
  const btn=document.getElementById('btn-rg-s');btn.disabled=true;btn.innerHTML='<span class="ld"></span>';
  try{if(editRegioId){await api('PATCH','/rest/v1/regios?id=eq.'+editRegioId,{naam:n});const r=regios.find(x=>x.id===editRegioId);if(r)r.naam=n;}
    else{const res=await api('POST','/rest/v1/regios',{naam:n});if(res&&res[0])regios.push(res[0]);}
    document.getElementById('ov-rg').classList.remove('open');activeTab='regios';render();toast('Opgeslagen.','ok');
  }catch(e){toast('Fout: '+e.message,'err');}finally{btn.disabled=false;btn.innerHTML='Opslaan';}
}
async function delRg(id){if(!confirm('Verwijderen?'))return;try{await api('DELETE','/rest/v1/regios?id=eq.'+id);regios=regios.filter(r=>r.id!==id);activeTab='regios';render();toast('Verwijderd.');}catch(e){toast('Fout: '+e.message,'err');}}

// TARGET
function openTM(){
  document.getElementById('tg-tp').value='regio';document.getElementById('tg-rw').style.display='block';document.getElementById('tg-uw').style.display='none';
  document.getElementById('tg-r').innerHTML=regios.map(r=>`<option value="${r.id}">${r.naam}</option>`).join('');
  document.getElementById('tg-u').innerHTML=profielen.map(u=>`<option value="${u.id}">${u.naam||u.email}</option>`).join('');
  document.getElementById('tg-p').value=nowM();document.getElementById('tg-o').value='';
  document.getElementById('ov-tg').classList.add('open');
}
async function saveTarget(){
  const tp=document.getElementById('tg-tp').value;const per=document.getElementById('tg-p').value;const omz=parseFloat(document.getElementById('tg-o').value);
  if(!per||isNaN(omz)){toast('Vul periode en target in.');return;}
  const b={type:tp,periode:per,omzet_target:omz};
  if(tp==='regio')b.regio_id=parseInt(document.getElementById('tg-r').value);else b.user_id=document.getElementById('tg-u').value;
  const btn=document.getElementById('btn-tg-s');btn.disabled=true;btn.innerHTML='<span class="ld"></span>';
  try{const res=await api('POST','/rest/v1/targets',b);if(res&&res[0])targets.unshift(res[0]);document.getElementById('ov-tg').classList.remove('open');activeTab='targets';render();toast('Opgeslagen.','ok');}
  catch(e){toast('Fout: '+e.message,'err');}finally{btn.disabled=false;btn.innerHTML='Opslaan';}
}
async function delTg(id){if(!confirm('Verwijderen?'))return;try{await api('DELETE','/rest/v1/targets?id=eq.'+id);targets=targets.filter(t=>t.id!==id);render();toast('Verwijderd.');}catch(e){toast('Fout: '+e.message,'err');}}

init();

</script>
</body>
</html>
