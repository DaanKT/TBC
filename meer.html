<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Meer — TBC</title>
<link rel="apple-touch-icon" href="icon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="manifest" href="manifest.json"/>
<script>try{localStorage.setItem('tbc_theme','dark');document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
:root{
  --bg:#111827;
  --surface:#1f2937;
  --surface2:#263040;
  --surface3:#2d3748;
  --border:rgba(255,255,255,.08);
  --border2:rgba(255,255,255,.15);
  --text:#f1f5f9;
  --text2:#94a3b8;
  --text3:#475569;
  --teal:#4FD1A5;
  --tealfade:rgba(79,209,165,.12);
  --gold:#f6a623;
  --goldfade:rgba(246,166,35,.12);
  --red:#f04f5e;
  --redfade:rgba(240,79,94,.1);
  --green:#34d399;
  --greenfade:rgba(52,211,153,.1);
  --blue:#60a5fa;
  --navy:#0B1F3A;
  --r:12px;--rs:8px;
}
[data-theme=light]{
  --bg:#f1f5f9;
  --surface:#ffffff;
  --surface2:#f8fafc;
  --surface3:#e2e8f0;
  --border:rgba(0,0,0,.09);
  --border2:rgba(0,0,0,.14);
  --text:#0f172a;
  --text2:#475569;
  --text3:#94a3b8;
  --teal:#2a9d7a;
  --tealfade:rgba(42,157,122,.1);
  --gold:#d97706;
  --goldfade:rgba(217,119,6,.1);
  --red:#dc2626;
  --redfade:rgba(220,38,38,.08);
  --green:#16a34a;
  --greenfade:rgba(22,163,74,.1);
  --blue:#2563eb;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:68px;-webkit-font-smoothing:antialiased}
/* TOPBAR */
.topbar{background:var(--navy);height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(255,255,255,.06)}
.topbar-logo{font-size:13px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.06em}
.topbar-logo span{color:var(--teal)}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.topbar-user{font-size:12px;color:rgba(255,255,255,.4)}
.btn-lo{font-family:'DM Sans',sans-serif;background:none;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.5);font-size:12px;padding:4px 10px;border-radius:var(--rs);cursor:pointer}
.btn-lo:hover{color:#fff}
/* SIDEBAR */
.sidebar{display:none;position:fixed;left:0;top:52px;bottom:0;width:210px;background:var(--navy);border-right:1px solid rgba(255,255,255,.06);flex-direction:column;padding:12px 10px;gap:2px;overflow-y:auto;z-index:50}
.sidebar::-webkit-scrollbar{display:none}
.sb-logo{font-size:11px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px 12px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:6px}
.sb-logo span{color:var(--teal)}
.sb-sec{font-size:9px;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:.08em;padding:8px 10px 3px;font-weight:700;margin-top:2px}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;font-size:13px;color:rgba(255,255,255,.45);cursor:pointer;border:none;background:none;transition:all .12s;width:100%;text-align:left;font-family:'DM Sans',sans-serif;font-weight:500}
.sb-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.8)}
.sb-item.active{background:rgba(79,209,165,.12);color:var(--teal);border:1px solid rgba(79,209,165,.18)}
.sb-ic{font-size:16px;line-height:1}
.sb-badge{margin-left:auto;background:var(--red);color:#fff;font-size:9px;padding:1px 6px;border-radius:99px;font-weight:700}
/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--navy);border-top:1px solid rgba(255,255,255,.07);display:flex;height:60px;z-index:100}
.bottom-nav::-webkit-scrollbar{display:none}
.bn-item{flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;font-weight:600;color:rgba(255,255,255,.3);cursor:pointer;border:none;background:none;text-transform:uppercase;letter-spacing:.02em;transition:color .12s}
.bn-item.active{color:var(--teal)}
.bn-item .ic{font-size:18px;line-height:1}
.bn-dot{width:4px;height:4px;border-radius:50%;background:var(--teal);opacity:0;margin-top:1px}
.bn-item.active .bn-dot{opacity:1}
/* CONTENT */
.content{padding:1rem;max-width:800px;margin:0 auto}
/* BUTTONS */
button{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border-radius:var(--rs);border:1px solid var(--border2);background:var(--surface2);color:var(--text);padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .12s;line-height:1}
button:hover{background:var(--surface3)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--teal);color:#000;border-color:var(--teal);font-weight:700}
button.primary:hover{opacity:.9}
button.amber{background:var(--goldfade);color:var(--gold);border-color:rgba(246,166,35,.25)}
button.danger{color:var(--red);border-color:rgba(240,79,94,.25);background:var(--redfade)}
button.sm{font-size:11px;padding:5px 10px}
button.full{width:100%;justify-content:center}
/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:.875rem}
.card-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.card-row:last-child{border-bottom:none}
.card-row.click{cursor:pointer;transition:background .1s}
.card-row.click:hover{background:var(--surface2)}
.card-row.act{background:var(--tealfade);border-left:2px solid var(--teal);padding-left:12px}
.row-main{font-size:14px;font-weight:600}
.row-sub{font-size:12px;color:var(--text2);margin-top:2px}
.row-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.sv{font-size:22px;font-weight:800;line-height:1;letter-spacing:-.02em}
.sl{font-size:10px;color:var(--text3);margin-top:5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.ss{font-size:12px;color:var(--text2);margin-top:3px}
.ct{color:var(--teal)}.cr{color:var(--red)}.ca{color:var(--gold)}.cg{color:var(--green)}.cb{color:var(--blue)}
/* PROGRESS */
.pb{height:5px;background:var(--border2);border-radius:99px;overflow:hidden;margin-top:6px}
.pf{height:100%;border-radius:99px;background:var(--teal);transition:width .5s}
.pf.red{background:var(--red)}.pf.gold{background:var(--gold)}
/* SECTION */
.section-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:1.25rem 0 .6rem;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
/* BADGES */
.badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid;white-space:nowrap;display:inline-block}
.b-verstuurd{background:rgba(96,165,250,.1);color:var(--blue);border-color:rgba(96,165,250,.25)}
.b-followup,.b-follow_up{background:var(--goldfade);color:var(--gold);border-color:rgba(246,166,35,.25)}
.b-gewonnen{background:var(--greenfade);color:var(--green);border-color:rgba(52,211,153,.25)}
.b-verloren{background:var(--redfade);color:var(--red);border-color:rgba(240,79,94,.25)}
.b-open{background:var(--goldfade);color:var(--gold);border-color:rgba(246,166,35,.25)}
.b-behandeling{background:rgba(96,165,250,.1);color:var(--blue);border-color:rgba(96,165,250,.25)}
.b-opgelost{background:var(--greenfade);color:var(--green);border-color:rgba(52,211,153,.25)}
.b-urgent{background:var(--redfade);color:var(--red);border-color:rgba(240,79,94,.35)}
.b-hoog{background:var(--redfade);color:var(--red);border-color:rgba(240,79,94,.25)}
.b-normaal{background:var(--surface2);color:var(--text2);border-color:var(--border2)}
.b-laag{background:var(--greenfade);color:var(--green);border-color:rgba(52,211,153,.25)}
/* ALERTS */
.alert{border-radius:var(--r);padding:11px 14px;margin-bottom:1rem;font-size:13px;display:flex;align-items:flex-start;gap:8px;border:1px solid}
.alert.warn{background:var(--goldfade);border-color:rgba(246,166,35,.2);color:var(--gold)}
.alert.danger{background:var(--redfade);border-color:rgba(240,79,94,.2);color:var(--red)}
.alert.success{background:var(--greenfade);border-color:rgba(52,211,153,.2);color:var(--green)}
.alert.info{background:rgba(96,165,250,.1);border-color:rgba(96,165,250,.2);color:var(--blue)}
/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:20px;width:100%;max-width:580px;max-height:92vh;overflow-y:auto;border:1px solid var(--border2);border-bottom:none}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:99px;margin:0 auto 16px}
.mt{font-size:16px;font-weight:700;margin-bottom:4px}
.ms{font-size:13px;color:var(--text2);margin-bottom:16px}
/* FORMS */
.field{margin-bottom:12px}
label{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],input[type=url],textarea,select{font-family:'DM Sans',sans-serif;font-size:14px;width:100%;border:1px solid var(--border2);border-radius:var(--rs);padding:10px 12px;color:var(--text);background:var(--surface2);outline:none;-webkit-appearance:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--teal)}
textarea{resize:vertical;min-height:80px;line-height:1.5}
select option{background:var(--surface2);color:var(--text)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* SEARCH */
.search-wrap{position:relative;margin-bottom:1rem}
.search-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;font-size:14px}
.search-bar{font-family:'DM Sans',sans-serif;font-size:14px;width:100%;border:1px solid var(--border2);border-radius:var(--rs);padding:10px 14px 10px 36px;color:var(--text);background:var(--surface2);outline:none}
.search-bar:focus{border-color:var(--teal)}
/* TAGS */
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.tag{font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid var(--border2);background:var(--surface2);cursor:pointer;color:var(--text2);transition:all .12s;font-weight:500;white-space:nowrap}
.tag.active{background:var(--tealfade);color:var(--teal);border-color:rgba(79,209,165,.3)}
/* TOAST */
.tw{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:6px;width:88%;max-width:380px;pointer-events:none}
.toast{background:var(--surface2);color:var(--text);font-size:13px;padding:11px 16px;border-radius:var(--rs);animation:tin .2s ease;text-align:center;border:1px solid var(--border2);pointer-events:all}
.toast.err{background:var(--redfade);color:var(--red);border-color:rgba(240,79,94,.3)}
.toast.ok{background:var(--greenfade);color:var(--green);border-color:rgba(52,211,153,.3)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* LOADER */
.ld{display:inline-block;width:18px;height:18px;border:2.5px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* MISC */
.empty{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:14px}
.chev{transition:transform .2s;color:var(--text3)}
.chev.open{transform:rotate(180deg)}
.dp{max-height:0;overflow:hidden;transition:max-height .35s ease}
.dp.open{max-height:3000px}
.di{padding:14px}
.page-title{font-size:20px;font-weight:800;letter-spacing:-.01em}
.page-sub{font-size:13px;color:var(--text2);margin-top:3px}
.help-btn{position:fixed;bottom:72px;right:16px;width:36px;height:36px;background:var(--surface2);color:var(--text2);border:1px solid var(--border2);border-radius:50%;font-size:15px;cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center;font-weight:700}
/* TOUR */
.tour-tip{position:fixed;background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:18px;width:min(290px,88vw);z-index:1000}
.tour-tip h3{font-size:15px;font-weight:700;margin-bottom:6px}
.tour-tip p{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:14px}
.tour-footer{display:flex;justify-content:space-between;align-items:center}
.tour-skip{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;padding:4px}
.tour-next{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;background:var(--teal);color:#000;border:none;border-radius:8px;padding:7px 16px;cursor:pointer}
.tour-dots{display:flex;gap:5px;justify-content:center;margin-top:12px}
.tour-dot{width:6px;height:6px;border-radius:50%;background:var(--border2)}
.tour-dot.on{background:var(--teal);width:16px;border-radius:3px}
/* RESPONSIVE */
@media(min-width:768px){
  body{padding-bottom:0}
  .bottom-nav{display:none}
  .sidebar{display:flex}
  .content{padding:1.5rem 2rem;margin-left:210px}
  .stats-row{grid-template-columns:repeat(4,1fr)}
  .help-btn{bottom:24px}
  .tw{bottom:24px}
}
</style>
</head>

<script>
const SB='https://bstpobqvodljhpjzgnkp.supabase.co';
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdHBvYnF2b2RsamhwanpnbmtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MzEyODAsImV4cCI6MjA5NjEwNzI4MH0.zMy3hmD02DSCkVfAOh2URDqXm_WBFCYe8CgNkvWT_yI';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdHBvYnF2b2RsamhwanpnbmtwIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDUzMTI4MCwiZXhwIjoyMDk2MTA3MjgwfQ.2Nrgk7-TxZ-gIAFYhjcfNTFdm6g-6HaGIu3QGCEckPs';

function getSession(){try{return JSON.parse(localStorage.getItem('tbc_session'));}catch(e){return null;}}
function getMe(){try{return JSON.parse(localStorage.getItem('tbc_me'));}catch(e){return null;}}
function setMe(p){localStorage.setItem('tbc_me',JSON.stringify(p));}
function logout(){localStorage.removeItem('tbc_session');localStorage.removeItem('tbc_me');location.href='login.html';}
function hdr(svc=false){const s=getSession();const t=svc?SK:(s?s.access_token:'');return{'apikey':AK,'Authorization':'Bearer '+t,'Content-Type':'application/json','Prefer':'return=representation'};}
async function api(m,p,b,svc=false){const r=await fetch(SB+p,{method:m,headers:hdr(svc),body:b?JSON.stringify(b):undefined});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null;}
async function aApi(m,p,b,svc=false){const s=getSession();const tk=svc?SK:(s?s.access_token:'');const r=await fetch(SB+p,{method:m,headers:{'apikey':AK,'Authorization':'Bearer '+tk,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null;}
function v(id){return(document.getElementById(id)?.value||'').trim();}
function eur(n){return'€'+Number(n||0).toLocaleString('nl-NL',{minimumFractionDigits:0,maximumFractionDigits:0});}
function fdt(d){return new Date(d).toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'});}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0;}
function nowM(){return new Date().toISOString().slice(0,7);}
function nowD(){return new Date().toISOString().slice(0,10);}
function toast(msg,tp=''){const el=document.createElement('div');el.className='toast'+(tp?' '+tp:'');el.textContent=msg;let tw=document.getElementById('tw');if(!tw){tw=document.createElement('div');tw.id='tw';tw.className='tw';document.body.appendChild(tw);}tw.appendChild(el);setTimeout(()=>el.remove(),3500);}
function esc(s){return String(s).split("'").join("&apos;");}
async function refreshSession(){
  const s=getSession();
  if(!s||!s.refresh_token) return null;
  try{
    const res=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',
      headers:{'apikey':AK,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:s.refresh_token})
    });
    if(!res.ok) return null;
    const data=await res.json();
    if(data.access_token){
      localStorage.setItem('tbc_session',JSON.stringify(data));
      return data;
    }
  }catch(e){}
  return null;
}

async function checkAuth(){
  let s=getSession();
  if(!s||!s.access_token){localStorage.clear();location.replace('login.html');return null;}
  
  // Check if token is expired or about to expire (within 10 min)
  try{
    const payload=JSON.parse(atob(s.access_token.split('.')[1]));
    const expiresIn=(payload.exp*1000)-Date.now();
    if(expiresIn<600000){ // less than 10 minutes
      const newSession=await refreshSession();
      if(newSession) s=newSession;
      else if(expiresIn<0){localStorage.clear();location.replace('login.html');return null;}
    }
  }catch(e){}

  const me=getMe();
  if(me&&me.id)return me;
  try{
    const p=await api('GET','/rest/v1/profielen?id=eq.'+s.user.id);
    if(!p||!p.length)throw new Error('no profile');
    setMe(p[0]);return p[0];
  }catch(e){
    // Try refresh before giving up
    const newSession=await refreshSession();
    if(newSession){
      try{
        const p2=await api('GET','/rest/v1/profielen?id=eq.'+s.user.id);
        if(p2&&p2.length){setMe(p2[0]);return p2[0];}
      }catch(e2){}
    }
    localStorage.clear();location.replace('login.html');return null;
  }
}
function isAdmin(me){return me&&me.rol==='admin';}
function isRegioAdmin(me){return me&&(me.rol==='admin'||me.rol==='regio_admin');}
function isSuperAdmin(me){return me&&me.rol==='admin';}


let me=null, profielen=[], regios=[], targets=[];
let editRegioId=null, resetUID=null;

let adminRegioMap={};

async function init(){
  me=await checkAuth(); if(!me)return;
  document.getElementById('topbar-user').textContent=(me.naam||me.email)+(isAdmin(me)?' (Admin)':'');
  if(isAdmin(me)){
    regios=await api('GET','/rest/v1/regios?order=naam.asc')||[];
    targets=await api('GET','/rest/v1/targets?order=periode.desc')||[];
    profielen=await api('GET','/rest/v1/profielen')||[];
    await loadAdminRegios();
  }
  render();
}

async function loadAdminRegios(){
  const ar=await api('GET','/rest/v1/admin_regios')||[];
  adminRegioMap={};
  ar.forEach(x=>{
    if(!adminRegioMap[x.user_id]) adminRegioMap[x.user_id]=[];
    adminRegioMap[x.user_id].push(x.regio_id);
  });
}

async function toggleAdminRegio(userId, regioId, hasIt){
  try{
    if(hasIt){
      await api('DELETE',`/rest/v1/admin_regios?user_id=eq.${userId}&regio_id=eq.${regioId}`);
      if(adminRegioMap[userId]) adminRegioMap[userId]=adminRegioMap[userId].filter(r=>r!==regioId);
    } else {
      await api('POST','/rest/v1/admin_regios',{user_id:userId,regio_id:regioId});
      if(!adminRegioMap[userId]) adminRegioMap[userId]=[];
      adminRegioMap[userId].push(regioId);
    }
    activeTab='gebruikers';render();
    toast(hasIt?'Regio ontkoppeld.':'Regio gekoppeld.','ok');
  }catch(e){toast('Fout: '+e.message,'err');}
}

let activeTab='kpi';
function render(){
  const isA=isAdmin(me);
  let h=`<div class="page-header"><div><div class="page-title">Meer</div></div></div>`;
  const tabs=isA?[['kpi',"KPI's"],['offertes','Offertes'],['gebruikers','Gebruikers'],['regios',"Regio's"],['targets','Targets']]:[[' kpi',"KPI's"],['offertes','Offertes']];
  h+=`<div class="tag-row">`;
  (isA?[['kpi',"📈 KPI's"],['offertes','📋 Offertes'],['links','🔗 Links'],['gebruikers','👥 Gebruikers'],['regios',"🗺️ Regio's"],['targets','🏆 Targets'],['instellingen','⚙️ Instellingen']]:[[' kpi',"📈 KPI's"],['offertes','📋 Offertes'],['links','🔗 Links']]).forEach(([t,l])=>{
    h+=`<span class="tag ${activeTab===t.trim()?'active':''}" onclick="activeTab='${t.trim()}';render()">${l}</span>`;
  });
  h+=`</div>`;
  if(activeTab==='kpi') h+=renderKPI(isA);
  else if(activeTab==='offertes') h+=renderOffertes();
  else if(activeTab==='links') h+=renderLinks();
  else if(activeTab==='gebruikers') h+=renderGebruikers();
  else if(activeTab==='regios') h+=renderRegios();
  else if(activeTab==='targets') h+=renderTargets();
  else if(activeTab==='instellingen') h+=renderInstellingen();
  document.getElementById('content').innerHTML=h;
}

function renderGebruikers(){
  let h=`<div style="display:flex;justify-content:flex-end;margin-bottom:.75rem"><button class="primary sm" onclick="openUM()">+ Gebruiker</button></div>`;
  h+=`<div class="card">`;
  if(!profielen.length) h+=`<div class="empty">Geen gebruikers.</div>`;
  profielen.forEach(u=>{
    const reg=regios.find(r=>r.id===u.regio_id);
    const isRA=u.rol==='regio_admin';
    const uAR=adminRegioMap[u.id]||[];
    const rNames=uAR.map(rid=>regios.find(r=>r.id===rid)?.naam).filter(Boolean);
    const rolLabel=u.rol==='admin'?'Super admin':u.rol==='regio_admin'?'Regio admin':'Gebruiker';
    const rolBadge=u.rol==='admin'?'b-admin':u.rol==='regio_admin'?'b-behandeling':'b-user';
    h+=`<div style="padding:12px 16px;border-bottom:0.5px solid var(--border)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${isRA?'10px':'0'}">
        <div>
          <div class="row-main">${u.naam||u.email}</div>
          <div class="row-sub">${u.email} · ${reg?reg.naam:'Geen regio'}${isRA&&rNames.length?' · Beheert: '+rNames.join(', '):''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="badge ${rolBadge}">${rolLabel}</span>
          <button class="sm" onclick="openEditU(this)" data-id="${u.id}" data-naam="${esc(u.naam||u.email)}" data-email="${esc(u.email)}" data-rol="${u.rol}" data-regio="${u.regio_id||''}">✏️</button>
        </div>
      </div>
      ${isRA?`<div style="background:var(--bg);border-radius:var(--rs);padding:10px 12px">
        <div style="font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Regio toegang</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          ${regios.map(r=>{const has=uAR.includes(r.id);return `<button class="sm${has?' primary':''}" onclick="toggleAdminRegio(&quot;${u.id}&quot;,${r.id},${has})">${r.naam}</button>`;}).join('')}
        </div>
      </div>`:''}
    </div>`;
  });
  h+=`</div>`;
  return h;
}

function renderRegios(){
  let h=`<div style="display:flex;justify-content:flex-end;margin-bottom:.75rem"><button class="primary sm" onclick="openRM()">+ Regio</button></div>`;
  h+=`<div class="card">`;
  if(!regios.length) h+=`<div class="empty">Geen regio's.</div>`;
  regios.forEach(r=>{
    const leden=profielen.filter(u=>u.regio_id===r.id);
    h+=`<div class="card-row"><div><div class="row-main">${r.naam}</div><div class="row-sub">${leden.map(u=>u.naam||u.email).join(', ')||'Geen leden'}</div></div>
    <div class="row-right"><button class="sm" onclick="openRM(this)" data-id="${r.id}" data-naam="${esc(r.naam)}">✏️</button><button class="sm danger" onclick="delRg(${r.id})">🗑</button></div></div>`;
  });
  h+=`</div>`;
  return h;
}

function renderTargets(){
  let h=`<div style="display:flex;justify-content:flex-end;margin-bottom:.75rem"><button class="primary sm" onclick="openTM()">+ Target</button></div>`;
  
  if(regios.length){
    regios.forEach(r=>{
      const rt=targets.filter(t=>t.type==='regio'&&t.regio_id===r.id);
      const ru=profielen.filter(u=>u.regio_id===r.id&&u.rol==='gebruiker');
      if(!rt.length&&!ru.length) return;
      h+=`<div class="section-label">${r.naam}</div><div class="card">`;
      if(rt.length) rt.forEach(t=>h+=targetRow(t,'regio',r.naam));
      else h+=`<div style="padding:10px 16px;font-size:12px;color:var(--text2)">Geen regio-target · <button class="sm primary" onclick="openTMregio(${r.id})">+ Toevoegen</button></div>`;
      ru.forEach(u=>{
        // Only show most recent target per user per periode
        const ut=targets.filter(t=>t.type==='persoon'&&t.user_id===u.id).sort((a,b)=>b.periode.localeCompare(a.periode));
        if(ut.length) ut.slice(0,1).forEach(t=>h+=targetRow(t,'persoon',u.naam||u.email));
        else h+=`<div style="padding:8px 16px;font-size:12px;color:var(--text2)">↳ ${u.naam||u.email}: geen target</div>`;
      });
      h+=`</div>`;
    });
  }
  if(!regios.length&&!targets.length) h+=`<div class="empty">Geen targets.</div>`;
  return h;
}

function targetRow(t,type,naam){
  return `<div class="card-row"><div><div class="row-main" style="display:flex;align-items:center;gap:8px"><span class="badge ${type==='regio'?'b-behandeling':'b-user'}">${type}</span>${naam} — ${t.periode}</div><div class="row-sub">€${Number(t.omzet_target).toLocaleString('nl-NL')}</div></div><div class="row-right"><button class="sm danger" onclick="delTg(${t.id})">🗑</button></div></div>`;
}

async function delTg(id){if(!confirm('Verwijderen?'))return;try{await api('DELETE','/rest/v1/targets?id=eq.'+id);targets=targets.filter(t=>t.id!==id);render();toast('Verwijderd.');}catch(e){toast('Fout: '+e.message,'err');}}

// ── GEBRUIKER ──
function openUM(){
  document.getElementById('um-id').value='';
  document.getElementById('um-n').value='';
  document.getElementById('um-e').value='';
  document.getElementById('um-p').value='';
  document.getElementById('um-rol').value='gebruiker';
  document.getElementById('um-r').innerHTML='<option value="">— Geen —</option>'+regios.map(r=>`<option value="${r.id}">${r.naam}</option>`).join('');
  document.getElementById('um-mt').textContent='Nieuwe gebruiker';
  document.getElementById('um-p-wrap').style.display='block';
  document.getElementById('ov-um').classList.add('open');
}

async function saveUser(){
  const id=document.getElementById('um-id').value;
  const n=document.getElementById('um-n').value.trim();
  const e=document.getElementById('um-e').value.trim();
  const p=document.getElementById('um-p').value;
  const rol=document.getElementById('um-rol').value;
  const rid=document.getElementById('um-r').value;
  const btn=document.getElementById('btn-um-s');btn.disabled=true;btn.innerHTML='<span class="ld"></span>';
  try{
    if(id){
      await api('PATCH','/rest/v1/profielen?id=eq.'+id,{naam:n,rol,regio_id:rid?parseInt(rid):null});
      if(p&&p.length>=6) await aApi('PUT','/auth/v1/admin/users/'+id,{password:p},true);
      const u=profielen.find(x=>x.id===id);if(u){u.naam=n;u.rol=rol;u.regio_id=rid?parseInt(rid):null;}
    } else {
      if(!n||!e||!p){toast('Vul naam, e-mail en wachtwoord in.');btn.disabled=false;btn.innerHTML='Opslaan';return;}
      if(p.length<6){toast('Wachtwoord minimaal 6 tekens.');btn.disabled=false;btn.innerHTML='Opslaan';return;}
      const res=await aApi('POST','/auth/v1/admin/users',{email:e,password:p,email_confirm:true,user_metadata:{naam:n}},true);
      await api('POST','/rest/v1/profielen',{id:res.id,email:e,naam:n,rol,regio_id:rid?parseInt(rid):null},true);
      profielen.push({id:res.id,email:e,naam:n,rol,regio_id:rid?parseInt(rid):null});
    }
    document.getElementById('ov-um').classList.remove('open');
    activeTab='gebruikers';render();toast('Opgeslagen.','ok');
  }catch(ex){toast('Fout: '+ex.message,'err');}finally{btn.disabled=false;btn.innerHTML='Opslaan';}
}

// ── REGIO ──
function openRM(btn){
  const id=btn?btn.dataset.id:null;
  const naam=btn?btn.dataset.naam:'';
  editRegioId=id?parseInt(id):null;
  document.getElementById('rg-n').value=naam||'';
  document.getElementById('ov-rg').classList.add('open');
}

async function saveRegio(){
  const n=document.getElementById('rg-n').value.trim();
  if(!n){toast('Naam verplicht.');return;}
  const btn=document.getElementById('btn-rg-s');btn.disabled=true;btn.innerHTML='<span class="ld"></span>';
  try{
    if(editRegioId){
      await api('PATCH','/rest/v1/regios?id=eq.'+editRegioId,{naam:n});
      const r=regios.find(x=>x.id===editRegioId);if(r)r.naam=n;
    } else {
      const res=await api('POST','/rest/v1/regios',{naam:n});
      if(res&&res[0])regios.push(res[0]);
    }
    document.getElementById('ov-rg').classList.remove('open');
    activeTab='regios';render();toast('Opgeslagen.','ok');
  }catch(e){toast('Fout: '+e.message,'err');}finally{btn.disabled=false;btn.innerHTML='Opslaan';}
}

async function delRg(id){
  if(!confirm('Regio verwijderen?'))return;
  try{
    await api('DELETE','/rest/v1/regios?id=eq.'+id);
    regios=regios.filter(r=>r.id!==id);
    render();toast('Verwijderd.');
  }catch(e){toast('Fout: '+e.message,'err');}
}

// ── TARGET ──
function openTM(){
  document.getElementById('tg-tp').value='regio';
  document.getElementById('tg-rw').style.display='block';
  document.getElementById('tg-uw').style.display='none';
  document.getElementById('tg-r').innerHTML=regios.map(r=>`<option value="${r.id}">${r.naam}</option>`).join('');
  document.getElementById('tg-u').innerHTML=profielen.map(u=>`<option value="${u.id}">${u.naam||u.email}</option>`).join('');
  document.getElementById('tg-p').value=nowM();
  document.getElementById('tg-o').value='';
  document.getElementById('ov-tg').classList.add('open');
}

async function saveTarget(){
  const tp=document.getElementById('tg-tp').value;
  const per=document.getElementById('tg-p').value;
  const omz=parseFloat(document.getElementById('tg-o').value);
  if(!per||isNaN(omz)){toast('Vul periode en target in.');return;}
  const b={type:tp,periode:per,omzet_target:omz};
  if(tp==='regio') b.regio_id=parseInt(document.getElementById('tg-r').value);
  else b.user_id=document.getElementById('tg-u').value;
  const btn=document.getElementById('btn-tg-s');btn.disabled=true;btn.innerHTML='<span class="ld"></span>';
  try{
    const res=await api('POST','/rest/v1/targets',b);
    if(res&&res[0])targets.unshift(res[0]);
    document.getElementById('ov-tg').classList.remove('open');
    activeTab='targets';render();toast('Opgeslagen.','ok');
  }catch(e){toast('Fout: '+e.message,'err');}finally{btn.disabled=false;btn.innerHTML='Opslaan';}
}

async function delTg(id){
  if(!confirm('Target verwijderen?'))return;
  try{
    await api('DELETE','/rest/v1/targets?id=eq.'+id);
    targets=targets.filter(t=>t.id!==id);
    render();toast('Verwijderd.');
  }catch(e){toast('Fout: '+e.message,'err');}
}

function openEditU(btn){
  const id=btn.dataset.id,naam=btn.dataset.naam,email=btn.dataset.email,rol=btn.dataset.rol,regioId=btn.dataset.regio;
  document.getElementById('um-id').value=id;
  document.getElementById('um-n').value=naam;
  document.getElementById('um-e').value=email;
  document.getElementById('um-p').value='';
  document.getElementById('um-rol').value=rol;
  document.getElementById('um-r').innerHTML='<option value="">— Geen —</option>'+regios.map(r=>`<option value="${r.id}"${r.id==regioId?' selected':''}>${r.naam}</option>`).join('');
  document.getElementById('um-mt').textContent='Gebruiker bewerken';
  document.getElementById('um-p-wrap').style.display='none';
  document.getElementById('ov-um').classList.add('open');
}

init();


function startTour(){
  toast('Ga naar de Home pagina voor de rondleiding 🗺️','ok');
}
