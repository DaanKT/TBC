<script>

const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdHBvYnF2b2RsamhwanpnbmtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MzEyODAsImV4cCI6MjA5NjEwNzI4MH0.zMy3hmD02DSCkVfAOh2URDqXm_WBFCYe8CgNkvWT_yI';

function getSession(){try{return JSON.parse(localStorage.getItem('tbc_session'));}catch(e){return null;}}
function getMe(){try{return JSON.parse(localStorage.getItem('tbc_me'));}catch(e){return null;}}
function setMe(p){localStorage.setItem('tbc_me',JSON.stringify(p));}
function logout(){localStorage.removeItem('tbc_session');localStorage.removeItem('tbc_me');location.href='login.html';}
function hdr(svc=false){const s=getSession();const t=svc?SK:(s?s.access_token:'');return{'apikey':AK,'Authorization':'Bearer '+t,'Content-Type':'application/json','Prefer':'return=representation'};}
async function api(m,p,b,svc=false){const r=await fetch(SB+p,{method:m,headers:hdr(svc),body:b?JSON.stringify(b):undefined});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null;}
async function aApi(m,p,b,svc=false){const s=getSession();const tk=svc?SK:(s?s.access_token:'');const r=await fetch(SB+p,{method:m,headers:{'apikey':AK,'Authorization':'Bearer '+tk,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null;}
function v(id){return(document.getElementById(id)?.value||'').trim();}
function eur(n){return'€'+Number(n||0).toLocaleString('nl-NL',{minimumFractionDigits:0,maximumFractionDigits:0});}
function fdt(d){return new Date(d).toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'});}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0;}
function nowM(){return new Date().toISOString().slice(0,7);}
function nowD(){return new Date().toISOString().slice(0,10);}
function toast(msg,tp=''){const el=document.createElement('div');el.className='toast'+(tp?' '+tp:'');el.textContent=msg;let tw=document.getElementById('tw');if(!tw){tw=document.createElement('div');tw.id='tw';tw.className='tw';document.body.appendChild(tw);}tw.appendChild(el);setTimeout(()=>el.remove(),3500);}
function esc(s){return String(s).split("'").join("&apos;");}
async function refreshSession(){
  const s=getSession();
  if(!s||!s.refresh_token) return null;
  try{
    const res=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',
      headers:{'apikey':AK,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:s.refresh_token})
    });
    if(!res.ok) return null;
    const data=await res.json();
    if(data.access_token){
      localStorage.setItem('tbc_session',JSON.stringify(data));
      return data;
    }
  }catch(e){}
  return null;
}

async function checkAuth(){
  let s=getSession();
  if(!s||!s.access_token){localStorage.clear();location.replace('login.html');return null;}
  
  // Check if token is expired or about to expire (within 10 min)
  try{
    const payload=JSON.parse(atob(s.access_token.split('.')[1]));
    const expiresIn=(payload.exp*1000)-Date.now();
    if(expiresIn<600000){ // less than 10 minutes
      const newSession=await refreshSession();
      if(newSession) s=newSession;
      else if(expiresIn<0){localStorage.clear();location.replace('login.html');return null;}
    }
  }catch(e){}

  const me=getMe();
  if(me&&me.id)return me;
  try{
    const p=await api('GET','/rest/v1/profielen?id=eq.'+s.user.id);
    if(!p||!p.length)throw new Error('no profile');
    setMe(p[0]);return p[0];
  }catch(e){
    // Try refresh before giving up
    const newSession=await refreshSession();
    if(newSession){
      try{
        const p2=await api('GET','/rest/v1/profielen?id=eq.'+s.user.id);
        if(p2&&p2.length){setMe(p2[0]);return p2[0];}
      }catch(e2){}
    }
    localStorage.clear();location.replace('login.html');return null;
  }
}
function isAdmin(me){return me&&me.rol==='admin';}
function isRegioAdmin(me){return me&&(me.rol==='admin'||me.rol==='regio_admin');}
function isSuperAdmin(me){return me&&me.rol==='admin';}


let me=null, profielen=[], regios=[], targets=[];
let editRegioId=null, resetUID=null;

let adminRegioMap={};

async function init(){
  me=await checkAuth(); if(!me)return;
  document.getElementById('topbar-user').textContent=(me.naam||me.email)+(isAdmin(me)?' (Admin)':'');
  if(isAdmin(me)){
    regios=await api('GET','/rest/v1/regios?order=naam.asc')||[];
    targets=await api('GET','/rest/v1/targets?order=periode.desc')||[];
    profielen=await api('GET','/rest/v1/profielen')||[];
    await loadAdminRegios();
  }
  render();
}

async function loadAdminRegios(){
  const ar=await api('GET','/rest/v1/admin_regios')||[];
  adminRegioMap={};
  ar.forEach(x=>{
    if(!adminRegioMap[x.user_id]) adminRegioMap[x.user_id]=[];
    adminRegioMap[x.user_id].push(x.regio_id);
  });
}

async function toggleAdminRegio(userId, regioId, hasIt){
  try{
    if(hasIt){
      await api('DELETE',`/rest/v1/admin_regios?user_id=eq.${userId}&regio_id=eq.${regioId}`);
      if(adminRegioMap[userId]) adminRegioMap[userId]=adminRegioMap[userId].filter(r=>r!==regioId);
    } else {
      await api('POST','/rest/v1/admin_regios',{user_id:userId,regio_id:regioId});
      if(!adminRegioMap[userId]) adminRegioMap[userId]=[];
      adminRegioMap[userId].push(regioId);
    }
    activeTab='gebruikers';render();
    toast(hasIt?'Regio ontkoppeld.':'Regio gekoppeld.','ok');
  }catch(e){toast('Fout: '+e.message,'err');}
}

let activeTab='kpi';
function render(){
  const isA=isAdmin(me);
  let h=`<div class="page-header"><div><div class="page-title">Meer</div></div></div>`;
  const tabs=isA?[['kpi',"KPI's"],['offertes','Offertes'],['gebruikers','Gebruikers'],['regios',"Regio's"],['targets','Targets']]:[[' kpi',"KPI's"],['offertes','Offertes']];
  h+=`<div class="tag-row">`;
  (isA?[['kpi',"📈 KPI's"],['offertes','📋 Offertes'],['links','🔗 Links'],['gebruikers','👥 Gebruikers'],['regios',"🗺️ Regio's"],['targets','🏆 Targets'],['instellingen','⚙️ Instellingen']]:[[' kpi',"📈 KPI's"],['offertes','📋 Offertes'],['links','🔗 Links']]).forEach(([t,l])=>{
    h+=`<span class="tag ${activeTab===t.trim()?'active':''}" onclick="activeTab='${t.trim()}';render()">${l}</span>`;
  });
  h+=`</div>`;
  if(activeTab==='kpi') h+=renderKPI(isA);
  else if(activeTab==='offertes') h+=renderOffertes();
  else if(activeTab==='links') h+=renderLinks();
  else if(activeTab==='gebruikers') h+=renderGebruikers();
  else if(activeTab==='regios') h+=renderRegios();
  else if(activeTab==='targets') h+=renderTargets();
  else if(activeTab==='instellingen') h+=renderInstellingen();
  document.getElementById('content').innerHTML=h;
}

function renderLinks(){
  return `<div style="padding:.5rem 0">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-size:14px;font-weight:700">Snelle links</div>
      <button onclick="location.href='links.html'" style="background:var(--teal);color:var(--navy);border:none;border-radius:var(--rs);padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer">Alles bekijken →</button>
    </div>
    <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:var(--r);padding:12px 14px;font-size:13px;color:#1e40af;margin-bottom:12px">
      🔗 Alle interne links en tools staan op de <strong>Links pagina</strong>. Klik op "Alles bekijken" om ze te zien en als admin toe te voegen.
    </div>
  </div>`;
}

function renderInstellingen(){
  let h=`<div style="padding:.5rem 0">`;
  h+=`<div class="section-label">App instellingen</div>`;
  h+=`<div class="card">`;
  h+=`<div class="card-row click" onclick="startTour()"><div><div class="row-main">🗺️ App rondleiding</div><div class="row-sub">Bekijk de rondleiding opnieuw</div></div><span>›</span></div>`;
  h+=`<div class="card-row click" onclick="clearCache()"><div><div class="row-main">🗑️ Cache wissen</div><div class="row-sub">Herlaad alle data</div></div><span>›</span></div>`;
  h+=`<div class="card-row"><div><div class="row-main">📱 Push meldingen</div><div class="row-sub">${'Notification' in window && Notification.permission === 'granted' ? '✅ Ingeschakeld' : '❌ Niet ingeschakeld'}</div></div></div>`;
  h+=`</div>`;

  if(isSuperAdmin(me)){
    h+=`<div class="section-label">Admin — Per gebruiker</div>`;
    h+=`<div class="card">`;
    profielen.filter(u=>u.rol==='gebruiker').forEach(u=>{
      h+=`<div class="card-row click" onclick="openUserSettings('${u.id}','${esc(u.naam||u.email)}')">
        <div><div class="row-main">${u.naam||u.email}</div><div class="row-sub">Instellingen bekijken en aanpassen</div></div>
        <span>›</span>
      </div>`;
    });
    h+=`</div>`;

    h+=`<div class="section-label">Gevaarlijke zone</div>`;
    h+=`<div class="card">`;
    h+=`<div class="card-row"><div style="font-size:13px;color:#6b7280">Push cron jobs, VAPID keys en server instellingen beheer je via Supabase dashboard.</div></div>`;
    h+=`</div>`;
  }

  h+=`</div>`;
  return h;
}

function clearCache(){
  localStorage.removeItem('tbc_me');
  location.reload();
}

function openUserSettings(uid, naam){
  toast('Gebruikersinstellingen voor '+naam+' — binnenkort beschikbaar.','ok');
}

function renderKPI(isA){
  const m=nowM();
  const myReg=regios.find(r=>r.id===me.regio_id);
  let h=`<div class="section-label">Mijn prestaties — ${m}</div>`;
  // will be loaded async via fetch if needed — show placeholder
  h+=`<div class="alert info">KPI-data wordt geladen via de andere pagina's. Zie Dashboard voor je actuele cijfers.</div>`;
  if(isA && regios.length){
    h+=`<div class="section-label">Targets per regio</div><div class="card">`;
    regios.forEach(r=>{
      const rt=targets.filter(t=>t.type==='regio'&&t.regio_id===r.id).slice(0,3);
      h+=`<div class="card-row"><div><div class="row-main">${r.naam}</div><div class="row-sub">${rt.length?rt.map(t=>t.periode+': €'+Number(t.omzet_target).toLocaleString('nl-NL')).join(' · '):'Geen targets'}</div></div></div>`;
    });
    h+=`</div>`;
  }
  return h;
}

function renderGebruikers(){
  let h=`<div style="display:flex;justify-content:flex-end;margin-bottom:.75rem"><button class="teal sm" onclick="openUM()">+ Gebruiker</button></div>`;
  h+=`<div class="card">`;
  if(!profielen.length) h+=`<div class="empty">Geen gebruikers.</div>`;
  profielen.forEach(u=>{
    const reg=regios.find(r=>r.id===u.regio_id);
    const isRA=u.rol==='regio_admin';
    const uAR=adminRegioMap[u.id]||[];
    const rNames=uAR.map(rid=>regios.find(r=>r.id===rid)?.naam).filter(Boolean);
    const rolLabel=u.rol==='admin'?'Super admin':u.rol==='regio_admin'?'Regio admin':'Gebruiker';
    const rolBadge=u.rol==='admin'?'b-admin':u.rol==='regio_admin'?'b-behandeling':'b-user';
    h+=`<div style="padding:12px 16px;border-bottom:0.5px solid var(--border)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${isRA?'10px':'0'}">
        <div>
          <div class="row-main">${u.naam||u.email}</div>
          <div class="row-sub">${u.email} · ${reg?reg.naam:'Geen regio'}${isRA&&rNames.length?' · Beheert: '+rNames.join(', '):''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="badge ${rolBadge}">${rolLabel}</span>
          <button class="sm" onclick="openEditU(this)" data-id="${u.id}" data-naam="${esc(u.naam||u.email)}" data-email="${esc(u.email)}" data-rol="${u.rol}" data-regio="${u.regio_id||''}">✏️</button>
        </div>
      </div>
      ${isRA?`<div style="background:var(--bg);border-radius:var(--rs);padding:10px 12px">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Regio toegang</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          ${regios.map(r=>{const has=uAR.includes(r.id);return `<button class="sm${has?' teal':''}" onclick="toggleAdminRegio(&quot;${u.id}&quot;,${r.id},${has})">${r.naam}</button>`;}).join('')}
        </div>
      </div>`:''}
    </div>`;
  });
  h+=`</div>`;
  return h;
}

function renderRegios(){
  let h=`<div style="display:flex;justify-content:flex-end;margin-bottom:.75rem"><button class="teal sm" onclick="openRM()">+ Regio</button></div>`;
  h+=`<div class="card">`;
  if(!regios.length) h+=`<div class="empty">Geen regio's.</div>`;
  regios.forEach(r=>{
    const leden=profielen.filter(u=>u.regio_id===r.id);
    h+=`<div class="card-row"><div><div class="row-main">${r.naam}</div><div class="row-sub">${leden.map(u=>u.naam||u.email).join(', ')||'Geen leden'}</div></div>
    <div class="row-right"><button class="sm" onclick="openRM(this)" data-id="${r.id}" data-naam="${esc(r.naam)}">✏️</button><button class="sm danger" onclick="delRg(${r.id})">🗑</button></div></div>`;
  });
  h+=`</div>`;
  return h;
}

function renderTargets(){
  let h=`<div style="display:flex;justify-content:flex-end;margin-bottom:.75rem"><button class="teal sm" onclick="openTM()">+ Target</button></div>`;
  
  if(regios.length){
    regios.forEach(r=>{
      const rt=targets.filter(t=>t.type==='regio'&&t.regio_id===r.id);
      const ru=profielen.filter(u=>u.regio_id===r.id&&u.rol==='gebruiker');
      if(!rt.length&&!ru.length) return;
      h+=`<div class="section-label">${r.naam}</div><div class="card">`;
      if(rt.length) rt.forEach(t=>h+=targetRow(t,'regio',r.naam));
      else h+=`<div style="padding:10px 16px;font-size:12px;color:var(--muted)">Geen regio-target · <button class="sm teal" onclick="openTMregio(${r.id})">+ Toevoegen</button></div>`;
      ru.forEach(u=>{
        // Only show most recent target per user per periode
        const ut=targets.filter(t=>t.type==='persoon'&&t.user_id===u.id).sort((a,b)=>b.periode.localeCompare(a.periode));
        if(ut.length) ut.slice(0,1).forEach(t=>h+=targetRow(t,'persoon',u.naam||u.email));
        else h+=`<div style="padding:8px 16px;font-size:12px;color:var(--muted)">↳ ${u.naam||u.email}: geen target</div>`;
      });
      h+=`</div>`;
    });
  }
  if(!regios.length&&!targets.length) h+=`<div class="empty">Geen targets.</div>`;
  return h;
}

function openTMregio(regioId){
  document.getElementById('tg-tp').value='regio';
  document.getElementById('tg-rw').style.display='block';
  document.getElementById('tg-uw').style.display='none';
  document.getElementById('tg-r').innerHTML=regios.map(r=>`<option value="${r.id}"${r.id===regioId?' selected':''}>${r.naam}</option>`).join('');
  document.getElementById('tg-p').value=nowM();
  document.getElementById('tg-o').value='';
  document.getElementById('ov-tg').classList.add('open');
}

function targetRow(t,type,naam){
  return `<div class="card-row"><div><div class="row-main" style="display:flex;align-items:center;gap:8px"><span class="badge ${type==='regio'?'b-behandeling':'b-user'}">${type}</span>${naam} — ${t.periode}</div><div class="row-sub">€${Number(t.omzet_target).toLocaleString('nl-NL')}</div></div><div class="row-right"><button class="sm danger" onclick="delTg(${t.id})">🗑</button></div></div>`;
}

async function delTg(id){if(!confirm('Verwijderen?'))return;try{await api('DELETE','/rest/v1/targets?id=eq.'+id);targets=targets.filter(t=>t.id!==id);render();toast('Verwijderd.');}catch(e){toast('Fout: '+e.message,'err');}}

// ── GEBRUIKER ──
function openUM(){
  document.getElementById('um-id').value='';
  document.getElementById('um-n').value='';
  document.getElementById('um-e').value='';
  document.getElementById('um-p').value='';
  document.getElementById('um-rol').value='gebruiker';
  document.getElementById('um-r').innerHTML='<option value="">— Geen —</option>'+regios.map(r=>`<option value="${r.id}">${r.naam}</option>`).join('');
  document.getElementById('um-mt').textContent='Nieuwe gebruiker';
  document.getElementById('um-p-wrap').style.display='block';
  document.getElementById('ov-um').classList.add('open');
}

async function saveUser(){
  const id=document.getElementById('um-id').value;
  const n=document.getElementById('um-n').value.trim();
  const e=document.getElementById('um-e').value.trim();
  const p=document.getElementById('um-p').value;
  const rol=document.getElementById('um-rol').value;
  const rid=document.getElementById('um-r').value;
  const btn=document.getElementById('btn-um-s');btn.disabled=true;btn.innerHTML='<span class="ld"></span>';
  try{
    if(id){
      await api('PATCH','/rest/v1/profielen?id=eq.'+id,{naam:n,rol,regio_id:rid?parseInt(rid):null});
      if(p&&p.length>=6) await aApi('PUT','/auth/v1/admin/users/'+id,{password:p},true);
      const u=profielen.find(x=>x.id===id);if(u){u.naam=n;u.rol=rol;u.regio_id=rid?parseInt(rid):null;}
    } else {
      if(!n||!e||!p){toast('Vul naam, e-mail en wachtwoord in.');btn.disabled=false;btn.innerHTML='Opslaan';return;}
      if(p.length<6){toast('Wachtwoord minimaal 6 tekens.');btn.disabled=false;btn.innerHTML='Opslaan';return;}
      const res=await aApi('POST','/auth/v1/admin/users',{email:e,password:p,email_confirm:true,user_metadata:{naam:n}},true);
      await api('POST','/rest/v1/profielen',{id:res.id,email:e,naam:n,rol,regio_id:rid?parseInt(rid):null},true);
      profielen.push({id:res.id,email:e,naam:n,rol,regio_id:rid?parseInt(rid):null});
    }
    document.getElementById('ov-um').classList.remove('open');
    activeTab='gebruikers';render();toast('Opgeslagen.','ok');
  }catch(ex){toast('Fout: '+ex.message,'err');}finally{btn.disabled=false;btn.innerHTML='Opslaan';}
}

// ── REGIO ──
function openRM(btn){
  const id=btn?btn.dataset.id:null;
  const naam=btn?btn.dataset.naam:'';
  editRegioId=id?parseInt(id):null;
  document.getElementById('rg-n').value=naam||'';
  document.getElementById('ov-rg').classList.add('open');
}

async function saveRegio(){
  const n=document.getElementById('rg-n').value.trim();
  if(!n){toast('Naam verplicht.');return;}
  const btn=document.getElementById('btn-rg-s');btn.disabled=true;btn.innerHTML='<span class="ld"></span>';
  try{
    if(editRegioId){
      await api('PATCH','/rest/v1/regios?id=eq.'+editRegioId,{naam:n});
      const r=regios.find(x=>x.id===editRegioId);if(r)r.naam=n;
    } else {
      const res=await api('POST','/rest/v1/regios',{naam:n});
      if(res&&res[0])regios.push(res[0]);
    }
    document.getElementById('ov-rg').classList.remove('open');
    activeTab='regios';render();toast('Opgeslagen.','ok');
  }catch(e){toast('Fout: '+e.message,'err');}finally{btn.disabled=false;btn.innerHTML='Opslaan';}
}

async function delRg(id){
  if(!confirm('Regio verwijderen?'))return;
  try{
    await api('DELETE','/rest/v1/regios?id=eq.'+id);
    regios=regios.filter(r=>r.id!==id);
    render();toast('Verwijderd.');
  }catch(e){toast('Fout: '+e.message,'err');}
}

// ── TARGET ──
function openTM(){
  document.getElementById('tg-tp').value='regio';
  document.getElementById('tg-rw').style.display='block';
  document.getElementById('tg-uw').style.display='none';
  document.getElementById('tg-r').innerHTML=regios.map(r=>`<option value="${r.id}">${r.naam}</option>`).join('');
  document.getElementById('tg-u').innerHTML=profielen.map(u=>`<option value="${u.id}">${u.naam||u.email}</option>`).join('');
  document.getElementById('tg-p').value=nowM();
  document.getElementById('tg-o').value='';
  document.getElementById('ov-tg').classList.add('open');
}

async function saveTarget(){
  const tp=document.getElementById('tg-tp').value;
  const per=document.getElementById('tg-p').value;
  const omz=parseFloat(document.getElementById('tg-o').value);
  if(!per||isNaN(omz)){toast('Vul periode en target in.');return;}
  const b={type:tp,periode:per,omzet_target:omz};
  if(tp==='regio') b.regio_id=parseInt(document.getElementById('tg-r').value);
  else b.user_id=document.getElementById('tg-u').value;
  const btn=document.getElementById('btn-tg-s');btn.disabled=true;btn.innerHTML='<span class="ld"></span>';
  try{
    const res=await api('POST','/rest/v1/targets',b);
    if(res&&res[0])targets.unshift(res[0]);
    document.getElementById('ov-tg').classList.remove('open');
    activeTab='targets';render();toast('Opgeslagen.','ok');
  }catch(e){toast('Fout: '+e.message,'err');}finally{btn.disabled=false;btn.innerHTML='Opslaan';}
}

async function delTg(id){
  if(!confirm('Target verwijderen?'))return;
  try{
    await api('DELETE','/rest/v1/targets?id=eq.'+id);
    targets=targets.filter(t=>t.id!==id);
    render();toast('Verwijderd.');
  }catch(e){toast('Fout: '+e.message,'err');}
}

function openEditU(btn){
  const id=btn.dataset.id,naam=btn.dataset.naam,email=btn.dataset.email,rol=btn.dataset.rol,regioId=btn.dataset.regio;
  document.getElementById('um-id').value=id;
  document.getElementById('um-n').value=naam;
  document.getElementById('um-e').value=email;
  document.getElementById('um-p').value='';
  document.getElementById('um-rol').value=rol;
  document.getElementById('um-r').innerHTML='<option value="">— Geen —</option>'+regios.map(r=>`<option value="${r.id}"${r.id==regioId?' selected':''}>${r.naam}</option>`).join('');
  document.getElementById('um-mt').textContent='Gebruiker bewerken';
  document.getElementById('um-p-wrap').style.display='none';
  document.getElementById('ov-um').classList.add('open');
}

init();


function startTour(){
  toast('Ga naar de Home pagina voor de rondleiding 🗺️','ok');
}
function esc(s){return String(s).split("'").join("&apos;");}
</script>
