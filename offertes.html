<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Offertes — TBC</title>
<link rel="apple-touch-icon" href="icon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="manifest" href="manifest.json"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c14;--surface:#0e1420;--surface2:#141926;--surface3:#1a2133;--surface4:#212840;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);--border3:rgba(255,255,255,.22);
  --text:#e8ecf4;--text2:#8a97b0;--text3:#4a5568;
  --teal:#00d4a0;--teal2:#00b389;--teal3:rgba(0,212,160,.09);
  --gold:#f5a623;--gold2:rgba(245,166,35,.09);
  --red:#ff4757;--red2:rgba(255,71,87,.09);
  --green:#2ed573;--green2:rgba(46,213,115,.09);
  --blue:#4d9fff;--blue2:rgba(77,159,255,.09);
  --purple:#a855f7;--purple2:rgba(168,85,247,.09);
  --r:14px;--rs:10px;
}
body{font-family:'DM Sans',sans-serif;background:var(--surface2);color:var(--text);min-height:100vh;padding-bottom:72px}
.topbar{background:rgba(8,12,20,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:0 1rem;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;border-bottom:1px solid var(--border)}
.topbar-logo{font-size:13px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.06em}
.topbar-logo span{color:var(--teal)}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-user{font-size:12px;color:var(--text3)}
.btn-lo{font-family:'DM Sans',sans-serif;font-size:12px;background:none;border:1px solid var(--border2);color:var(--text3);padding:4px 10px;border-radius:var(--rs);cursor:pointer;transition:color .15s}
.btn-lo:hover{color:var(--text)}
.btn-sm-teal{font-family:'DM Sans',sans-serif;font-size:12px;background:var(--teal3);border:1px solid rgba(0,212,160,.2);color:var(--teal);padding:4px 10px;border-radius:var(--rs);cursor:pointer;font-weight:600}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(8,12,20,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:40;height:60px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 4px}
.bottom-nav::-webkit-scrollbar{display:none}
.bn-item{min-width:60px;flex:1;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;font-weight:600;color:var(--text3);cursor:pointer;border:none;background:none;text-transform:uppercase;letter-spacing:.02em;transition:color .15s}
.bn-item.active{color:var(--teal)}
.bn-item .ic{font-size:19px;line-height:1}
.bn-dot{width:4px;height:4px;border-radius:50%;background:var(--teal);opacity:0;margin-top:1px}
.bn-item.active .bn-dot{opacity:1}
.content{padding:1rem;max-width:760px;margin:0 auto}
button{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border-radius:var(--rs);border:1px solid var(--border2);background:var(--surface2);color:var(--text);padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .12s}
button:hover{border-color:var(--border3);background:var(--surface3)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--teal);color:#000;border-color:var(--teal);font-weight:700}
button.primary:hover{background:var(--teal2)}
button.amber{background:var(--gold2);color:var(--gold);border-color:rgba(245,166,35,.25)}
button.danger{color:var(--red);border-color:rgba(255,71,87,.25);background:var(--red2)}
button.sm{font-size:11px;padding:5px 10px}
button.full{width:100%;justify-content:center}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:.875rem}
.card-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.card-row:last-child{border-bottom:none}
.card-row.click{cursor:pointer;transition:background .1s}
.card-row.click:hover{background:var(--surface2)}
.card-row.act{background:var(--teal3);border-left:2px solid var(--teal);padding-left:12px}
.row-main{font-size:14px;font-weight:600;color:var(--text)}
.row-sub{font-size:12px;color:var(--text2);margin-top:2px}
.row-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.sv{font-size:22px;font-weight:800;line-height:1;letter-spacing:-.02em}
.sl{font-size:10px;color:var(--text3);margin-top:5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.ss{font-size:12px;color:var(--text2);margin-top:3px}
.ct{color:var(--teal)}.cr{color:var(--red)}.ca{color:var(--gold)}.cg{color:var(--green)}.cb{color:var(--blue)}.cp{color:var(--purple)}
.pb{height:4px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-top:6px}
.pf{height:100%;border-radius:99px;background:var(--teal);transition:width .5s}
.pf.am{background:var(--gold)}.pf.re{background:var(--red)}
.section-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:1.25rem 0 .6rem;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.badge{font-size:10px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid;white-space:nowrap}
.b-verstuurd{background:var(--blue2);color:var(--blue);border-color:rgba(77,159,255,.2)}
.b-follow_up{background:var(--gold2);color:var(--gold);border-color:rgba(245,166,35,.2)}
.b-gewonnen{background:var(--green2);color:var(--green);border-color:rgba(46,213,115,.2)}
.b-verloren{background:var(--red2);color:var(--red);border-color:rgba(255,71,87,.2)}
.b-hoog{background:var(--red2);color:var(--red);border-color:rgba(255,71,87,.2)}
.b-open{background:var(--gold2);color:var(--gold);border-color:rgba(245,166,35,.2)}
.b-admin{background:var(--teal3);color:var(--teal);border-color:rgba(0,212,160,.2)}
.b-gehaald{background:var(--green2);color:var(--green);border-color:rgba(46,213,115,.2)}
.b-gemist{background:var(--red2);color:var(--red);border-color:rgba(255,71,87,.2)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:20px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;border:1px solid var(--border2);border-bottom:none}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:99px;margin:0 auto 16px}
.mt{font-size:16px;font-weight:700;margin-bottom:4px;color:var(--text)}
.ms{font-size:13px;color:var(--text2);margin-bottom:16px}
.field{margin-bottom:12px}
label{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],input[type=url],textarea,select{font-family:'DM Sans',sans-serif;font-size:14px;width:100%;border:1px solid var(--border2);border-radius:var(--rs);padding:10px 12px;color:var(--text);background:var(--surface2);outline:none;-webkit-appearance:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--teal);background:var(--surface3)}
textarea{resize:vertical;min-height:80px;line-height:1.5}
select option{background:var(--surface2);color:var(--text)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.alert{border-radius:var(--r);padding:11px 14px;margin-bottom:1rem;font-size:13px;display:flex;align-items:flex-start;gap:8px}
.alert.warn{background:var(--gold2);border:1px solid rgba(245,166,35,.2);color:var(--gold)}
.alert.danger{background:var(--red2);border:1px solid rgba(255,71,87,.2);color:var(--red)}
.alert.success{background:var(--green2);border:1px solid rgba(46,213,115,.2);color:var(--green)}
.alert.info{background:var(--blue2);border:1px solid rgba(77,159,255,.2);color:var(--blue)}
.empty{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:14px}
.tw{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:6px;width:90%;max-width:400px;pointer-events:none}
.toast{background:var(--surface2);color:var(--text);font-size:13px;padding:11px 16px;border-radius:var(--rs);animation:tin .2s ease;text-align:center;border:1px solid var(--border2);pointer-events:all;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.toast.err{background:var(--red2);color:var(--red);border-color:rgba(255,71,87,.3)}
.toast.ok{background:var(--green2);color:var(--green);border-color:rgba(46,213,115,.3)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.ld{display:inline-block;width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.dp{max-height:0;overflow:hidden;transition:max-height .35s ease}
.dp.open{max-height:3000px}
.di{padding:14px}
.chev{transition:transform .2s;display:inline-block;color:var(--text3)}
.chev.open{transform:rotate(180deg)}
.search-bar{font-family:'DM Sans',sans-serif;font-size:14px;width:100%;border:1px solid var(--border2);border-radius:var(--rs);padding:10px 14px;color:var(--text);background:var(--surface2);outline:none;margin-bottom:1rem;transition:border-color .15s}
.search-bar:focus{border-color:var(--teal)}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.tag{font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid var(--border2);background:var(--surface2);cursor:pointer;color:var(--text2);transition:all .12s;font-weight:500}
.tag.active{background:var(--teal3);color:var(--teal);border-color:rgba(0,212,160,.25)}
@media(min-width:768px){
  .content{padding:1.5rem 2rem}
  .stats-row{grid-template-columns:repeat(4,1fr)}
  body{padding-bottom:0}
  .bottom-nav{display:none}
}

</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-logo">The Branding <span>Club</span></div>
  <div class="topbar-right"><span class="topbar-user" id="topbar-user"></span><button class="btn-lo" onclick="logout()">↩</button></div>
</div>
<div class="content" id="content"><div class="empty"><span class="ld dk"></span><br><br>Laden...</div></div>
<nav class="bottom-nav">
  <button class="bn-item " onclick="location.href='dashboard.html'"><span class="ic">🏠</span><span>Home</span><span class="bn-dot"></span></button>
  <button class="bn-item active" onclick="location.href='offertes.html'"><span class="ic">📋</span><span>Offertes</span><span class="bn-dot"></span></button>
  <button class="bn-item " onclick="location.href='feed.html'"><span class="ic">💬</span><span>Feed</span><span class="bn-dot"></span></button>
  <button class="bn-item " onclick="location.href='taken.html'"><span class="ic">✅</span><span>Taken</span><span class="bn-dot"></span></button>
  <button class="bn-item " onclick="location.href='meer.html'"><span class="ic">⋯</span><span>Meer</span><span class="bn-dot"></span></button>
</nav>
<div class="tw" id="tw"></div>

<!-- Offerte modal -->
<div class="overlay" id="ov-offerte" onclick="if(event.target===this)this.classList.remove('open')">
<div class="modal"><div class="modal-handle"></div>
<div class="mt" id="om-title">Offerte toevoegen</div>
<div class="ms">Vul de gegevens in van de verstuurde offerte</div>
<input type="hidden" id="om-id"/>
<div class="r2">
  <div class="field"><label>Bedrijfsnaam *</label><input type="text" id="om-bedrijf" placeholder="Bedrijf BV"/></div>
  <div class="field"><label>Contactpersoon</label><input type="text" id="om-contact" placeholder="Jan de Vries"/></div>
</div>
<div class="r2">
  <div class="field"><label>Offerte nummer</label><input type="text" id="om-nummer" placeholder="2026-0142"/></div>
  <div class="field"><label>Bedrag (€) *</label><input type="number" id="om-bedrag" placeholder="2500" min="0" step="100"/></div>
</div>
<div class="r2">
  <div class="field"><label>Datum verstuurd *</label><input type="date" id="om-datum"/></div>
  <div class="field"><label>Volgende actie</label><input type="date" id="om-actie"/></div>
</div>
<div class="field"><label>Status</label>
  <select id="om-status">
    <option value="verstuurd">📤 Verstuurd</option>
    <option value="follow_up">🔁 Follow-up</option>
    <option value="gewonnen">✅ Gewonnen</option>
    <option value="verloren">❌ Verloren</option>
  </select>
</div>
<div class="field"><label>Notitie</label><textarea id="om-notitie" placeholder="Bijv. klant twijfelt over aantal, belt terug na 10 juni..."></textarea></div>
<div class="field"><label>Offerte PDF uploaden</label>
  <input type="file" id="om-pdf" accept=".pdf" style="font-size:14px;padding:8px 0"/>
  <div id="om-pdf-huidig" style="font-size:12px;color:var(--text2);margin-top:4px"></div>
</div>
<div class="mf">
  <button onclick="document.getElementById('ov-offerte').classList.remove('open')">Annuleren</button>
  <button id="om-del" class="danger" onclick="deleteOfferte()" style="display:none">Verwijderen</button>
  <button class="primary" id="btn-om-s" onclick="saveOfferte()">Opslaan</button>
</div>
</div></div>

<script>
const SB='https://bstpobqvodljhpjzgnkp.supabase.co';
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdHBvYnF2b2RsamhwanpnbmtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MzEyODAsImV4cCI6MjA5NjEwNzI4MH0.zMy3hmD02DSCkVfAOh2URDqXm_WBFCYe8CgNkvWT_yI';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdHBvYnF2b2RsamhwanpnbmtwIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDUzMTI4MCwiZXhwIjoyMDk2MTA3MjgwfQ.2Nrgk7-TxZ-gIAFYhjcfNTFdm6g-6HaGIu3QGCEckPs';

function getSession(){try{return JSON.parse(localStorage.getItem('tbc_session'));}catch(e){return null;}}
function getMe(){try{return JSON.parse(localStorage.getItem('tbc_me'));}catch(e){return null;}}
function logout(){localStorage.removeItem('tbc_session');localStorage.removeItem('tbc_me');location.href='login.html';}
function hdr(svc=false){const s=getSession();const t=svc?SK:(s?s.access_token:'');return{'apikey':AK,'Authorization':'Bearer '+t,'Content-Type':'application/json','Prefer':'return=representation'};}
async function api(m,p,b,svc=false){const r=await fetch(SB+p,{method:m,headers:hdr(svc),body:b?JSON.stringify(b):undefined});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null;}
function eur(n){return'€'+Number(n||0).toLocaleString('nl-NL',{minimumFractionDigits:0,maximumFractionDigits:0});}
function fdt(d){if(!d)return'—';return new Date(d).toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'});}
function nowD(){return new Date().toISOString().slice(0,10);}
function toast(msg,tp=''){const el=document.createElement('div');el.className='toast'+(tp?' '+tp:'');el.textContent=msg;let tw=document.getElementById('tw');tw.appendChild(el);setTimeout(()=>el.remove(),3500);}
function isAdmin(me){return me&&me.rol==='admin';}

let me=null, offertes=[], profielen=[], activeFilter='all', editId=null;

async function checkAuth(){
  const s=getSession();
  if(!s||!s.access_token){localStorage.clear();location.replace('login.html');return null;}
  let m=getMe();
  if(m&&m.id)return m;
  try{
    const p=await api('GET','/rest/v1/profielen?id=eq.'+s.user.id);
    if(!p||!p.length)throw new Error();
    localStorage.setItem('tbc_me',JSON.stringify(p[0]));return p[0];
  }catch(e){localStorage.clear();location.replace('login.html');return null;}
}

async function init(){
  me=await checkAuth();if(!me)return;
  document.getElementById('topbar-user').textContent=me.naam||me.email;
  await loadData();
  render();
}

async function loadData(){
  if(isAdmin(me)){
    offertes=await api('GET','/rest/v1/offertes?order=datum_verstuurd.desc&select=*,profielen(naam,email)')||[];
    profielen=await api('GET','/rest/v1/profielen?rol=eq.gebruiker')||[];
  } else {
    offertes=await api('GET','/rest/v1/offertes?user_id=eq.'+me.id+'&order=datum_verstuurd.desc')||[];
  }
}

function dagsDiff(datum){
  if(!datum)return null;
  return Math.floor((new Date()-new Date(datum))/(1000*60*60*24));
}

function render(){
  const filtered=activeFilter==='all'?offertes:offertes.filter(o=>o.status===activeFilter);

  // Stats
  const open=offertes.filter(o=>o.status!=='gewonnen'&&o.status!=='verloren');
  const gewonnen=offertes.filter(o=>o.status==='gewonnen');
  const pipelineBedrag=open.reduce((s,o)=>s+(o.bedrag||0),0);
  const gewonnenBedrag=gewonnen.reduce((s,o)=>s+(o.bedrag||0),0);
  const followUpNodig=open.filter(o=>o.volgende_actie&&o.volgende_actie<=nowD()).length;

  let h=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
    <div><div style="font-size:18px;font-weight:700">Offertes</div><div style="font-size:12px;color:var(--text2)">${offertes.length} totaal</div></div>
    <button class="primary sm" onclick="openModal()">+ Nieuwe offerte</button>
  </div>`;

  h+=`<div class="stats-row">
    <div class="stat"><div class="sv cn">${eur(pipelineBedrag)}</div><div class="sl">Open pipeline</div><div class="ss">${open.length} offertes</div></div>
    <div class="stat"><div class="sv cg">${eur(gewonnenBedrag)}</div><div class="sl">Gewonnen</div><div class="ss">${gewonnen.length} offertes</div></div>
  </div>`;

  if(followUpNodig>0){
    h+=`<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:var(--r);padding:10px 14px;margin-bottom:1rem;font-size:13px;color:#92400e">
      ⚠️ <strong>${followUpNodig} offerte${followUpNodig>1?'s':''}</strong> wacht${followUpNodig===1?'':'en'} op follow-up actie
    </div>`;
  }

  // Filter tabs
  h+=`<div class="tag-row">
    <span class="tag${activeFilter==='all'?' active':''}" onclick="activeFilter='all';render()">Alles (${offertes.length})</span>
    <span class="tag${activeFilter==='verstuurd'?' active':''}" onclick="activeFilter='verstuurd';render()">📤 Verstuurd (${offertes.filter(o=>o.status==='verstuurd').length})</span>
    <span class="tag${activeFilter==='follow_up'?' active':''}" onclick="activeFilter='follow_up';render()">🔁 Follow-up (${offertes.filter(o=>o.status==='follow_up').length})</span>
    <span class="tag${activeFilter==='gewonnen'?' active':''}" onclick="activeFilter='gewonnen';render()">✅ Gewonnen (${offertes.filter(o=>o.status==='gewonnen').length})</span>
    <span class="tag${activeFilter==='verloren'?' active':''}" onclick="activeFilter='verloren';render()">❌ Verloren (${offertes.filter(o=>o.status==='verloren').length})</span>
  </div>`;

  if(!filtered.length){
    h+=`<div class="empty">Geen offertes${activeFilter!=='all'?' in deze categorie':''}.<br><br><button class="primary" onclick="openModal()">+ Eerste offerte toevoegen</button></div>`;
  } else {
    filtered.forEach(o=>{
      const dagen=dagsDiff(o.datum_verstuurd);
      const actieLaat=o.volgende_actie&&o.volgende_actie<=nowD()&&o.status!=='gewonnen'&&o.status!=='verloren';
      const statusLabels={'verstuurd':'📤 Verstuurd','follow_up':'🔁 Follow-up','gewonnen':'✅ Gewonnen','verloren':'❌ Verloren'};
      const eigenaar=isAdmin(me)&&o.profielen?` · ${o.profielen.naam||o.profielen.email}`:'';

      h+=`<div class="offerte-card${actieLaat?' follow-up-laat':''}${o.status==='verloren'?' verloren':''}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div style="flex:1">
            <div style="font-size:15px;font-weight:700">${o.bedrijfsnaam}</div>
            <div style="font-size:12px;color:var(--text2);margin-top:2px">
              ${o.contactpersoon||''}${o.offerte_nummer?' · #'+o.offerte_nummer:''}${eigenaar}
            </div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:16px;font-weight:700">${eur(o.bedrag)}</div>
            <div style="font-size:11px;color:var(--text2)">${fdt(o.datum_verstuurd)}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;flex-wrap:wrap;gap:6px">
          <span class="badge b-${o.status}">${statusLabels[o.status]||o.status}</span>
          <div style="display:flex;gap:6px;align-items:center">
            ${o.volgende_actie?`<span style="font-size:11px;color:${actieLaat?'var(--amber)':'var(--muted)'}">📅 ${fdt(o.volgende_actie)}</span>`:''}
            ${o.pdf_url?`<button class="sm" onclick="window.open('${o.pdf_url}','_blank')" style="font-size:11px;padding:3px 8px">📄 PDF</button>`:''}
            <button class="sm" onclick="openModal(${o.id})" style="font-size:11px;padding:3px 8px">✏️ Bewerk</button>
          </div>
        </div>
        ${o.notitie?`<div style="margin-top:8px;font-size:12px;color:var(--text2);font-style:italic;border-top:1px solid var(--border);padding-top:8px">💬 ${o.notitie}</div>`:''}
        ${actieLaat?`<div style="margin-top:6px;font-size:12px;color:var(--amber);font-weight:600">⚠️ Follow-up actie was ${fdt(o.volgende_actie)}</div>`:''}
      </div>`;
    });
  }

  document.getElementById('content').innerHTML=h;
}

function openModal(id=null){
  editId=id;
  document.getElementById('om-title').textContent=id?'Offerte bewerken':'Offerte toevoegen';
  document.getElementById('om-del').style.display=id?'inline-flex':'none';
  document.getElementById('om-pdf-huidig').textContent='';

  if(id){
    const o=offertes.find(x=>x.id===id);
    if(!o)return;
    document.getElementById('om-id').value=o.id;
    document.getElementById('om-bedrijf').value=o.bedrijfsnaam||'';
    document.getElementById('om-contact').value=o.contactpersoon||'';
    document.getElementById('om-nummer').value=o.offerte_nummer||'';
    document.getElementById('om-bedrag').value=o.bedrag||'';
    document.getElementById('om-datum').value=o.datum_verstuurd||nowD();
    document.getElementById('om-actie').value=o.volgende_actie||'';
    document.getElementById('om-status').value=o.status||'verstuurd';
    document.getElementById('om-notitie').value=o.notitie||'';
    if(o.pdf_url) document.getElementById('om-pdf-huidig').textContent='Huidig: '+o.pdf_url.split('/').pop();
  } else {
    document.getElementById('om-id').value='';
    document.getElementById('om-bedrijf').value='';
    document.getElementById('om-contact').value='';
    document.getElementById('om-nummer').value='';
    document.getElementById('om-bedrag').value='';
    document.getElementById('om-datum').value=nowD();
    document.getElementById('om-actie').value='';
    document.getElementById('om-status').value='verstuurd';
    document.getElementById('om-notitie').value='';
  }
  document.getElementById('om-pdf').value='';
  document.getElementById('ov-offerte').classList.add('open');
}

async function uploadPDF(file, offerteNummer){
  if(!file)return null;
  const s=getSession();
  const ext=file.name.split('.').pop();
  const path=`${me.id}/${offerteNummer||Date.now()}.${ext}`;
  const r=await fetch(`${SB}/storage/v1/object/offertes/${path}`,{
    method:'POST',
    headers:{'apikey':AK,'Authorization':'Bearer '+s.access_token,'Content-Type':file.type,'x-upsert':'true'},
    body:file
  });
  if(!r.ok){
    const err=await r.text();
    // Storage bucket bestaat mogelijk niet — sla URL op als null
    console.warn('PDF upload mislukt:', err);
    return null;
  }
  return `${SB}/storage/v1/object/public/offertes/${path}`;
}

async function saveOfferte(){
  const bedrijf=document.getElementById('om-bedrijf').value.trim();
  const bedrag=parseFloat(document.getElementById('om-bedrag').value);
  const datum=document.getElementById('om-datum').value;
  if(!bedrijf){toast('Vul bedrijfsnaam in.','err');return;}
  if(isNaN(bedrag)){toast('Vul een bedrag in.','err');return;}
  if(!datum){toast('Vul een datum in.','err');return;}

  const btn=document.getElementById('btn-om-s');
  btn.disabled=true;btn.innerHTML='<span class="ld"></span>';

  try{
    const pdfFile=document.getElementById('om-pdf').files[0];
    const nummer=document.getElementById('om-nummer').value.trim();
    let pdfUrl=null;

    if(pdfFile){
      pdfUrl=await uploadPDF(pdfFile, nummer||bedrijf.replace(/\s+/g,'-').toLowerCase());
    }

    const body={
      bedrijfsnaam:bedrijf,
      contactpersoon:document.getElementById('om-contact').value.trim()||null,
      offerte_nummer:nummer||null,
      bedrag,
      datum_verstuurd:datum,
      volgende_actie:document.getElementById('om-actie').value||null,
      status:document.getElementById('om-status').value,
      notitie:document.getElementById('om-notitie').value.trim()||null,
      bijgewerkt_op:new Date().toISOString()
    };

    if(pdfUrl) body.pdf_url=pdfUrl;

    const id=document.getElementById('om-id').value;
    if(id){
      await api('PATCH','/rest/v1/offertes?id=eq.'+id,body);
      toast('Offerte bijgewerkt.','ok');
    } else {
      body.user_id=me.id;
      body.regio_id=me.regio_id||null;
      await api('POST','/rest/v1/offertes',body);
      toast('Offerte toegevoegd! ✅','ok');
    }

    document.getElementById('ov-offerte').classList.remove('open');
    await loadData();render();
  }catch(e){
    toast('Fout: '+e.message,'err');
  }finally{
    btn.disabled=false;btn.innerHTML='Opslaan';
  }
}

async function deleteOfferte(){
  const id=document.getElementById('om-id').value;
  if(!id)return;
  if(!confirm('Offerte verwijderen?'))return;
  try{
    await api('DELETE','/rest/v1/offertes?id=eq.'+id);
    document.getElementById('ov-offerte').classList.remove('open');
    await loadData();render();toast('Offerte verwijderd.','ok');
  }catch(e){toast('Fout: '+e.message,'err');}
}

init();
</script>
</body>
