<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0B1F3A;--navy-l:#1E3A5F;--teal:#4FD1A5;--teal-d:#3ab891;--bg:#f0f2f5;--card:#fff;--border:#e2e5ea;--text:#1a1f2e;--muted:#6b7280;--red:#dc2626;--amber:#d97706;--green:#16a34a;--blue:#2563eb;--r:10px;--rs:6px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
.topbar{background:var(--navy);padding:0 1rem;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:40;height:60px}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:none;transition:color .15s;padding:0;position:relative}

.bn-item .ic{font-size:20px;line-height:1}
.bn-badge{position:absolute;top:6px;right:calc(50% - 18px);background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:99px}

.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}

.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1.25rem}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.stat.click{cursor:pointer;transition:border-color .15s}

.cr{color:var(--red)}.ca{color:var(--amber)}.cg{color:var(--green)}.cb{color:var(--blue)}.cn{color:var(--navy)}
button{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border-radius:var(--rs);border:1px solid var(--border);background:var(--card);color:var(--text);padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s}
button:hover{background:#f0f2f5}
button:disabled{opacity:.4;cursor:not-allowed}
button.teal{background:var(--teal);color:var(--navy);border-color:var(--teal);font-weight:600}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:1rem}
.card-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}

label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=month],textarea,select{font-family:'DM Sans',sans-serif;font-size:15px;width:100%;border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;color:var(--text);background:var(--card);outline:none;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--teal)}

.pf.am{background:var(--amber)}.pf.re{background:var(--red)}
.alert{border-radius:var(--r);padding:12px 16px;margin-bottom:1rem;font-size:13px}
.alert.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}

.divider{border:none;border-top:1px solid var(--border);margin:12px 0}
.tw{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:6px;width:90%;max-width:400px}
.toast{background:var(--navy);color:#fff;font-size:13px;padding:10px 16px;border-radius:var(--rs);animation:tin .2s ease;text-align:center}
.toast.err{background:var(--red)}.toast.ok{background:var(--green)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ld{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.ld.dk{border-color:rgba(0,0,0,.1);border-top-color:var(--navy)}
@keyframes sp{to{transform:rotate(360deg)}}
.section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:1rem 0 .5rem}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.75rem}
.tag{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:background .12s}
.tag.active{background:var(--navy);color:#fff;border-color:var(--navy)}
</style>

<script>
const SB='https://bstpobqvodljhpjzgnkp.supabase.co';
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdHBvYnF2b2RsamhwanpnbmtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MzEyODAsImV4cCI6MjA5NjEwNzI4MH0.zMy3hmD02DSCkVfAOh2URDqXm_WBFCYe8CgNkvWT_yI';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzdHBvYnF2b2RsamhwanpnbmtwIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDUzMTI4MCwiZXhwIjoyMDk2MTA3MjgwfQ.2Nrgk7-TxZ-gIAFYhjcfNTFdm6g-6HaGIu3QGCEckPs';

function getSession(){try{return JSON.parse(localStorage.getItem('tbc_session'));}catch(e){return null;}}
function getMe(){try{return JSON.parse(localStorage.getItem('tbc_me'));}catch(e){return null;}}
function setMe(p){localStorage.setItem('tbc_me',JSON.stringify(p));}
function logout(){localStorage.removeItem('tbc_session');localStorage.removeItem('tbc_me');location.href='login.html';}
function hdr(svc=false){const s=getSession();const t=svc?SK:(s?s.access_token:'');return{'apikey':AK,'Authorization':'Bearer '+t,'Content-Type':'application/json','Prefer':'return=representation'};}
async function api(m,p,b,svc=false){const r=await fetch(SB+p,{method:m,headers:hdr(svc),body:b?JSON.stringify(b):undefined});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null;}
async function aApi(m,p,b,svc=false){const s=getSession();const tk=svc?SK:(s?s.access_token:'');const r=await fetch(SB+p,{method:m,headers:{'apikey':AK,'Authorization':'Bearer '+tk,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null;}
function v(id){return(document.getElementById(id)?.value||'').trim();}
function eur(n){return'€'+Number(n||0).toLocaleString('nl-NL',{minimumFractionDigits:0,maximumFractionDigits:0});}
function fdt(d){return new Date(d).toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'numeric'});}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0;}
function nowM(){return new Date().toISOString().slice(0,7);}
function nowD(){return new Date().toISOString().slice(0,10);}
function toast(msg,tp=''){const el=document.createElement('div');el.className='toast'+(tp?' '+tp:'');el.textContent=msg;let tw=document.getElementById('tw');if(!tw){tw=document.createElement('div');tw.id='tw';tw.className='tw';document.body.appendChild(tw);}tw.appendChild(el);setTimeout(()=>el.remove(),3500);}
function esc(s){return String(s).split("'").join("&apos;");}
async function refreshSession(){
  const s=getSession();
  if(!s||!s.refresh_token) return null;
  try{
    const res=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',
      headers:{'apikey':AK,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:s.refresh_token})
    });
    if(!res.ok) return null;
    const data=await res.json();
    if(data.access_token){
      localStorage.setItem('tbc_session',JSON.stringify(data));
      return data;
    }
  }catch(e){}
  return null;
}

async function checkAuth(){
  let s=getSession();
  if(!s||!s.access_token){localStorage.clear();location.replace('login.html');return null;}
  
  // Check if token is expired or about to expire (within 10 min)
  try{
    const payload=JSON.parse(atob(s.access_token.split('.')[1]));
    const expiresIn=(payload.exp*1000)-Date.now();
    if(expiresIn<600000){ // less than 10 minutes
      const newSession=await refreshSession();
      if(newSession) s=newSession;
      else if(expiresIn<0){localStorage.clear();location.replace('login.html');return null;}
    }
  }catch(e){}

  const me=getMe();
  if(me&&me.id)return me;
  try{
    const p=await api('GET','/rest/v1/profielen?id=eq.'+s.user.id);
    if(!p||!p.length)throw new Error('no profile');
    setMe(p[0]);return p[0];
  }catch(e){
    // Try refresh before giving up
    const newSession=await refreshSession();
    if(newSession){
      try{
        const p2=await api('GET','/rest/v1/profielen?id=eq.'+s.user.id);
        if(p2&&p2.length){setMe(p2[0]);return p2[0];}
      }catch(e2){}
    }
    localStorage.clear();location.replace('login.html');return null;
  }
}
function isAdmin(me){return me&&me.rol==='admin';}
function isRegioAdmin(me){return me&&(me.rol==='admin'||me.rol==='regio_admin');}
function isSuperAdmin(me){return me&&me.rol==='admin';}


let me=null, taken=[], profielen=[], regios=[];
let editTaakId=null, viewUserId=null;
let filterStatus='open', filterPrio='all', filterCat='all';

async function init(){
  me=await checkAuth(); if(!me)return;
  document.getElementById('topbar-user').textContent=me.naam||me.email;
  await loadData();
  render();
}

async function loadData(){
  const isA=isAdmin(me);
  const today=nowD();
  const tu=isA?'/rest/v1/taken?order=datum.asc,prioriteit.asc&select=*,profielen(naam,email)':'/rest/v1/taken?user_id=eq.'+me.id+'&order=datum.asc,prioriteit.asc';
  taken=await api('GET',tu)||[];
  if(isA){
    profielen=await api('GET','/rest/v1/profielen')||[];
    regios=await api('GET','/rest/v1/regios?order=naam.asc')||[];
  }
  // Auto-rollover overdue tasks to today
  const overdue=taken.filter(t=>t.user_id===me.id&&!t.voltooid&&t.datum<today);
  for(const t of overdue){
    try{await api('PATCH','/rest/v1/taken?id=eq.'+t.id,{datum:today});}catch(e){}
    t.datum=today;
  }
}

let openKlant=null;
const catColors={'algemeen':'b-user','klant':'b-open','intern':'b-behandeling','prospectie':'b-opgelost'};
const prioColors={1:'cr',2:'ca',3:'cg'};
const prioLabels={1:'🔴 Hoog',2:'🟡 Normaal',3:'🟢 Laag'};

function filtered(takens){
  let t=takens;
  if(filterStatus==='open') t=t.filter(x=>!x.voltooid);
  else if(filterStatus==='done') t=t.filter(x=>x.voltooid);
  if(filterPrio!=='all') t=t.filter(x=>x.prioriteit===parseInt(filterPrio));
  if(filterCat!=='all') t=t.filter(x=>x.categorie===filterCat);
  return t;
}

function render(){
  const isA=isAdmin(me);
  const uid=viewUserId||me.id;
  const myTaken=taken.filter(t=>t.user_id===uid);
  const filt=filtered(myTaken);

  let h=`<div class="page-header"><div><div class="page-title">Taken</div></div><button class="teal sm" onclick="openTaakModal()">+ Taak</button></div>`;

  // Stats
  const open=myTaken.filter(t=>!t.voltooid);
  const done=myTaken.filter(t=>t.voltooid);
  const high=open.filter(t=>t.prioriteit===1);
  h+=`<div class="stats-row">
    <div class="stat click${filterStatus==='open'?' act':''}" onclick="filterStatus='open';render()"><div class="sv cr">${open.length}</div><div class="sl">Open</div></div>
    <div class="stat click${filterStatus==='done'?' act':''}" onclick="filterStatus='done';render()"><div class="sv cg">${done.length}</div><div class="sl">Afgerond</div></div>
    <div class="stat click${filterStatus==='high'?' act':''}" onclick="filterStatus='all';filterPrio='1';render()"><div class="sv cr">${high.length}</div><div class="sl">🔴 Hoog</div></div>
    <div class="stat click${filterStatus==='all'&&filterPrio==='all'?' act':''}" onclick="filterStatus='all';filterPrio='all';filterCat='all';render()"><div class="sv cn">${myTaken.length}</div><div class="sl">Totaal</div></div>
  </div>`;

  // User switcher for admin
  if(isA){
    h+=`<div class="tag-row">
      <span class="tag${viewUserId===me.id?' active':''}" onclick="viewUserId=me.id;render()">Mijn taken</span>
      <span class="tag${!viewUserId?' active':''}" onclick="viewUserId=null;render()">Iedereen</span>`;
    profielen.filter(u=>u.rol!=='admin').forEach(u=>{
      h+=`<span class="tag${viewUserId===u.id?' active':''}" onclick="viewUserId='${u.id}';render()">${u.naam||u.email}</span>`;
    });
    h+=`</div>`;
  }

  // Filter tabs
  h+=`<div class="tag-row">
    <span class="tag${filterCat==='all'?' active':''}" onclick="filterCat='all';render()">Alle</span>
    <span class="tag${filterCat==='klant'?' active':''}" onclick="filterCat='klant';render()">Klant</span>
    <span class="tag${filterCat==='intern'?' active':''}" onclick="filterCat='intern';render()">Intern</span>
    <span class="tag${filterCat==='prospectie'?' active':''}" onclick="filterCat='prospectie';render()">Prospectie</span>
    <span class="tag${filterCat==='algemeen'?' active':''}" onclick="filterCat='algemeen';render()">Algemeen</span>
  </div>`;

  if(!filt.length){
    h+=`<div class="empty">Geen taken gevonden.</div>`;
    document.getElementById('content').innerHTML=h;
    return;
  }

  // Group by klant (categorie=klant) or by categorie
  // First show klant-tagged tasks grouped by tekst prefix (first word as klant)
  // Actually group by categorie then within klant group by first segment
  const groups={};
  filt.forEach(t=>{
    // Use klant naam if set, else categorie
    const grp = t.categorie==='klant' ? ('klant:' + (t.klant_naam||'Klant')) : t.categorie;
    if(!groups[grp]) groups[grp]=[];
    groups[grp].push(t);
  });

  // Sort groups: hoog prio first
  const sortedGroups=Object.keys(groups).sort((a,b)=>{
    const aMin=Math.min(...groups[a].map(t=>t.prioriteit));
    const bMin=Math.min(...groups[b].map(t=>t.prioriteit));
    return aMin-bMin;
  });

  sortedGroups.forEach(grp=>{
    const items=groups[grp];
    const isOpen=openKlant===grp;
    const openCount=items.filter(t=>!t.voltooid).length;
    const label=grp.startsWith('klant:')?grp.slice(6):grp.charAt(0).toUpperCase()+grp.slice(1);
    const topPrio=Math.min(...items.map(t=>t.prioriteit));

    h+=`<div class="card">
      <div class="card-row click${isOpen?' act':''}" onclick="openKlant=openKlant==='${grp}'?null:'${grp}';render()">
        <div><div class="row-main">${label}</div><div class="row-sub">${items.length} taak${items.length!==1?'en':''}${openCount>0?' · '+openCount+' open':''}</div></div>
        <div class="row-right">
          <span class="badge ${catColors[items[0].categorie]||'b-user'}">${items[0].categorie}</span>
          <span style="font-size:13px">${prioLabels[topPrio]?.split(' ')[0]||''}</span>
          <span class="chev${isOpen?' open':''}">▼</span>
        </div>
      </div>
      <div class="dp${isOpen?' open':''}"><div class="di">`;

    // Sort items within group: prio then date
    items.sort((a,b)=>a.prioriteit-b.prioriteit||a.datum.localeCompare(b.datum));
    items.forEach(t=>{
      const canEdit=t.user_id===me.id||isA;
      h+=`<div style="background:var(--bg);border-radius:var(--rs);padding:10px 12px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;${t.voltooid?'opacity:.55':''}">
        <input type="checkbox" ${t.voltooid?'checked':''} onchange="toggleTaak(${t.id})" style="width:18px;height:18px;margin-top:2px;flex-shrink:0;accent-color:var(--teal)"/>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:500;${t.voltooid?'text-decoration:line-through':''}">${t.tekst}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:3px">${prioLabels[t.prioriteit]} · ${fdt(t.datum)}</div>
        </div>
        ${canEdit?`<div style="display:flex;gap:6px"><button class="sm" onclick="openTaakModal(${t.id})">✏️</button><button class="sm danger" onclick="delTaak(${t.id})">🗑</button></div>`:''}
      </div>`;
    });

    h+=`</div></div></div>`;
  });

  document.getElementById('content').innerHTML=h;
}

function openTaakModal(id){
  const t=id?taken.find(x=>x.id===id):null;
  editTaakId=id||null;
  document.getElementById('tk-t').value=t?t.tekst:'';
  document.getElementById('tk-c').value=t?t.categorie:'klant';
  document.getElementById('tk-p').value=t?t.prioriteit:2;
  document.getElementById('tk-d').value=t?t.datum:nowD();
  document.getElementById('tk-kn').value=t?t.klant_naam||'':'';
  toggleKlantNaam();
  document.getElementById('ov-taak').classList.add('open');
}

function toggleKlantNaam(){
  const cat=document.getElementById('tk-c').value;
  document.getElementById('tk-kn-wrap').style.display=cat==='klant'?'block':'none';
}

async function saveTaak(){
  const tekst=document.getElementById('tk-t').value.trim();
  const cat=document.getElementById('tk-c').value;
  const kn=document.getElementById('tk-kn').value.trim();
  if(!tekst){toast('Vul een taak in.');return;}
  const btn=document.getElementById('btn-tk-s');btn.disabled=true;btn.innerHTML='<span class="ld"></span>';
  try{
    const body={tekst,categorie:cat,prioriteit:parseInt(document.getElementById('tk-p').value),datum:document.getElementById('tk-d').value,user_id:me.id,klant_naam:cat==='klant'?kn||null:null};
    if(editTaakId) await api('PATCH','/rest/v1/taken?id=eq.'+editTaakId,body);
    else await api('POST','/rest/v1/taken',body);
    document.getElementById('ov-taak').classList.remove('open');
    await loadData();render();toast('Taak opgeslagen.','ok');
  }catch(e){toast('Fout: '+e.message,'err');}finally{btn.disabled=false;btn.innerHTML='Opslaan';}
}

async function toggleTaak(id){
  const t=taken.find(x=>x.id===id);if(!t)return;
  const vol=!t.voltooid;
  try{await api('PATCH','/rest/v1/taken?id=eq.'+id,{voltooid:vol,voltooid_op:vol?new Date().toISOString():null});t.voltooid=vol;render();if(vol)toast('Taak afgerond! ✓','ok');}
  catch(e){toast('Fout: '+e.message,'err');}
}

async function delTaak(id){
  if(!confirm('Verwijderen?'))return;
  try{await api('DELETE','/rest/v1/taken?id=eq.'+id);taken=taken.filter(t=>t.id!==id);render();toast('Verwijderd.');}
  catch(e){toast('Fout: '+e.message,'err');}
}

init();

</script>
</body>
</html>
